STRUCT["hied"]={"0": [["Point", "There may be no institution more fundamental to sociology than higher education."], ["Reason", "Most sociologists are employed at colleges and universities."], ["Turn", "{Yet} higher education remains without an intellectually coherent sociology."], ["Problem", "{Instead}, the varied and empirically rich sociological work on higher education is scattered throughout the field."], ["Plan", "Our review moves to redress this situation by integrating the diverse sociological scholarship on higher education."]], "1": [["Main idea", "We identify some of the central metaphors sociologists have invoked or implied when describing higher education, explaining that sociologists have conceived of higher education systems as sieves for regulating the mobility processes underlying the allocation of privileged positions in the society, incubators for the development of competent social actors, and temples for the legitimation of official knowledge."], ["Claim", "The peculiar location of higher education at the intersection of multiple institutions encourages us to argue that higher education should {also} be seen as a hub, connecting multiple social processes that often are regarded as distinct."]], "2": [["Point", "We use these metaphors as heuristic devices, recognizing that each has its limits."], ["Definition", "Metaphors, by definition, are imaginative interpretations and summaries of reality; their job is to illuminate features of a phenomenon that more mundane descriptions would not reveal."], ["Reason", "{Because} our intent is to spur novel analytic paths through a substantive field that many may think already well traveled, the use of provocative if perhaps imperfect imagery seems justified."]], "3": [["Point", "Sociologists long have recognized that schooling is central to stratification in modern societies, as the allocation of occupational positions is done largely on the basis of educational attainment."], ["Common view", "The notion that formal education might serve as a meritocratic mechanism of social mobility has been an animating ideal for many social scientists and social reformers for over a century."], ["Turn", "{Nevertheless} formal education has been less of a ladder than a “social sieve,” regulating access to privileged social positions."], ["Main idea", "Max Weber’s core insight that education has a dual character—both facilitating and constraining social opportunity—has informed most subsequent stratification scholarship."]], "4": [["Evidence", "Blau & Duncan demonstrated that for the cohort they examined in the United States, occupational destinations were strongly associated with educational attainment {but} that this attainment itself was greatly, though not entirely, determined by family background."], ["Evidence", "Subsequent research has repeatedly demonstrated that socioeconomic background predicts college entrance and completion, holding other factors constant."], ["Result", "The role of social background in predicting college admission has generated an enduring discussion about the fairness of college admissions."]], "5": [["Finding", "{For example}, community college degrees have benefits relative to high school diplomas {but}, perhaps not surprisingly, lower labor market returns than four-year degrees."], ["Surprise", "Differences among four-year colleges such as admissions selectivity, {however}, have only relatively small effects on adult earnings relative to attending other four-year colleges."], ["Exception", "The notable exception occurs at the very most selective, elite U.S. colleges, which serve a demonstrable mobility function for nonwhite students."], ["Conclusion", "{In the most general terms}, {however}, completion of any four-year degree is likely a watershed event in individual biographies."]], "6": [["Background", "Stratification scholars have shown that higher education is associated not only with occupational attainment and marital outcomes, {but also} with other outcomes of interest, for example health, happiness, sociopolitical attitudes, civic participation, cosmopolitanism, cultural taste, and social capital."], ["Turn", "{However} they have attended less to how the process of moving through college contributes to these outcomes."], ["Problem", "In general, though, sociologists have attended much more carefully to the lived experiences of students in elementary and secondary schools than they have to those in college."], ["Conclusion", "This is a significant oversight, leaving us with an incomplete understanding of just how college attendance impacts so many arenas of life."]], "7": [["Claim", "Colleges and universities are quintessentially social places, shaping the number, quality, and type of social ties that particular individuals and groups enjoy."], ["Evidence", "We know that the number and kind of ties students build while in college are associated with patterns of academic achievement and degree completion."], ["Reason", "These ties may have myriad lifelong consequences, as people often find jobs, marriage partners, medical care, homes, and schools for their children through people they know."], ["Term", "Classic studies of U.S. higher education suggest that colleges and universities, especially elite ones, are important sites for the coalescence of privileged identities, group boundaries, and social networks—in a word, incubators for young adults and the relationships that solidify and divide them into groups."]], "8": [["Background", "For Talcott Parsons, the primary purpose of higher education was to preserve, promote, and inculcate the modern “cognitive complex,” a rational, universalistic mode of thinking."], ["Explains", "In this approach formal education not only certifies social capacities, it produces a distinctive kind of social actor: the legally and normatively autonomous, rights-bearing, rationally cognizant citizen of Enlightenment modernity."], ["Explains", "{Because} this production process entails the formal organization of knowledge into curriculum, it {also} defines what counts as legitimate knowledge."], ["Main idea", "As the organizational instantiation of intellectual progress, the university is the secular temple of modern societies."]], "9": [["Main idea", "We propose that higher education is a hub connecting some of the most prominent institutional sectors of modern societies: the labor market and the larger economy, the professions and the sciences, the philanthropic sector, the family, and the nation-state."], ["Condition", "This structural arrangement is historically specific and cross-nationally variable, {but} in certain times and places, higher education systems are key sites where institutions intersect."], ["Evidence", "Over the course of 50 years and through the massive financial largesse of state and federal governments, U.S. universities became virtually unavoidable passageways into the upper middle class and central nodes in the professional networks of literally all fields of expert knowledge and practice."]], "10": [["Point", "{First}, the presumption that higher education does its work on individuals should not lead us to ignore the fact that people experience schooling as a thick web of relationships."], ["Explains", "Students are {also} nodes in networks that supply them with much of what they need to get through school: money, advice, friendship, emotional nurturance, and information."], ["Point", "{Second}, the presumption that higher education is primarily a credentialing system should not limit our consideration of other significant aspects of schooling."], ["Conclusion", "Ultimately our guiding image of the hub is not merely a rhetorical device {but} a theory about the sociological significance of universities: They are central to the infrastructure of modernity, connecting modern societies’ major institutions even while they remain officially independent and intermittently critical of them."]]};GSENT["hied"]={"0": ["Colleges matter a lot to sociology.", "Most sociologists work at colleges!", "But there is no clear, joined-up sociology of college.", "The research on college is spread out in many places.", "This paper tries to fix that by bringing the research together."], "1": ["Researchers have pictured college in three ways: a sieve that decides who gets good positions, an incubator that grows capable young adults, and a temple that makes knowledge official.", "The authors add a fourth picture: a hub, where many parts of society meet."], "2": ["These pictures are thinking tools, and each one has limits.", "A {{metaphor|metaphor}} is a creative way to describe something. It can show things that plain words would miss.", "The authors want fresh ideas in an old field, so bold pictures are worth it, even if they aren’t perfect."], "3": ["School decides a lot about who ends up higher or lower in society, because jobs go to people with more schooling.", "For 100 years, people hoped school would be fair: work hard and you move up.", "But school works less like a ladder and more like a {{sieve|sieve}}: it lets some people through to the top and keeps others out.", "An old idea: school both opens doors and closes them."], "4": ["A famous study found that your job depends on your schooling. But your schooling depends a lot on your family.", "Study after study shows that family money and schooling predict who goes to college and who finishes.", "So people keep arguing about whether college admissions are fair."], "5": ["A two-year college degree helps more than a high school diploma, but less than a four-year degree.", "Surprise: going to a hard-to-get-into college instead of an ordinary one changes pay only a little.", "Except at the very top colleges, which really help students of color move up.", "Overall, finishing any four-year degree is a turning point in a person’s life."], "6": ["College is linked to better jobs and marriages, and also to health, happiness, voting, culture and who you know.", "But researchers haven’t looked much at how college life causes these things.", "They studied kids in elementary and high school much more than college students.", "That’s a big miss: we don’t fully know how college changes so many parts of life."], "7": ["Colleges are social places. They shape how many friends and connections you have, and what kind.", "The friends you make in college are linked to your grades and whether you finish.", "These ties matter for life: people find jobs, partners, doctors, homes and schools through people they know.", "So colleges, especially top ones, are “incubators”: warm places where young adults grow, form groups, and get sorted."], "8": ["One sociologist said college’s main job is to teach a modern, logical way of thinking.", "Others said school doesn’t just give out diplomas. It makes a kind of person: a free, thinking citizen with rights.", "And by choosing what to teach, school decides what counts as real knowledge.", "So the university is like a temple for modern society, but for knowledge, not religion."], "9": ["The authors’ big idea: college is a {{hub|hub}} that connects jobs and the economy, science, charities, families and the government.", "This isn’t true everywhere or always, but in some times and places, college is where these parts of society meet.", "Over 50 years, with lots of government money, U.S. colleges became almost the only door into the upper middle class, and the center of every expert field."], "10": ["First, college isn’t only about single people. Students live in a thick web of relationships.", "Those webs give them money, advice, friends, care and information to get through school.", "Second, college does more than hand out degrees.", "In the end, “hub” is more than a nice picture. It is the authors’ theory: colleges hold modern society together, even while they stay independent and sometimes criticize it."]};ROLE["hied"]={"0": ["hook", "opens with a surprise: sociology lives in colleges but hasn’t studied them well"], "1": ["plan", "introduces the four metaphors"], "2": ["reason", "explains why metaphors are useful (and limited)"], "3": ["claim", "sets up the “sieve” picture: a ladder or a filter?"], "4": ["evidence", "the key evidence: family background"], "5": ["finding", "what kind of college matters, and what doesn’t"], "6": ["counter", "points to a gap in research"], "7": ["claim", "the incubator picture: college grows networks"], "8": ["term", "the temple picture: making knowledge official"], "9": ["claim", "the authors’ new picture: the hub"], "10": ["conclusion", "the lesson: students live in webs, and college does more than give degrees"]};
SEC["hied"]=[
 {id:"hd1",t:"Four pictures of college",paras:[0, 1, 2],look:"What four pictures do the authors use to describe college?",logic:{"q": "Why do the authors use metaphors (sieve, incubator, temple, hub) instead of plain descriptions?", "o": ["Because metaphors are more exact than numbers", "Because a good picture can show features of college that plain descriptions miss, even if each picture has limits", "Because they want to make the paper longer"], "a": 1, "why": "They call metaphors “imaginative interpretations” whose job is “to illuminate features … that more mundane descriptions would not reveal,” and they admit “each has its limits.”"},keys:[["College research is scattered; the authors want to bring it together",/scatter|together|integrat|coherent|no clear/i],["Sieve: sorts people into social positions",/sieve|sort/i],["Incubator: grows young adults and their friendships/networks",/incubat|grow|develop/i],["Temple: makes knowledge official; Hub: connects many parts of society",/temple|official|knowledge|hub|connect/i]],model:"The authors say research on college is scattered, so they bring it together with four pictures. College is a sieve that sorts people into better or worse positions, an incubator that grows young adults and their friendships, a temple that makes knowledge official, and a hub that connects family, jobs, science, government and more."},
 {id:"hd2",t:"Sieve",paras:[3, 4, 5],look:"Is college a ladder or a sieve? What decides who gets through?",logic:{"q": "What does it mean to call college “less of a ladder than a social sieve”?", "o": ["College helps everyone climb equally", "College does let some people move up, but it also filters people, and family background strongly affects who gets through", "College has no effect on jobs"], "a": 1, "why": "Blau & Duncan found jobs depend on schooling, but schooling depends heavily on family background. So college sorts people, not just lifts them."},keys:[["Many hoped school would be a fair ladder (meritocracy)",/ladder|merit|fair|move up|mobility/i],["But it works more like a sieve that filters people",/sieve|sort|filter/i],["Family background strongly predicts who goes to and finishes college",/family|background|parent|socioeconomic/i],["A four-year degree is a turning point (watershed)",/four-year|degree|watershed|turning point|community college/i]],model:"People hoped school would be a fair ladder where effort lets you climb. Research shows it’s more like a sieve: jobs depend on education, but education depends a lot on family background. Still, finishing a four-year degree is a big turning point; after that, family background matters little for your job."},
 {id:"hd3",t:"Incubator",paras:[6, 7],look:"What happens inside college, between getting in and graduating?",logic:{"q": "Why do the authors call college life “the experiential core” and say ignoring it is “a significant oversight”?", "o": ["Because nothing important happens in college", "Because research studied getting in and graduating, but not the years in between, where friendships and networks form", "Because colleges don’t keep records"], "a": 1, "why": "They say sociologists studied entry and exit but left “the space between” mostly unstudied, even though ties formed then shape jobs, marriage and homes for life."},keys:[["Research mostly studies getting in and leaving, not college life itself",/entry|exit|getting in|leav|between|core|oversight/i],["College builds social ties (friends, networks)",/ties|friend|network|relationship|social/i],["These ties matter for life: jobs, partners, homes",/job|marriage|partner|home|life/i]],model:"Researchers have mostly studied who gets into college and who graduates, not the years in between, which the authors call a big oversight. College is an incubator: a place where young adults build friendships and networks, and those ties later help them find jobs, partners and homes."},
 {id:"hd4",t:"Temple and hub",paras:[8, 9, 10],look:"How is college like a temple, and how is it like a hub?",logic:{"q": "In the conclusion, what do the authors say research has missed by treating students only as individuals?", "o": ["That students all have the same grades", "That students live in a web of relationships that give them money, advice, friendship and information", "That colleges are too expensive"], "a": 1, "why": "They say students “are also nodes in networks” that supply what they need to get through school, so studying only individual data narrows our view."},keys:[["Temple: college makes knowledge official and produces citizens; “secular temple”",/temple|official|knowledge|citizen|legitim/i],["Hub: college connects economy, professions, science, family, government",/hub|connect|economy|family|government|science|job/i],["Students are part of a web of relationships, not just individuals",/web|network|relationship|node|not just individual/i],["College does more than give degrees (credentials)",/credential|degree|more than|other/i]],model:"College is a temple because it decides what counts as real, official knowledge and trains citizens. It is also a hub where jobs, science, families, charities and government meet. The authors conclude that students should be studied as parts of a web of relationships, and that colleges do much more than hand out degrees."}];

TEXTS["nvda"]={id:"nvda",genre:"News · business newsletter",short:"Nvidia",gcol:"--l2",src:"The New York Times · DealBook · Nov. 12, 2026",title:"Imagining Nvidia Without Jensen Huang",by:"Andrew Ross Sorkin, Sri Muppidi, Michael J. de la Merced and the DealBook team",note:"The Nvidia section of the newsletter in the writers’ own words, lightly trimmed (links, ads and other stories removed).",paras:[
 {h:"[Would you fire Jensen Huang?]",x:"Andrew here. Put yourself in the shoes of Nvidia’s [[board|group that watches over the company|company leaders|nvboard]]: Would you fire Jensen Huang? An affair with a customer who U.S. intelligence officials determined was a spy for China, as well as what The Times reported was a relationship with an employee, would typically be [[grounds for removal|a reason to be fired|reason to fire]]. At best, these scandals are a [[distraction|something that pulls attention away|distraction]]. At worst, they make managing the nearly $4 trillion chipmaker [[virtually impossible|almost impossible|almost impossible]], especially if [[credible evidence|proof you can believe|real proof]] emerges that Huang knew about Nvidia chips [[improperly|in a way that breaks the rules|wrongly]] going to China.",gs:"Imagine you run Nvidia’s {{board|nvboard}}. Would you fire the boss, Jensen Huang? He had secret relationships, one with a woman U.S. officials say spied for China. Normally, that gets a leader fired. At best, the scandals pull attention away from work. At worst, they make it almost impossible to run the giant company, especially if Huang knew Nvidia chips were going to China when they shouldn’t."},
 {x:"Yet does his [[centrality|key role|key role|nvcentral]] to the company and the A.I. industry mean [[overlooking|ignoring|ignoring]] those issues? Elon Musk wrote that he would be honored to hire Huang. Palmer Luckey of Anduril declared, “China wants Jensen out, so I want him in.” The [[venture capitalist|investor in new companies|investor]] Sarah Guo wrote, “We should demand loyalty and [[accountability|answering for what you do|owning mistakes]], but [[sainthood|being perfect|being a saint]] cannot be the price of admission to leadership.”",gs:"But Huang is so important to Nvidia and to A.I. Should that let him off? Elon Musk said he’d be proud to hire Huang. Another tech leader said: China wants Huang gone, so I want him to stay. An investor said: leaders must be loyal and answer for mistakes, but they don’t have to be perfect."},
 {x:"Does the Nvidia board have any [[middle ground|in-between choice|middle choice]]? Could Huang [[step down|leave the top job|quit as boss]] to become chief technology officer — or is that just [[window dressing|something done for show|for show]]? We should know the answer soon.",gs:"Is there a choice between firing him and keeping him? Could he switch to a tech job instead of boss? Or would that just look good without changing anything? We should find out soon."},
 {h:"Huge shoes to fill",x:"A month ago, Jensen Huang was [[firmly ensconced|settled in safely|safe]] atop Nvidia. Now Silicon Valley — and Wall Street and Washington — are starting to imagine life without him running the giant [[chipmaker|company that makes computer chips|chip company]]. If Nvidia’s board removes Huang as C.E.O., it would be a [[sea change|huge change|huge change]] at the [[central cog|most important part|key part]] of the artificial intelligence boom, with [[wide-ranging consequences|effects in many places|big effects]], Sri Muppidi and Michael de la Merced report.",gs:"A month ago, Huang’s job at the top of Nvidia looked totally safe. Now tech, money and government people are imagining Nvidia without him. If he is fired, it would be a huge change at the center of the A.I. boom, with effects everywhere."},
 {x:"Remember that the company has no clear [[succession plan|plan for the next leader|next-boss plan|nvsucc]]. Analysts have [[speculated|guessed|guessed]] that Colette Kress, its C.F.O. and perhaps its next most [[prominent|well-known|well-known]] executive, could become [[interim|temporary|for-now|nvinterim]] C.E.O. (Nvidia has hired an outside firm to consider possible replacements for Huang, according to Bloomberg, which [[cited unnamed sources|quoted people who stayed secret|used secret sources]].)",gs:"Nvidia has no clear plan for who comes next. Experts guess that Colette Kress, who runs Nvidia’s money, could be boss for a while. Nvidia has also hired a company to look for a new boss."},
 {x:"But no one at the company possesses the depth of [[operational knowledge|knowing how things run day to day|know-how]] or the [[authority|power to decide|power]] of Huang, who has roughly 60 [[direct reports|people who report straight to him|team members]]. Names [[floated|suggested|suggested]] among Nvidia watchers as possible outside candidates include Lisa Su of AMD, Rene Haas of Arm Holdings, Lip-Bu Tan of Intel and Johny Srouji of Apple.",gs:"But no one at Nvidia knows how it runs like Huang does, or has his power. About 60 people report straight to him. People who follow Nvidia have named possible new bosses from other chip companies: AMD, Arm, Intel and Apple."},
 {h:"[Ripples]",x:"Any [[disruption|big trouble|trouble|nvdisrupt]] at Nvidia could shake up the tech industry. The company’s [[processors|computer chips|chips]], known as GPUs, [[underpin|support from below|power]] a [[vast majority|almost all|most]] of A.I. data centers, including most run by SpaceX, OpenAI, Anthropic, Meta, SoftBank, CoreWeave and others. “SpaceX has committed to using Nvidia GPUs [[exclusively|only|only]] because they are the best,” Elon Musk wrote on social media in August.",gs:"Trouble at Nvidia could shake the whole tech world. Its chips run most of the big computer centers that power A.I. Elon Musk said SpaceX uses only Nvidia chips because they are the best."},

/* ---------- parsing the markup ---------- */
const MARKS=["<<","[[","{{","((","^^"];
function parse(s){
  const out=[]; let i=0;
  while(i<s.length){
    if(s.startsWith("<<",i)){const j=s.indexOf(">>",i+2);let body=s.slice(i+4,j),rep=null;const k=body.lastIndexOf("=>");if(k>=0){rep=body.slice(k+2);body=body.slice(0,k)}out.push({k:"det",t:s[i+2],rep,kids:parse(body)});i=j+2;continue}
    if(s.startsWith("[[",i)){const j=s.indexOf("]]",i);const f=s.slice(i+2,j).split("|");out.push({k:"ph",o:f[0],p:f[1],g:f[2]||f[1],card:f[3]||"",nu:f[4]||""});i=j+2;continue}
    if(s.startsWith("{{",i)){const j=s.indexOf("}}",i);const f=s.slice(i+2,j).split("|");out.push({k:"cw",w:f[0],card:f[1]});i=j+2;continue}
    if(s.startsWith("((",i)){const j=s.indexOf("))",i);const f=s.slice(i+2,j).split("|");out.push({k:"bg",w:f[0],id:f[1]});i=j+2;continue}
    if(s.startsWith("^^",i)){const j=s.indexOf("^^",i+2);out.push({k:"dn",s:s.slice(i+2,j)});i=j+2;continue}
    let j=i+1; while(j<s.length&&!MARKS.some(m=>s.startsWith(m,j))) j++;
    out.push({k:"t",s:s.slice(i,j)}); i=j;
  }
  return out;
}

});

function txt(ns,L){return ns.map(n=>n.k==="t"?n.s:n.k==="ph"?(L==="p"?n.p:L==="g"?n.g:strip(n.o)):n.k==="cw"||n.k==="bg"?n.w:n.k==="dn"?(L==="d"?" ("+n.s+")":""):n.k==="det"?(L==="g"?(n.rep||""):txt(n.kids,L)):"").join("")}
function cardsOf(ns,out=[]){ns.forEach(n=>{if((n.k==="ph"||n.k==="cw")&&n.card)out.push(n.card);if(n.k==="det")cardsOf(n.kids,out)});return out}
function walkAll(ns,f){ns.forEach(n=>{f(n);if(n.k==="det")walkAll(n.kids,f)})}

/* ---------- reading level & how much each layer keeps ---------- */
function syl(w){w=w.toLowerCase().replace(/[^a-z]/g,"");if(!w)return 0;if(w.length<=3)return 1;w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,"").replace(/^y/,"");const m=w.match(/[aeiouy]{1,2}/g);return m?m.length:1}
const wordsOf=t=>t.match(/[A-Za-z0-9][A-Za-z0-9’'%-]*/g)||[];
function fk(t){const w=wordsOf(t),s=Math.max(1,(t.match(/[.!?](?=["”’)]?(\s|$))/g)||[]).length);return {words:w.length,sents:s,grade:0.39*w.length/s+11.8*w.reduce((a,x)=>a+syl(x),0)/Math.max(1,w.length)-15.59}}

});

      const dc=n.card?` data-card="${n.card}"`:"", mc=n.card&&MINE[n.card]?" mine":"";

      return `<span role="button" tabindex="0" class="ph ${cls}${mc}" data-ph="${key}"${dc} data-lz="ph" data-o="${esc(o)}" data-p="${esc(n.p)}" data-g="${esc(n.g)}"${n.nu?` data-nu="${esc(n.nu)}"`:""}>${esc(o)}</span>`;
    }

      return `<span class="det${f==="g"?" gone":f==="d"?" deep":""}"${f?"":` data-lz="det" data-did="${n.did}"`}>${n.rep!==null?`<span class="rep">${esc(n.rep)}</span>`:""}<span class="dc">${inner}</span></span>`}

}

/* ---------- red sheet (赤シート) ---------- */
function phraseFor(id){
  for(const T of Object.values(TEXTS)) for(const p of T.paras){ if(!p.n) continue;
    let hit=null;
    const mark=ns=>ns.map(n=>{if(!hit&&(n.k==="ph"||n.k==="cw")&&n.card===id){hit=n.k==="ph"?strip(n.o):n.w;return {k:"t",s:"\u0000"}}return n.k==="det"?{...n,kids:mark(n.kids)}:n});
    const marked=mark(p.n); if(!hit) continue;
    const sent=txt(marked,"o").replace(/([.!?”])\s+(?=[A-Z“(])/g,"$1\u0001").split("\u0001").find(s=>s.includes("\u0000"));
    return {text:hit,sent};
  }
  const T=TEXTS.nyt; if(cardsOf(T.titleN).includes(id)) return {text:strip(T.titleN.find(n=>n.card===id).o),sent:"A \u0000"};
}
function redSentence(id){const f=phraseFor(id);return esc(f.sent).replace("\u0000",`<span class="red">${esc(f.text)}</span>`)}
function sheetHTML(){
  const L=S.sheet.list;
  return `<span class="eyebrow">${S.sheet.warm?"Warm-up":"After reading"} · Red sheet</span>

    <div class="paper" id="paper">

        <div class="selfs"><button class="selfb" data-self="${id}" data-ok="1" aria-pressed="${r===1}">Knew it</button><button class="selfb" data-self="${id}" data-ok="0" aria-pressed="${r===0}">Not yet</button></div></div>`}).join("")}
      <div class="sheet" id="sheet" style="top:${S.sheet.y}px"><div class="sgrip" id="sgrip">Drag the red sheet ↕</div></div>

function wireSheet(){

  grip.addEventListener("pointerdown",e=>{drag=true;grip.setPointerCapture(e.pointerId);e.preventDefault()});

/* ---------- the lens: three layers of information ---------- */
// Positions come from the original layout, so changing text inside the lens never makes it flicker.
let lensCache=null;
// Deep keeps the original words, so it needs no band: it always shows the whole page with notes.
const pageMode=()=>S.page||S.layer==="d";
function setEl(el,on,L){
  const kind=el.dataset.lz, st=on?L:"";
  if(el._st===st) return; el._st=st;
  if(kind==="ph"){const t=!on||L==="d"?el.dataset.o:L==="g"?el.dataset.g:el.dataset.p;
    el.className=el.className.replace(/\s*(lensed|L-[gp]|nu)\b/g,"");
    if(on&&L!=="d"){el.classList.add("lensed","L-"+L);if(el.dataset.nu)el.classList.add("nu")}
    if(el.textContent!==t)el.textContent=t}
  else if(kind==="det"){el.classList.toggle("gone",on&&L==="g");el.classList.toggle("deep",on&&L==="d")}
  else if(kind==="dn"){el.classList.toggle("on",on&&L==="d")}
}
function lensUpdate(){
  const els=[...document.querySelectorAll("#screen .para [data-lz]")], L=S.layer;
  if(!L||L==="s"||S.step!==READ){els.forEach(el=>setEl(el,false));lensCache=null;const n=paraLens()+sentLens();
    if((L==="g"||L==="s")&&!pageMode())$("#ltag").textContent=L==="g"?`Gist · ${n?"simple retelling · tap pink to compare":"move me over the text"}`:`Structure · ${n?"color = what each sentence does":"move me over the text"}`;return}
  if(!lensCache){els.forEach(el=>setEl(el,false));lensCache=new Map(els.map(el=>{const r=el.getBoundingClientRect();return [el,[r.top+scrollY,r.bottom+scrollY]]}))}
  let top=-1e9,bot=1e9;
  if(!pageMode()){const R=$("#lens").getBoundingClientRect();top=R.top+scrollY;bot=R.bottom+scrollY}
  const inBand=el=>{const c=lensCache.get(el);if(!c)return false;if(el.dataset.lz==="det")return c[1]>top&&c[0]<bot;const y=(c[0]+c[1])/2;return y>top&&y<bot};
  let n=0;
  els.filter(el=>el.dataset.lz==="det").forEach(el=>{const on=inBand(el);setEl(el,on,L);if(on&&L==="g"&&!el.parentElement.closest(".det.gone"))n++});
  els.filter(el=>el.dataset.lz!=="det").forEach(el=>{const hidden=L==="g"&&el.closest(".det.gone");const on=!hidden&&inBand(el);setEl(el,on,L);if(on&&((L==="p"||L==="g")&&el.dataset.nu||L==="d"&&el.dataset.lz==="dn"))n++});
  if(!pageMode()) $("#ltag").textContent=L==="g"?`Gist · simplest words, same sentences · spot the difference`:L==="p"?`Plain · same facts${n?` · ${n} shade${n>1?"s":""} of meaning lost`:""}`:`Deep · ${n?`+${n} note${n>1?"s":""} here`:"original words + notes"}`;
}
function placeLens(){const lens=$("#lens");if(S.lensY===null)S.lensY=Math.round(innerHeight*0.3);S.lensY=Math.max(40,Math.min(innerHeight-lens.offsetHeight-90,S.lensY));lens.style.top=S.lensY+"px";lensUpdate()}
function syncLensUI(){
  const L=S.layer, inRead=S.step===READ;sentCache=null;
  document.querySelectorAll("[data-layer]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.layer===L));
  $("#pageBtn").setAttribute("aria-pressed",S.page);
  if(L) document.documentElement.style.setProperty("--lens",`var(${LAYERS[L].col})`);
  $("#lens").hidden=!(inRead&&L&&!pageMode());
  $("#pageBtn").hidden=L==="d";document.body.classList.toggle("pagemode",!!S.page);
  document.body.classList.toggle("lz-g",false);document.body.classList.toggle("lz-s",inRead&&L==="s");
  $("#structBtn").hidden=!S.texts.every(id=>SEC[id]);document.body.classList.toggle("structmode",inRead&&L==="s");
  document.body.classList.toggle("deepmode",inRead&&L==="d");
  document.querySelectorAll(".meter .mrow").forEach((r,i)=>r.classList.toggle("cur",["g","p","o","d"][i]===(L||"o")));
  if(inRead&&L&&!pageMode()) placeLens(); else lensUpdate();
  requestAnimationFrame(()=>{try{refreshMarks()}catch(e){}});

/* ---------- review (spaced repetition) ---------- */
function startReview(list,warm=false){
  const qs=list.map((id,k)=>({id,type:PIC[id]?k%3:1+k%2}));
  S.review={queue:shuffle(qs),done:0,total:qs.length,right:0,missed:new Set(),warm,finished:false,answered:false};
}
function reviewHTML(){
  const R=S.review;
  if(!R||R.finished) return `<h2 class="part-h">Review done</h2>`;
  const q=R.queue[0], c=CARDS[q.id];
  let prompt="", correctLabel=c.word;
  if(q.type===0) prompt=`<p class="q">Which word does this picture show?</p><div class="rv-pic pic">${PIC[q.id]}</div>`;
  if(q.type===1) prompt=`<p class="q">Which word means “${esc(c.def.replace(/\.$/,""))}”?</p>`;
  if(q.type===2){const f=phraseFor(q.id);correctLabel=f.text;prompt=`<p class="q">Fill the gap in the real sentence.</p><div class="rv-sent">${esc(f.sent).replace("\u0000",'<span class="blank">&nbsp;</span>')}</div>`}
  if(!q.opts){const pool=Object.keys(S.met).length>3?Object.keys(S.met):CARD_ORDER;q.opts=shuffle([q.id,...shuffle(pool.filter(k=>k!==q.id)).slice(0,2)])}
  return `<span class="eyebrow">${R.warm?"Warm-up review":"Word review"} · ${Math.min(R.done+1,R.total)} of ${R.total}</span>
    ${prompt}
    <div class="opts">${q.opts.map(o=>`<button class="opt" data-rv="${o}">${esc(o===q.id?correctLabel:CARDS[o].word)}</button>`).join("")}</div>
    <div class="fb" id="fb"></div>`;
}
function answerReview(pick,btn){
  const R=S.review, q=R.queue[0]; if(R.answered) return;
  const ok=pick===q.id;
  btn.classList.add(ok?"right":"wrong");
  const m=S.mem[q.id]||{box:0,due:0};
  if(ok){ if(!R.missed.has(q.id)){m.box=Math.min(m.box+1,4);R.right++} bump(q.id);
    m.due=Date.now()+GAPS[m.box]*DAY; S.mem[q.id]=m; store.set("mem",S.mem);
    R.answered=true; document.querySelectorAll("[data-rv]").forEach(b=>b.disabled=true);
    const c=CARDS[q.id];
    $("#fb").innerHTML=`<b style="color:var(--good)">Yes, ${esc(c.word)}!</b> ${esc(c.def)} <div style="margin-top:10px"><button class="btn primary" id="rvNext">Next</button></div>`;
    $("#rvNext").onclick=()=>{R.queue.shift();R.done=Math.min(R.done+1,R.total);R.answered=false;
      if(!R.queue.length){R.finished=true;if(R.warm){S.step=0;toast(`Warm-up done: ${R.right} of ${R.total} right.`)}else S.step=DONE}
      render()};
  } else {
    btn.disabled=true; if(!R.missed.has(q.id)){R.missed.add(q.id);m.box=0;S.mem[q.id]=m;R.queue.push({id:q.id,type:PIC[q.id]?(q.type+1)%3:(q.type===1?2:1)})}
    $("#fb").innerHTML=`<b style="color:var(--bad)">Not this one.</b> Try again. This word will come back once more at the end.`;
  }
}

function wordQ(){const pool=[...new Set(WORDER.filter(k=>WS.clear[k]).flatMap(wChapWords))].filter(c=>CARDS[c]&&CARDS[c].def);if(pool.length<3)return null;
  const all=[...new Set(WORDER.flatMap(wChapWords))].filter(x=>CARDS[x]&&CARDS[x].def),c=pick(pool),others=shuffle(all.filter(x=>x!==c)).slice(0,2);
  return {q:`What does “${CARDS[c].word}” mean?`,opts:[CARDS[c].def].concat(others.map(x=>CARDS[x].def)),a:0,why:`“${CARDS[c].word}”: ${CARDS[c].def}`}}
function bossAsk(mode,k,cb,secs){let Q=null;
  if(mode==="word")Q=wordQ();else{const L=BOSSQ[k];if(L){const done=WG.boss[k]||[];let i=L.findIndex((_,j)=>done.indexOf(j)<0);if(i<0)i=Math.floor(Math.random()*L.length);Q=Object.assign({i},L[i])}}
  if(!Q){if(cb)cb(null);return}

  gOpen(`<div class="bhead">${bossSVG()}<div><span class="bname">Chief Hornbeak <small>editor-in-chief ✦</small></span><p class="bshout">${esc(L[0].replace("{s}",(n=>n+(n===1?" second":" seconds"))(Math.max(1,Math.round(secs||0)))))}</p><p class="bsub">${esc(L[1])}</p></div></div><div class="bq"><b>${esc(Q.q)}</b><div class="bopts">${order.map(j=>`<button class="dbtn bopt" data-gact="ans" data-j="${j}">${esc(Q.opts[j])}</button>`).join("")}</div></div><div class="bres" hidden></div>`,"boss",()=>{SFX.boss();setTimeout(()=>mumble("boss",50),380)},{
    ans:b=>{if(row)return;const j=+b.dataset.j,ok=j===Q.a;gLayer.querySelectorAll(".bopt").forEach(x=>{x.disabled=true;if(+x.dataset.j===Q.a)x.classList.add("right");else if(x===b)x.classList.add("wrong")});
      if(ok&&Q.i!=null){WG.boss[k]=(WG.boss[k]||[]).concat([Q.i]);saveG()}
      row=["🦜",ok?"Chief Hornbeak’s pop quiz: right!":"Chief Hornbeak’s pop quiz: tried",ok?5:1];ok?SFX.chime():SFX.bad();setTimeout(()=>mumble("boss",30),200);
      const r=gLayer.querySelector(".bres");r.hidden=false;r.innerHTML=`<p class="bshout ${ok?"ok":"no"}">${esc(pick(ok?BOSS_OK:BOSS_NO))}</p>${ok?"":`<p class="bwhy">✓ ${esc(Q.why)}</p>`}<div class="wmacts"><button class="dbtn go gold" data-gact="fin">${cb?"Back to work ▸":`Take ${row[2]} ⭐ ▸`}</button></div>`;

    const cookies=P.map(p=>{A.item(`<ellipse cx="0" cy="0" rx="92" ry="22" fill="#fff" stroke="${INK}" stroke-width="3"/>`,p[0],p[1]);return [-40,0,40].map(dx=>A.item(emo(0,0,"🍪",42),p[0]+dx,p[1]-6))});
    const d=A.item(dome,400,215,.9);
    A.drag(d,{drop:o=>{const i=A.near(o,P[0][0],P[0][1],150)?0:A.near(o,P[1][0],P[1][1],150)?1:-1;if(i<0)return false;A.lock(o);o.to(P[i][0],P[i][1]+6,220);A.sfx("pop");
      const j=1-i,birds=[0,1].map(k=>A.item(emo(0,0,"🐦",48),860+k*50,70+k*50));
      A.later(500,()=>birds.forEach((b,k)=>b.to(P[j][0]+(k?30:-30),P[j][1]-60,900)));
      cookies[j].forEach((ck,k)=>A.later(1500+k*300,()=>{ck.g.remove();A.sfx("tick")}));
      A.later(1700,()=>birds.forEach((b,k)=>{if(k===0)return;b.to(P[i][0]+30,P[i][1]-110,500,()=>{A.sfx("bad");b.to(-80,40,900)})}));
      A.later(2700,()=>{birds[0].to(-80,60,900);A.done("The birds ate the open plate. Your covered cookies are safe. You <b>preserved</b> them: you kept them safe.")});return true}});
    A.say("Birds are coming! <b>Put</b> the glass dome over one plate to keep it safe.")},
  b2:A=>{A.bg(sky("#F4EEE2")+`<rect x="660" y="20" width="125" height="110" rx="6" fill="#BFE0F5" stroke="${INK}" stroke-width="3"/><path d="M722 20 V130 M660 75 H785" stroke="${INK}" stroke-width="3"/>`+tx(722,152,"students outside",14));
    const face=A.item(emo(0,0,"🙂",44),722,90);
    const L=A.item(coins(7,"Tax break","for pensioners"),220,400),Rr=A.item(coins(7,"Money","for schools"),560,400);
    const sc=A.item(emo(0,0,"✂️",54)+tx(0,30,"budget cuts",15,"#C0392B"),400,80);
    const d=A.item(dome,400,250,1.05);
    A.drag(d,{drop:o=>{if(A.near(o,560,400,150)){A.fb("That might be <i>your</i> choice! But the lawmakers covered the pensioners’ tax break. Do it their way first. You choose at the end.");return false}
      if(!A.near(o,220,400,150))return false;A.lock(o);o.to(220,402,220);A.sfx("pop");
      A.later(500,()=>sc.to(560,280,800,()=>{A.sfx("bad");Rr.html(coins(3,"Money","for schools"));A.pop(560,300,"− cut","#C0392B");face.html(emo(0,0,"😟",44));
        A.later(900,()=>A.done("The pensioners’ tax break is <b>preserved</b> (kept safe). The schools’ money got cut. The young lose out."))}));return true}});
    A.say("France, last week. The budget can’t pay for everything. The lawmakers’ first move: <b>put</b> the dome over the pensioners’ tax break.")},
  quotes:["Last week, as young people blocked schools across the country, France’s lawmakers met to review next year’s budget. One of their first moves was to [preserve] a tax break for pensioners."],
  mean:"<b>preserve</b> = keep something safe so it isn’t lost or taken. A <b>tax break</b> = a rule that lets someone pay less tax."}
};

/* where each act sits in the dialogue (the line just after the word is met) */
const PLACE=[["newsroom","editor",4,"“Toppled” and “shrinking demographic” are big ideas. You can feel them with your hands. Want to try?"],
 ["paris","baker",3,"Don’t just listen. Cut the pie yourself and see!"],
 ["oxford","vlandas",4,"Gerontonomia is easier to do than to define. Try it with this little cart."],
 ["madrid","renter",3,"“Disproportionately” is a long word. Carry it, and you will understand it."],
 ["london","pm",4,"Want to feel why touching the triple lock is so scary? Try it."],
 ["power","arceneaux",2,"An incentive works like a carrot. Let me show you."],
 ["assembly","after",2,"“Preserve” means keep safe. Do what the lawmakers did."]];
const KEYOF={newsroom:"topple",paris:"zerosum",oxford:"gerontonomia",madrid:"dispro",london:"triplelock",power:"incentive",assembly:"preserve"};
PLACE.forEach(p=>{const s=SCN[p[0]],arr=p[1]==="after"?s.after:s.npcs[p[1]].lines,w=p[1]==="after"?"clerk":p[1];
  if(arr&&!arr.some(l=>l.act))arr.splice(p[2],0,{w,t:p[3],act:KEYOF[p[0]]})});

/* ---------- the act-it-out layer ---------- */
const LY=document.createElement("div");LY.id="actlayer";LY.hidden=true;document.body.appendChild(LY);
let CUR=null;
const TAGS=["Do it","Big idea","In the story"];
function openAct(key){CUR={key,b:0,first:!AS[key]};LY.hidden=false;const c=document.getElementById("gcoach");if(c)c.hidden=true;drawBeat()}
function closeAct(){R.id++;LY.hidden=true;LY.innerHTML="";CUR=null;if(GAME.tutApply)GAME.tutApply()}
function drawBeat(){R.id++;const a=ACT[CUR.key],b=CUR.b;
  const head=`<div class="acthead"><span class="actw">✋ ${esc(a.word)}</span><span class="actsteps">${TAGS.map((t,i)=>`<span class="${i<b?"done":i===b?"on":""}">${i<b?"✓":i+1} ${t}</span>`).join("")}</span><button class="actx" data-ax="close" aria-label="Close">✕</button></div>`;
  if(b<2){
    LY.innerHTML=`<div class="actcard" role="dialog" aria-modal="true" aria-label="Act it out: ${esc(a.word)}">${head}<p class="actsay"></p><div class="actstage"><svg viewBox="0 0 800 450" aria-hidden="true"></svg></div><div class="actfb"><p></p><button class="dbtn go gold" data-ax="next" hidden>Next ▸</button></div></div>`;
    const A=makeA(LY.querySelector("svg"),LY.querySelector(".actsay"),LY.querySelector(".actfb p"),LY.querySelector("[data-ax=next]"));
    (b===0?a.b1:a.b2)(A);
  } else {
    const q=s=>esc(s).replace(/\[([^\]]+)\]/g,"<mark>$1</mark>");
    LY.innerHTML=`<div class="actcard echo" role="dialog" aria-modal="true">${head}<span class="eyebrow">In the real article</span>${a.quotes.map(s=>`<blockquote class="actquote">${q(s)}</blockquote>`).join("")}<p class="actim">🧠 Read the sentence slowly and <b>play your move again in your head</b>.</p><p class="actmean">${a.mean}</p><div class="actfb end"><button class="dbtn" data-ax="again">↺ Do it again</button><button class="dbtn go gold" data-ax="finish">${CUR.first?"Got it! +3 ⭐":"Got it ▸"}</button></div></div>`;
    sfx("chime");
  }}
LY.addEventListener("click",e=>{const b=e.target.closest("[data-ax]");if(!b||!CUR)return;const k=b.dataset.ax;
  if(k==="close")closeAct();
  else if(k==="next"){CUR.b++;drawBeat()}
  else if(k==="again"){CUR.b=0;drawBeat()}
  else if(k==="finish"){const key=CUR.key,first=CUR.first;AS[key]=1;saveA();closeAct();
    const btn=document.querySelector(`#wdlg [data-act="${key}"]`);if(btn){btn.classList.remove("gold");btn.textContent="✋ Do it again"}
    if(first&&GAME.award)GAME.award(3,"Acted out “"+ACT[key].word+"”",document.getElementById("wdlg"))}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&CUR)closeAct()});

/* the NPC line that offers the act */
const _drawDlg27=drawDlg;
drawDlg=function(){_drawDlg27();const d=WV.dlg,st=d&&d.steps[d.i];if(!st||!st.act||!ACT[st.act])return;
  const acts=document.querySelector("#wdlg .acts");if(!acts||acts.querySelector("[data-act]"))return;
  acts.insertAdjacentHTML("afterbegin",`<button class="dbtn actgo ${AS[st.act]?"":"gold"}" data-act="${st.act}">✋ ${AS[st.act]?"Do it again":"Try it with your hands"}</button>`);
  if(GAME.tutApply)GAME.tutApply()};
worldEl.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-act]");if(b)openAct(b.dataset.act)});

/* after reading: a quiet echo. Acted words get a small ✋ in the reader; the "Story solved" card notes it. */
const _applyScene27=applyScene;
applyScene=function(){_applyScene27();if(!S.scene)return;
  Object.keys(ACT).forEach(k=>{if(!AS[k])return;ACT[k].cards.forEach(c=>document.querySelectorAll(`#screen [data-card="${c}"]`).forEach(el=>el.classList.add("acted")))})};
/* make the act findable: a ✋ badge on the person who offers it */
const _drawWorld28=drawWorld;
drawWorld=function(){_drawWorld28();if(WV.view!=="scene")return;const pl=PLACE.filter(p=>p[0]===WV.sc)[0];if(!pl||pl[1]==="after")return;
  const tag=worldEl.querySelector(`[data-wtalk="${pl[1]}"] .tag`);if(tag&&!tag.querySelector(".acthint"))tag.insertAdjacentHTML("afterbegin",`<span class="acthint${AS[KEYOF[WV.sc]]?" did":""}" title="Act it out">✋</span>`)};
window.__actRow=(k,first)=>{const key=KEYOF[k];if(!first||!key||!AS[key]||k==="assembly")return null;return ["✋",`You acted out “${ACT[key].word}”, then read it in the article`,2]};
window.__act={ACT,AS,openAct};
})();

</script>
