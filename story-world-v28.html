<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerontonomia Story</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: one calm reading column, one part of the article per screen. Each part: meet the words, read, flip/hold to compare, quick check. Then a spaced review. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --sunk:#E8ECF5; --ink:#18203A; --muted:#5A6382; --line:#D9DFEC;
  --accent:#2B50E0; --accent-ink:#FFFFFF; --hi:#FFE14D; --hi-ink:#18203A; --coin:#E8A317;
  --l1:#2FA67A; --l2:#2E86D6; --good:#1E9E62; --bad:#D6453D; --legend:#B04BD6; --old:#9AA3BA;
  --lens:var(--hi); --rose:#F28DB2;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1328; --surface:#181E3B; --sunk:#222a4e; --ink:#E8ECF8; --muted:#9AA3C4; --line:#2C3460;
  --accent:#7C98FF; --accent-ink:#0F1328; --hi:#F2D33A; --hi-ink:#18203A; --coin:#F5BD3C;
  --l1:#4CCB9A; --l2:#62AEF2; --good:#4CCB8F; --bad:#FF7A6E; --legend:#D58BF0; --old:#6E7798; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1328; --surface:#181E3B; --sunk:#222a4e; --ink:#E8ECF8; --muted:#9AA3C4; --line:#2C3460;
  --accent:#7C98FF; --accent-ink:#0F1328; --hi:#F2D33A; --hi-ink:#18203A; --coin:#F5BD3C;
  --l1:#4CCB9A; --l2:#62AEF2; --good:#4CCB8F; --bad:#FF7A6E; --legend:#D58BF0; --old:#6E7798; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:800;font-size:20px}
.brand mark{background:linear-gradient(transparent 55%,var(--hi) 55%);color:inherit;padding:0 2px}
.toggle{font-size:14px;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px}
.toggle[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}
.dots{display:flex;gap:6px;margin-bottom:18px}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.dots i.done{background:var(--accent)} .dots i.cur{background:var(--hi)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,30px)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;align-items:center}
.nav .why{font-size:14px;color:var(--muted);text-align:center;flex:1}

/* meet the words */
.meet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 22px}
.wchip{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--sunk);border-radius:12px;padding:8px 10px}
.wchip .pic{background:var(--surface);border-radius:8px;padding:2px}
.wchip b{font-family:var(--display);font-size:17px;background:var(--hi);color:var(--hi-ink);align-self:flex-start;padding:0 5px;border-radius:4px}
.wchip span.eq{font-size:14px;color:var(--muted)}
.wchip span.eq::before{content:"= ";font-weight:700;color:var(--l1)}
.mem{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--muted)}
.mem i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.mem i.on{background:var(--l1)}
.again{font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--l1);text-transform:uppercase;vertical-align:super;margin-left:2px}

/* reading */
.part-h{font-size:clamp(22px,3vw,26px);font-weight:800;margin:2px 0 14px}
.title-h{font-size:clamp(30px,5vw,42px);font-weight:800;margin-bottom:4px}
.para{font-size:20px;line-height:2;max-width:62ch;margin:0 0 18px}
.byline{color:var(--muted);font-size:14px;margin:0 0 22px}
.sec-h{font-size:21px;font-weight:700;margin:28px 0 10px}
.endnote{color:var(--muted);font-size:15px;margin-top:26px;border-top:1px dashed var(--line);padding-top:14px}
.xr{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.06em;padding:0 5px;border-radius:4px;margin-left:4px;vertical-align:super;text-transform:uppercase;line-height:1.5}
.xr:hover{border-color:var(--accent);color:var(--accent)}
.para .snt+.snt::before{content:" "}
.ph{position:relative;display:inline;cursor:pointer;border:0;padding:0 3px;margin:0 -1px;font-size:inherit;line-height:inherit;border-radius:5px;background:transparent;transition:background .2s,color .2s}
.ph.soft{background:transparent}
.ph.soft:not(.on){padding:0;margin:0;border-radius:3px}
.ph.soft:hover{background:var(--sunk)}
.ph.key{background:var(--hi);color:var(--hi-ink);font-weight:700}
.ph.on{background:color-mix(in srgb,var(--l1) 30%,transparent);color:var(--ink);font-weight:700;text-decoration:none;animation:flip .35s ease}
.ph.key.on{box-shadow:inset 0 -3px 0 var(--hi)}
.ph rt{font-size:.55em;font-weight:700;color:var(--hi-ink);background:var(--hi);border-radius:3px;padding:0 4px;font-style:normal;line-height:1.3;white-space:nowrap}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}
.bgt{border:0;background:none;padding:0;font-size:inherit;line-height:inherit;color:inherit;border-bottom:2px dotted var(--accent)}
.bgt::after{content:"";display:inline-block;width:.7em;height:.55em;margin-left:3px;border:1.5px solid var(--accent);border-radius:2px;background:linear-gradient(135deg,transparent 55%,var(--accent) 55%)}
.zh{font-size:15px;color:var(--muted);margin-top:10px;border-left:3px solid var(--line);padding-left:10px}
.holdrow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:20px 0 6px}
.hold{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 6px 20px rgba(10,14,30,.18);border:2px solid var(--l1);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.hold.down{background:var(--l1);color:var(--surface)}
.holdrow small{color:var(--muted);font-size:14px}
.xlink{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:4px 0;text-align:left}

/* x-ray */
.xpanel{border:2px solid var(--accent);border-radius:var(--r);padding:16px;margin:14px 0 4px;animation:pop .3s ease}
.xhead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.xchunks{display:flex;flex-wrap:wrap;gap:10px 6px;margin:12px 0}
.xc{display:flex;flex-direction:column;gap:3px;min-width:0}
.xc span.t{padding:3px 8px;border-radius:6px;font-size:16px;line-height:1.5}
.xc span.l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-left:8px}
.xpat{font-family:var(--display);font-weight:700;font-size:18px;background:var(--sunk);border-radius:8px;padding:8px 12px;display:inline-block}
.xtip{font-size:15px;margin:12px 0}
.xin,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit;margin-top:6px}

/* checks & review */
.check{margin-top:24px;border-top:1px dashed var(--line);padding-top:18px}
.q{font-size:18px;font-weight:700;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;font-size:16px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.fb{margin-top:10px;font-size:15px;min-height:1.5em}
.rv-pic{max-width:300px;margin:6px 0 10px;background:var(--sunk);border-radius:10px;padding:8px}
.rv-sent{font-size:19px;line-height:1.8;background:var(--sunk);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.blank{display:inline-block;min-width:90px;border-bottom:2.5px solid var(--ink)}
.big-n{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin:14px 0 22px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats span{font-size:14px;color:var(--muted)}
.stats span.big-n{font-size:44px;color:var(--ink)}
table.sched{width:100%;border-collapse:collapse;font-size:15px}
table.sched td,table.sched th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.sched th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.sched td b{background:var(--hi);color:var(--hi-ink);padding:0 5px;border-radius:4px}
.tablewrap{overflow-x:auto}
.how{display:grid;gap:12px;margin:18px 0 24px;padding:0;list-style:none}
.how li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:16px}
.how li span.n{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.warm{background:color-mix(in srgb,var(--hi) 35%,transparent);border-radius:12px;padding:14px 16px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* illustration palette */
.pic svg{display:block;width:100%;height:auto}
.ill .k{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.ill .kf{fill:var(--ink)}
.ill .y{fill:var(--hi)} .ill .b{fill:var(--l2)} .ill .g{fill:var(--l1)} .ill .o{fill:var(--old)} .ill .s0{fill:var(--surface)} .ill .c{fill:var(--coin)} .ill .r{fill:var(--bad)}
.ill text{fill:var(--ink);font-family:var(--body);font-size:11px;font-weight:700}
.ill text.m{fill:var(--muted);font-weight:400}

.overlay{position:fixed;inset:0;background:rgba(10,14,30,.55);display:grid;place-items:center;padding:20px;z-index:20;overflow:auto}
.bigcard{width:min(420px,100%);background:var(--surface);border-radius:18px;border:2px solid var(--ink);padding:22px;animation:pop .35s ease;margin:auto}
.bigcard .rar{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.bigcard h3{font-size:28px;font-weight:800;margin:4px 0 2px}
.bigcard .pos{color:var(--muted);font-size:14px}
.bigcard .def{font-size:17px;margin:10px 0}
.bigcard .ex{font-size:15px;border-left:4px solid var(--hi);padding:4px 0 4px 12px;color:var(--muted)}
.bigcard .parts{margin-top:10px;font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.bigcard .pic{margin:10px 0 4px;background:var(--sunk);border-radius:10px;padding:6px}
.ladder{display:flex;flex-direction:column-reverse;gap:4px;margin-top:8px}
.rung{display:flex;align-items:center;gap:10px;font-size:14px}
.rung .bar{height:24px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rung .n{width:46px;flex:none;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.used{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:14px;align-items:center}
.used span.w{background:var(--hi);color:var(--hi-ink);border-radius:4px;padding:1px 6px;font-weight:700}
.floatbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px 6px 6px;box-shadow:0 6px 20px rgba(10,14,30,.18)}
#lensBtn{border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:700;font-size:15px}
#lensBtn[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
#lens{position:fixed;left:0;right:0;height:168px;z-index:11;pointer-events:none;background:color-mix(in srgb,var(--lens) 26%,transparent);border-block:2px solid var(--lens);box-shadow:0 0 0 100vmax color-mix(in srgb,var(--bg) 55%,transparent)}
#lgrip{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);pointer-events:auto;cursor:ns-resize;touch-action:none;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:800;font-size:16px}
.ph.lensed{background:color-mix(in srgb,var(--l1) 32%,transparent)!important;color:var(--ink)!important;font-weight:700;animation:lensin .35s ease}
@keyframes lensin{0%{opacity:0;filter:blur(4px)}100%{opacity:1;filter:none}}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;text-decoration:underline;padding:4px}
p.sub{color:var(--muted);font-size:15px;margin:0 0 6px}
/* red sheet: a deliberately fixed paper look, so the multiply filter works in both themes */
.paper{position:relative;isolation:isolate;background:#FFFFFF;color:#18203A;border-radius:12px;border:1px solid #D9DFEC;overflow:hidden;margin-top:14px;padding-bottom:36px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #E3E7F0}
@media (max-width:520px){.row{grid-template-columns:minmax(0,1fr)}}
.eq2{display:block;font-weight:700;font-size:14px;color:#18203A;margin-bottom:2px}
.eq2::before{content:"means: ";font-weight:400;color:#18203A}
.ctx{display:block;font-size:17px;line-height:1.6;color:#18203A}
.red{color:#FF5A4F;font-weight:800}
.selfs{display:flex;gap:6px}
.selfb{border:1.5px solid #18203A;background:#FFFFFF;color:#18203A;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.selfb[aria-pressed="true"]{background:#18203A;color:#FFFFFF}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#FF0000;mix-blend-mode:multiply;pointer-events:none;z-index:3}
.sgrip{pointer-events:auto;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;background:#B80000;color:#FFFFFF;font-weight:800;font-size:13px;text-align:center;padding:7px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- v8: library, side-by-side, layered lenses ---------- */
body.wide .wrap{max-width:1280px}
.lib{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));margin:14px 0 8px}
.tcard{border:1.5px solid var(--line);border-radius:var(--r);padding:18px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.tcard h3{font-size:22px;font-weight:800}
.genre{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 10px;background:var(--surface);border:1.5px solid var(--line)}
.tcard .src{color:var(--muted);font-size:14px}
.tcard .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.cmp{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 4px}
.cmp th,.cmp td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cmp td.n{font-variant-numeric:tabular-nums;font-weight:700}
.sec-label{margin:26px 0 6px}
.demo{display:grid;gap:8px;margin:10px 0 6px}
.demo .lrow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:start;border-radius:12px;padding:10px 12px;background:var(--sunk)}
@media (max-width:560px){.demo .lrow{grid-template-columns:minmax(0,1fr)}}
.demo .lrow .lname{font-family:var(--display);font-weight:800;font-size:15px;display:flex;flex-direction:column;gap:2px}
.demo .lrow .lname small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.demo .para{font-size:16px;line-height:1.75;margin:0;max-width:none}
.dotk{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}

.cols{display:grid;gap:40px}
@media (min-width:980px){.cols.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols.two .para{font-size:17.5px;line-height:1.95}.cols.two .title-h{font-size:30px}}
.art{min-width:0}
.kicker{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.para.dlg{white-space:pre-line;font-size:18px;line-height:1.85;background:var(--sunk);border-radius:12px;padding:12px 16px;border-left:4px solid var(--l2)}
.omit{color:var(--muted);font-size:14px;font-style:italic;margin:-4px 0 18px;text-align:center}
.views{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 14px;align-items:center}
.views .vl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.vchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.vchip.here{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.vchip:hover:not(.here){border-color:var(--accent)}

/* layer meter: how much each lens keeps */
.meter{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 22px;font-size:14px}
.meter .mrow{display:grid;grid-template-columns:62px 60px minmax(0,1fr);gap:10px;align-items:center;padding:4px 6px;border-radius:8px}
.meter .mrow.cur{background:color-mix(in srgb,var(--lens) 22%,transparent)}
.meter .mrow b{font-family:var(--display)}
.meter .lv{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.meter .bar{position:relative;height:14px;border-radius:99px;background:var(--line);overflow:visible;display:flex}
.meter .bar i{display:block;height:100%;border-radius:99px 0 0 99px}
.meter .bar i.keep{background:var(--ink)}
.meter .bar i.flat{background:repeating-linear-gradient(45deg,var(--ink) 0 3px,var(--muted) 3px 6px)}
.meter .bar i.add{background:var(--l2);border-radius:0 99px 99px 0}
.meter .mnote{grid-column:3;font-size:12.5px;color:var(--muted);margin-top:-2px}
.meter .mhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
@media (max-width:420px){.meter .mrow{grid-template-columns:52px 52px minmax(0,1fr)}}

/* layered lens states */
.ph.lensed.L-g{background:color-mix(in srgb,var(--rose) 40%,transparent)!important}

.stage.scn::before{padding-top:56%}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;color:#1B1530}
.pin .pb{width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#F2C14E;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.35);display:grid;place-items:center}
.pin .pb span{transform:rotate(45deg);font-size:18px;line-height:1}
.pin .pl{margin-top:6px;background:#fff;border-radius:999px;padding:2px 9px;font-weight:800;font-size:12.5px;font-family:var(--display);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pin.new .pb{animation:bob 1.6s ease-in-out infinite}
.pin.done .pb{background:#5BD49A}
.pin.lock .pb{background:#9AA3BA}
.pin.l .pl{position:absolute;right:44px;top:2px;margin:0}
.pin.r .pl{position:absolute;left:44px;top:2px;margin:0}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-8px}}
.legendw{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 2px 0;font-size:13px;color:#AEB5DA}

/* scene */
.scnwrap{max-width:1000px;margin:0 auto}
.stage.scn{margin:0 auto;width:min(100%,calc((100vh - 270px) * 1.786));min-width:min(100%,520px)}
@supports (height:100dvh){.stage.scn{width:min(100%,calc((100dvh - 270px) * 1.786))}}
.scntitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.scntitle h3{font-family:var(--display);font-size:22px;margin:0;color:#fff}
.scntitle span{font-size:13px;color:#AEB5DA}
.hs{position:absolute;border:0;background:transparent;padding:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.hs .tag{background:#fff;color:#1B1530;font-weight:800;font-size:12.5px;border-radius:999px;padding:3px 9px;box-shadow:0 3px 8px rgba(0,0,0,.35);white-space:nowrap;font-family:var(--display);transform:translateY(-70%)}
.hs .tag.talked{background:#DDE3FF}
.hs:hover,.hs:focus-visible{background:rgba(255,255,255,.12);outline:2px dashed rgba(255,255,255,.7)}
.hs.obj .tag{background:#FFF4CC}
.hs.read{border-radius:50%}
.hs.read .ring{position:absolute;inset:0;border-radius:50%;border:4px solid #F2C14E;box-shadow:0 0 0 0 rgba(242,193,78,.8);animation:pulse 1.8s infinite}
.hs.read .tag{background:#F2C14E;transform:translateY(-120%)}
.hs.read.cleared .ring{border-color:#5BD49A;animation:none}
.hs.read.cleared .tag{background:#5BD49A}
.hs.read .ico{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(18px,3.4vw,34px)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,193,78,.7)}70%{box-shadow:0 0 0 18px rgba(242,193,78,0)}100%{box-shadow:0 0 0 0 rgba(242,193,78,0)}}

/* dialogue box */
.dlg{margin:12px auto 0;max-width:1000px;background:#FBF7EC;color:#1B1530;border:3px solid #1B1530;border-radius:16px;box-shadow:0 6px 0 #1B1530;padding:12px 14px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;min-height:116px;position:relative}
.dlg .face{width:64px;height:64px;border-radius:50%;background:#E8E2F7;border:2px solid #1B1530;overflow:hidden;grid-row:span 2}
.dlg .face svg{width:100%;height:100%;display:block}
.dlg .who{font-family:var(--display);font-weight:800;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dlg .who small{font-family:var(--body);font-weight:400;color:#6A6380;font-size:12px}
.dlg .say{font-size:17.5px;line-height:1.5}
.dlg.you{background:#E9F0FF}
.dlg .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}
.dbtn{border:2px solid #1B1530;background:#fff;color:#1B1530;border-radius:12px;padding:7px 14px;font-weight:800;font-size:15px;text-align:left}
.dbtn.go{background:#1B1530;color:#FBF7EC}
.dbtn.gold{background:#F2C14E}
.dbtn.ask::before{content:"❯ ";color:#B04BD6}
.dlg .acts.choices{justify-content:flex-start}
.wchip{display:inline;line-height:inherit;background:#FFE14D;color:#18203A;border:0;border-radius:6px;padding:0 4px;font-weight:700;font:inherit;font-weight:700;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.wchip.bg{background:#CFE6FF}
.clue{grid-column:1/-1;margin-top:6px;background:#1B1530;color:#FBF7EC;border-radius:10px;padding:8px 12px;font-size:15px;animation:wfade .5s ease}
.clue b{color:#F2C14E}
.worldon .toast{top:64px;bottom:auto}
.realnote{font-size:12px;color:#AEB5DA;margin:8px 2px 0}

/* notebook */
.nb{max-width:720px;margin:0 auto}
.nb h3{font-family:var(--display);font-size:22px;margin:0 0 6px}
.nb ol{padding:0;list-style:none;margin:10px 0}
.nb li{background:#FBF7EC;color:#1B1530;border-radius:12px;padding:10px 12px;margin:0 0 8px;border-left:6px solid #F2C14E}
.nb li small{display:block;color:#6A6380;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.nb li.miss{background:#1E2456;color:#7F87B8;border-left-color:#3A4290}

/* scene reading inside the real reader */
body.inscene .art .scx{display:none!important}
.scenehead{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;background:#151A40;color:#F3F0E6;border-radius:14px;padding:10px;margin:0 0 18px}
.scenehead .thumb{position:relative;border-radius:10px;overflow:hidden}
.scenehead .thumb::before{content:"";display:block;padding-top:56%}
.scenehead .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.scenehead b{font-family:var(--display);font-size:18px;display:block;color:#fff}
.scenehead p{margin:2px 0 8px;font-size:14px;color:#C9CEEC}
.sceneend{margin:22px 0 4px;padding:16px;border-radius:14px;background:#151A40;color:#F3F0E6;text-align:center}
.sceneend p{margin:0 0 10px}
@media (max-width:560px){
  .scenehead{grid-template-columns:96px 1fr}
  .dlg{grid-template-columns:auto 1fr;padding:10px}
  .dlg .face{width:46px;height:46px}
  .dlg .say{font-size:16px}
  .pin .pb{width:30px;height:30px}
  .pin .pb span{font-size:14px}
  .pin .pl{font-size:11px;padding:1px 7px}
  .pin.l .pl{right:34px}.pin.r .pl{left:34px}
  .hs .tag{font-size:10.5px;padding:2px 6px}
  .wtop h2 small{display:none}
}
.libworld{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:center;background:#151A40;color:#F3F0E6;border-radius:16px;padding:12px;margin:0 0 22px}
.libworld .thumb{position:relative;border-radius:10px;overflow:hidden}
.libworld .thumb::before{content:"";display:block;padding-top:70%}
.libworld .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.libworld h3{font-family:var(--display);font-size:20px;margin:2px 0 4px;color:#fff}
.libworld p{margin:0 0 10px;font-size:14.5px;color:#C9CEEC}
@media (max-width:560px){.libworld{grid-template-columns:1fr}}
/* ---------- v25 guidance ---------- */
.wmodal{position:absolute;inset:0;z-index:5;background:rgba(6,8,24,.72);display:grid;place-items:center;padding:16px;overflow:auto}
.wmcard{width:min(560px,100%);background:#FBF7EC;color:#1B1530;border:3px solid #1B1530;border-radius:18px;box-shadow:0 8px 0 #1B1530;padding:18px 18px 16px;max-height:calc(100% - 8px);overflow:auto}
.wmcard h3{font-family:var(--display);font-size:24px;margin:4px 0 8px}
.wmcard p{margin:0 0 10px;font-size:16px;line-height:1.5}
.wmcard .eyebrow{color:#8E5BD8}
.wmacts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.tdots{display:flex;gap:6px;justify-content:center;margin-top:12px}.tdots i{width:8px;height:8px;border-radius:50%;background:#D7D0E8}.tdots i.on{background:#1B1530}
.tdemo{background:#151A40;color:#F2C14E;border-radius:12px;padding:14px;text-align:center;font-family:var(--display);font-weight:800;font-size:19px;margin:0 0 10px}
.tlist{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:10px}
.tlist li{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:15.5px;line-height:1.4}
.tlist li>span:first-child{justify-self:center}
.tpin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#F2C14E;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center;font-size:15px}
.tpin.done{background:#5BD49A}.tpin.lock{background:#9AA3BA}
.tlist .tpin{line-height:1}
.ttag{background:#fff;border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.25);font-family:var(--display);white-space:nowrap}
.ttag.obj{background:#FFF4CC}
.tring{width:44px;height:44px;border-radius:50%;border:4px solid #F2C14E;display:grid;place-items:center;font-size:20px;background:#1B1530}
.tsteps{margin:6px 0 10px;padding-left:22px;display:grid;gap:6px;font-size:16px}
.chthumb{position:relative;border-radius:12px;overflow:hidden;margin:-4px 0 10px}.chthumb::before{content:"";display:block;padding-top:30%}.chthumb svg{position:absolute;inset:0;width:100%;height:100%}
.chq{background:#1B1530;color:#FBF7EC;border-radius:12px;padding:10px 12px;margin:6px 0 10px}.chq span{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#F2C14E}.chq b{font-size:17px}
.chsub{font-size:12px!important;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6A6380;margin:8px 0 6px!important}
.chlist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.chlist li{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #E2DCEF;border-radius:12px;padding:6px 8px}
.chlist .cface{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:#E8E2F7;overflow:hidden}.chlist .cface svg{width:100%;height:100%;display:block}
.chlist b{display:block;font-size:14.5px}.chlist small{display:block;color:#6A6380;font-size:13px;line-height:1.3}
.chwords{display:flex;flex-wrap:wrap;gap:6px}
.quest{max-width:1000px;margin:10px auto 0;background:#151A40;border:1px solid #2A3170;border-radius:14px;padding:8px 12px;color:#D8DCF5}
.quest .qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.quest .qhead b{font-family:var(--display);color:#fff}
.qhelp{border:0;background:none;color:#F2C14E;font-weight:700;font-size:13.5px;padding:2px 0}
.quest ol{list-style:none;padding:0;margin:6px 0 4px;display:flex;flex-wrap:wrap;gap:6px}
.quest li{font-size:13.5px;background:#1E2456;border:1px solid #3A4290;border-radius:999px;padding:2px 10px 2px 6px;display:flex;gap:5px;align-items:center}
.quest li i{font-style:normal;color:#7F87B8;font-weight:800}
.quest li.ok{background:#1D4A3A;border-color:#2F7A55;color:#C9F2DD}.quest li.ok i{color:#5BD49A}
.quest li.main{border-color:#F2C14E}
.qnext{margin:2px 0 0;font-size:14.5px}.qnext b{color:#F2C14E}
.hs.next::after,.pin.next::after{content:"👆";position:absolute;left:50%;font-size:34px;line-height:1;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));animation:poke 1s ease-in-out infinite}
.hs.next::after{content:"👈";top:26%;left:100%;margin-left:-6px;animation:pokex 1s ease-in-out infinite}
@keyframes pokex{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
.hs.read.next::after{content:"👆";top:96%;left:50%;margin-left:-17px;animation:poke 1s ease-in-out infinite}
.pin.next::after{top:100%;margin-left:-17px;margin-top:22px}
.pin.l.next::after,.pin.r.next::after{margin-top:2px}
@keyframes poke{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hs.next .tag{outline:3px solid #F2C14E}
.rtips{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:#C9CEEC}
.rtips .wchip{font-size:12px;padding:0 4px}
.rtips .dotp{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--hi);margin-right:2px}
@media (max-width:560px){.tlist li{grid-template-columns:84px 1fr;font-size:14.5px}.wmcard{padding:14px}.wmcard h3{font-size:21px}.hs.next::after,.pin.next::after{font-size:24px;margin-left:-12px}}
.scenehead .rtips b{display:inline;font-size:inherit;font-family:inherit;color:#fff}
/* ---------- v26 standalone: cleaner screens ---------- */
body.solo .realnote,body.solo .legendw>span,body.solo .quest .qhead{display:none}
body.solo .legendw{margin:0}
body.solo .wtop h2 small{display:none}
body.solo .mapintro{justify-content:center;font-size:16px;margin-bottom:12px}
body.solo .mapintro>:first-child:not(span){display:none}
body.solo .quest{background:none;border:0;padding:6px 2px 0}
body.solo .quest ol{margin:0 0 4px}
body.solo .quest li{font-size:12.5px}
body.solo .qnext{font-size:14px;color:#AEB5DA}
body.solo .hs.obj .tag{opacity:.92}
body.solo .dlg{margin-top:10px}
body.solo.inscene .top,body.solo.inscene .dots,body.solo .rhint{display:none}
body.solo .scenehead{grid-template-columns:120px 1fr}
body.solo .scenehead .eyebrow{display:none}
/* ---------- v27 game layer: HUD, progress, training coach, popups, boss, studio, secrets ---------- */
.wtop{gap:8px;padding-top:8px;padding-bottom:8px;background:#141936}
.wtop h2{font-size:17px}
.hud{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.hudstar{display:flex;align-items:center;gap:4px;border:1px solid #3A4290;background:#1E2456;color:#F2C14E;border-radius:999px;padding:2px 11px 2px 2px;font-weight:800;font-size:15px;font-family:var(--display);line-height:1}
.hudstar .hm{width:32px;height:32px;border-radius:50%;background:#2A3170;overflow:hidden;display:block}
.hudstar .hm svg{width:32px;height:32px;display:block}
.hudstar b{color:#fff;font-size:15px}
.hudstar.bump{animation:gbump .55s ease}
@keyframes gbump{30%{transform:scale(1.22)}60%{transform:scale(.96)}}
.wbtn.ic{padding:5px 9px;display:flex;gap:3px;align-items:center;font-size:15px}
.wbtn.ic small{font-size:12px;color:#AEB5DA;font-weight:700}
.wtop>.wbtn:first-child{flex:0 0 auto}

/* map progress card */
.gprog{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:#151A40;border:1px solid #2A3170;border-radius:16px;padding:8px 10px;margin:0 0 8px}
.gpm{width:62px;height:62px;border-radius:50%;background:#232A62;border:2px solid #3A4290;padding:0;overflow:hidden}
.gpm svg{width:100%;height:100%;display:block}
.gprank{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.gprank b{font-family:var(--display);font-size:17px;color:#fff}
.gprank span{font-size:13px;color:#F2C14E;font-weight:700}
.gbar{height:10px;border-radius:999px;background:#0E1230;margin:5px 0 4px;overflow:hidden;border:1px solid #2A3170}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,#F2C14E,#FFE14D);border-radius:999px;transition:width .6s}
.gpmid small{font-size:12.5px;color:#AEB5DA}.gpmid small b{color:#F2C14E}
.gpgoal{border:2px solid #F2C14E;background:#231E3A;color:#F3F0E6;border-radius:14px;padding:6px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.gpgoal span:first-child{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#F2C14E}
.gpgoal b{font-family:var(--display);font-size:15px}
.gdots{display:inline-flex;gap:4px;vertical-align:middle}
.gdots i{width:10px;height:10px;border-radius:50%;background:#3A4290;display:inline-block}
.gdots i.on{background:#5BD49A}
.gnext{margin:0 2px 10px;font-size:14.5px;color:#D8DCF5;text-align:center}.gnext b{color:#F2C14E}
@media (max-width:620px){.gprog{grid-template-columns:52px 1fr}.gpm{width:52px;height:52px}.gpgoal{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}}

/* training: one thing to tap at a time */
#world.tutlock button:not(.tutok):not(.wchip){pointer-events:none;opacity:.38;filter:saturate(.4)}
#world.tutlock #wmodal button{pointer-events:auto;opacity:1;filter:none}
#world.tutlock .hs:not(.tutok){opacity:.5}
#world.tutlock #wquest,#world.tutlock .gnext{display:none}
#world .tutok{position:relative;z-index:2}
#world .dbtn.tutok,#world .wbtn.tutok,#world .hudstar.tutok{box-shadow:0 0 0 4px #F2C14E,0 0 18px 6px rgba(242,193,78,.65);animation:gglow 1.2s ease-in-out infinite}
#world .pin.tutok .pb,#world .hs.tutok .tag{box-shadow:0 0 0 4px #F2C14E,0 0 18px 6px rgba(242,193,78,.7)}
#world .hs.tutok{outline:3px dashed rgba(242,193,78,.9);outline-offset:2px;border-radius:14px}
@keyframes gglow{50%{box-shadow:0 0 0 6px #F2C14E,0 0 26px 10px rgba(242,193,78,.45)}}
#gcoach{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:17;width:min(560px,calc(100% - 24px));display:flex;gap:10px;align-items:center;background:#FBF7EC;color:#1B1530;border:3px solid #1B1530;border-radius:18px;box-shadow:0 6px 0 #1B1530;padding:8px 14px 8px 8px;animation:gup .35s ease;pointer-events:none}
#gcoach.top{bottom:auto;top:calc(60px + env(safe-area-inset-top,0px))}
#gcoach .cm{width:54px;height:54px;flex:0 0 54px;border-radius:50%;background:#E9F0FF;overflow:hidden}
#gcoach .cm svg{width:100%;height:100%;display:block}
#gcoach p{margin:0;font-size:15.5px;line-height:1.4}
#gcoach.shake{animation:gshake .4s}
@keyframes gup{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes gshake{20%,60%{transform:translate(calc(-50% - 8px),0)}40%,80%{transform:translate(calc(-50% + 8px),0)}}
.gcoachr{display:flex;gap:10px;align-items:center;background:#FFF4CC;border:2px solid #F2C14E;border-radius:14px;padding:8px 12px;margin:-6px 0 16px;font-size:15px;line-height:1.4}
.gcoachr .cm{width:46px;height:46px;flex:0 0 46px}.gcoachr .cm svg{width:100%;height:100%}.gcoachr p{margin:0}

/* popups */
#glayer{position:fixed;inset:0;z-index:18;background:rgba(6,8,24,.72);display:grid;place-items:center;padding:16px;overflow:auto;touch-action:manipulation;font-family:var(--body)}
.gcard{width:min(540px,100%);background:#FBF7EC;color:#1B1530;border:3px solid #1B1530;border-radius:20px;box-shadow:0 8px 0 #1B1530;padding:18px;animation:gpop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes gpop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.gcard h3{font-family:var(--display);font-size:24px;margin:2px 0 8px}
.gcard p{margin:0 0 10px;font-size:16px;line-height:1.5}
.gcard .eyebrow{color:#8E5BD8}
.gcard .small{font-size:14px;color:#5A5370}
.gcard .wmacts.wrap{flex-wrap:wrap}
.dbtn.danger{background:#D6453D;color:#fff}
.dbtn[disabled]{opacity:.45}
.tlist2{list-style:none;padding:0;margin:4px 0 10px;display:grid;gap:8px}
.tlist2 li{background:#fff;border:1px solid #E2DCEF;border-radius:12px;padding:8px 10px;font-size:15px;line-height:1.4}
.bigprize{display:flex;gap:10px;align-items:center;background:#1B1530;color:#FBF7EC;border-radius:12px;padding:10px 12px;font-size:15px;margin:6px 0 0}
.bigprize b{color:#F2C14E}
.mpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.mcard{border:3px solid #E2DCEF;background:#fff;border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#1B1530}
.mcard svg{width:84px;height:84px}
.mcard b{font-family:var(--display);font-size:17px}.mcard small{font-size:12.5px;color:#6A6380}
.mcard.on{border-color:#1B1530;background:#FFF4CC;transform:translateY(-3px);box-shadow:0 5px 0 #1B1530}

 {x:"The [[dissatisfaction|unhappiness|anger]] currently [[roiling|stirring up|shaking]] Europe<<e:, from France to Spain to Britain to Belgium,>> is about many things<<e:: schools, housing, pensions, unemployment>>. But step back, and it’s also about one big thing — a [[generational fight|fight between age groups|young-vs-old fight]] over an ((economic pie|pie)) [[fixed in its size|kept the same size|that can’t grow]]<<c: by the continent’s [[chronic|long-lasting|long]] slow economic growth>>.",zh:"从法国到西班牙、英国、比利时，欧洲的不满涉及学校、住房、养老金和失业。但说到底，是两代人在争一块因经济长期低增长而做不大的“蛋糕”。"},
 {h:"‘Gerontonomia’",x:"As Europe’s population [[ages|gets older|gets older]], conflict may be [[unavoidable|impossible to avoid|sure to happen]]. Because [[ultimately|in the end|in the end]], different generations have different [[economic interests|money needs|needs]]<<w:, said Tim Vlandas, a professor at Oxford>>.",zh:"欧洲老龄化，冲突可能无法避免。牛津教授 Tim Vlandas 说，不同世代的经济利益本来就不同。"},
 {x:"Young people need [[investments in education|spending on schools|money for schools]], a strong [[labor market|job market|jobs]] and [[affordable housing|homes they can afford|cheap homes]]. People over 65, [[by contrast|on the other hand|but]], tend to want [[generous|large|big]] {{pensions|pension}} and [[social care|care services|care]], [[protection for the value of|keeping up the value of|safe]] their homes and other [[assets|things they own|stuff]], and [[low *inflation*|slow price rises|prices that stay low|inflation]]<<x:, even [[at the cost of|if it means|if it means]] [[higher unemployment|more people without jobs|fewer jobs]]>>. <<c:(No one likes inflation, but [[retirees|retired people|old people]] who [[rely on|depend on|live on]] savings and [[fixed incomes|money that doesn’t go up|set money]] are particularly [[sensitive to it|hurt by it|hurt by it]].)>>^^If prices rise 5% but your pension stays the same, you can buy about 5% less. A worker might get a raise; a retiree usually can’t.^^",zh:"年轻人需要教育投入、好的就业市场和买得起的房子；65岁以上的人更想要高养老金、照护、资产保值和低通胀，哪怕失业率更高。（靠存款和固定收入生活的退休者对通胀特别敏感。）",xr:"s10"},
 {x:"As older people become a larger [[portion|part|part]] of the population<<d: in aging societies>>, their [[political influence|power in politics|power]] has also grown, and they have been [[getting their way|getting what they want|winning]]. The result is what <<w:Vlandas=>one expert>> calls “{{gerontonomia|gerontonomia}},” <<c:a form of “[[democratically sustained economic *stagnation*|economic slowdown kept going by voters|stuck economy, kept stuck by votes|stagnation]].”=>a stuck economy.>>^^Geronto- means old person (as in gerontology); -nomia means rules (as in economy). It is the word Vlandas uses for his idea.^^",zh:"老年人占比越来越高，政治影响力也越来越大，而且一直在赢。Vlandas 把结果叫作“老人经济”：一种由民主投票维持的经济停滞。",xr:"s11"},
 {x:"The [[disease|illness|problem]] and its [[symptoms|signs|signs]] are [[widespread|everywhere|everywhere]].^^The writer talks about the economy like a sick body: disease, symptoms. That is a metaphor.^^ <<n:In France, youth unemployment stands at around 20 percent.>> <<n:[[GDP growth|The economy’s growth|Growth]] fell to zero percent in the second quarter of this year.>>^^GDP = the value of everything a country makes. A quarter = three months.^^ <<n:Pension costs make up approximately a quarter of all public spending,=>Pensions cost a lot,>><<c: in part because the retirement age is so low,>> but there is little political [[appetite|desire|wish]] for changing it.",zh:"症状到处都是：法国青年失业率约20%，今年第二季度GDP零增长，养老金约占公共支出的四分之一，部分因为退休年龄低，但政界没人想改。"},
 {x:"Many<<w:, particularly on the left,>>^^“The left” means parties that usually want the government to spend more to help people.^^ have argued that it is possible to [[preserve|keep|keep]] pensions and increase education spending. But the question of how to pay [[remains|is still there|is still open]]. <<c:The [[looming|coming|coming]] threat of a [[debt crisis|crisis from owing too much|debt problem]] makes further borrowing difficult.>> <<x:And [[wealth taxes|taxes on rich people|taxes on the rich]], while often [[politically appealing|popular with voters|popular]], have not raised much money in the past.>>",zh:"很多人（尤其左派）认为养老金和教育都能保，但钱从哪来？债务危机逼近，难再借钱；富人税听起来好，过去却没收上多少钱。"},
 {x:"The situation is similar in Spain<<n:, which has one of the oldest populations in Europe,=>,>> and where protests over a [[housing crisis|housing problem|home problem]] recently [[contributed to|helped lead to|led to]] <<w:Prime Minister Pedro Sánchez’s=>the leader’s>> decision to call new elections. While [[the face of the protests|the best-known protester|the protest leader]] was <<e:an 87-year-old renter=>an old renter>>, many young people joined, because the housing crisis [[*disproportionately* affects them|hurts them much more|hurts them most|disproportionately]].",zh:"西班牙情况类似：人口是欧洲最老之一，住房抗议促使首相桑切斯提前大选。抗议的代表人物是一位87岁的租客，但很多年轻人加入，因为住房危机对他们伤害更大。",xr:"s13"},
 {x:"<<n:Spanish youth unemployment is over 22 percent.>> House prices have risen far more quickly than [[wages|pay|pay]]<<c:, adding to the wealth of older generations,>> but leaving many young people with a choice of living with their parents<<n: well into their 30s>> or [[sacrificing|giving up|using up]] savings to pay a [[steep|very high|high]] rent.",zh:"西班牙青年失业率超过22%。房价涨得比工资快得多，让老一代更富，年轻人却只能30多岁还住父母家，或者花光积蓄付高房租。"},
 {x:"In Britain, the youth unemployment rate is lower<<n:, around 16 percent>>. But housing costs are [[steep|very high|high]]<<d:, particularly in and around London, where most job growth is located>>. And the country has [[committed to|promised to keep|promised]] the so-called “triple lock,” <<c:a policy that has for years [[ensured|made sure|made sure]] pensions have risen faster than wages.=>a pension rule.>>^^The triple lock raises pensions every year by whichever is highest: price rises, wage rises, or 2.5%.^^",zh:"英国青年失业率低一些，约16%，但房价很高，尤其在就业集中的伦敦。英国还承诺了“三重锁定”，多年来让养老金涨得比工资快。"},
 {x:"In a recent speech, <<w:Prime Minister Andy Burnham=>the prime minister>> [[pledged|promised|promised]] to [[overhaul|completely change|change]] the policy<<x:, long considered [[untouchable|too risky to change|off-limits]]>>. <<w:One union leader called the pledge “almost [[electoral insanity|crazy for winning votes|crazy]],”>> <<x:even though Burnham promised to spend the money saved on adult social care, which would largely benefit the aged, too.>>",zh:"首相 Andy Burnham 最近承诺改革这项一向没人敢碰的政策。一位工会领袖说这“几乎是选举自杀”，尽管省下的钱会用于成人照护，同样主要惠及老人。"},
 {h:"Why older people have an edge",x:"Wealthy nations can [[look forward to|expect|expect]] more of these battles, but older people may continue to [[set the political agenda|decide what politicians work on|be in charge]].",zh:"富裕国家会有更多这样的冲突，而老年人可能继续主导政治议程。"},
 {x:"The [[elderly|old people|old people]] are [[well-placed to rally others to their cause|in a good spot to get others on their side|good at getting help]], because they have [[institutions|big organizations|groups]] on their side<<w:, said Kevin Arceneaux, a political science professor at Sciences Po in Paris>>. Political parties and unions have [[an *incentive*|a strong reason|a reason|incentive]] to [[protect the interests of|look after|help]] older people<<c:, who make up [[the bulk of|most of|most of]] their membership and ((voting coalitions|votes))>>.",zh:"巴黎政治学院教授 Kevin Arceneaux 说，老年人有机构撑腰，容易争取支持：政党和工会的成员和选民大多是老人，所以有动机保护他们。"},
 {x:"It is also easier to [[convince|persuade|get]] young people to support [[old-age benefits|help for old people|help for the old]] that they might one day receive than it is to convince old people to pay more for education<<c: that they will never use themselves>>. <<w:Younger generations share some of the benefits from spending on the elderly, experts say.=>Young people get some of that money too.>> <<e:Adult children still living at home may see pension payments as part of their [[household’s income|family’s money|family’s money]], rather than a [[transfer|handover|gift]] from young workers to [[retirees|retired people|old people]].>>",zh:"让年轻人支持自己将来也能拿到的养老福利，比让老人为自己用不上的教育多出钱容易。年轻人也分到一些好处：住在家里的成年子女会把养老金当成家庭收入。"},
 {x:"<<w:In Britain, Laura Serra, a researcher at the London School of Economics, has found that=>In Britain,>> working-age generations often worry they will have to support their aging parents themselves if pensions are cut. <<e:In fact, France’s young people were [[out in force|there in big numbers|there]] to support the 2023 protests against Macron’s proposed [[pension reform|pension change|pension change]].>>",zh:"伦敦政经学院研究员 Laura Serra 发现，工作年龄的人担心养老金一减，就得自己养父母。事实上，2023年法国年轻人也大批上街反对马克龙的养老金改革。"},
 {x:"But with economic growth slow in much of the continent, and government borrowing becoming [[prohibitively expensive|too expensive to do|too costly]], choices may have to be made. And when they are, young people<<x:, and perhaps economies as a whole,>> will be at a [[disadvantage|weaker position|losing side]].^^Look back at the title: if the pie can’t grow, someone has to get a smaller slice.^^",zh:"但欧洲经济增长慢、借钱越来越贵，总得做取舍。一旦取舍，吃亏的会是年轻人，也许还有整个经济。"},
 {x:"<<d:Last week, as=>As>> young people blocked schools across the country, France’s [[lawmakers|members of parliament|leaders]] met to [[review|go over|look at]] next year’s budget. One of their first moves was to [[preserve|keep|keep]] a [[tax break|lower tax|tax cut]] for [[*pensioners*|retired people|old people|pension]].^^Notice the twist: young people were outside protesting about schools while, inside, one of the first decisions helped the old. The writer ends here on purpose.^^",zh:"上周，年轻人在全国封锁学校时，法国议员开会审议明年的预算，他们最先做的事之一，是保住了退休人员的减税。"}
]},
paper:{id:"paper",genre:"Academic paper",gcol:"--legend",src:"Constructionism 2010 conference, Paris · 14 pages",title:"[[*Restructurations*|Rebuilding Subjects|New Ways to Show Ideas|restructuration]]: [[Reformulating Knowledge Disciplines|Reshaping School Subjects|Changing Subjects]] through [[New Representational Forms|New Ways of Writing Ideas Down|New Symbols and Tools]]",by:"Uri Wilensky & Seymour Papert",note:"Selected sections in the authors’ own words. Headings in [brackets] are ours.",paras:[
 {h:"Abstract",x:"The [[goals of instruction|aims of teaching|goals of school]] are usually [[taken to be fixed|treated as set|seen as fixed]]<<x:, at least in their broad outline>>. <<e:For example, in elementary school mathematics, students [[progress|move on|go]] from counting, to addition, multiplication, and fractions.>> [[Given this state of affairs|Because of this|So]], the business of [[educational research|research on education|education research]] has been to [[determine|figure out|find]] how the fixed [[instructional aims|teaching goals|goals]] can best be reached. <<e:Education researchers have traditionally asked questions such as: What are the typical difficulties that students experience? Which [[means of instruction|way of teaching|way of teaching]] – method A or method B – is better for achieving our instructional aims?>>",zh:"人们通常认为教学目标是固定的，比如小学数学从数数到加法、乘法、分数。于是教育研究只问：怎样最好地达成这些目标？学生常见的困难是什么？方法A和方法B哪个更好？",views:"start"},
 {x:"[[In contrast|By contrast|But]], we will describe a line of work in which we have [[shifted the focus from the means to the object of learning|moved our attention from how we teach to what we teach|asked “what should we learn?”, not “how should we teach?”||“The means” is how you teach; “the object” is what gets learned. The plain version keeps the idea but loses the sharp pairing of two short words.]]. We are concerned with how the [[structure and properties of knowledge|shape of knowledge|shape of an idea]] [[affect its learnability|change how easy it is to learn|make it easy or hard to learn]]<<c: and the power that it [[affords|gives|gives]] to individuals and groups>>. <<e:We briefly review three [[agent-based|computer-agent|agent]] {{restructurations|restructuration}} of traditional science content and discuss the [[consequences|results|results]] for scientific power and learnability.>>",zh:"我们反过来，把关注点从“怎么教”转向“学什么”：知识本身的结构如何影响它好不好学、能给人多大力量。我们会介绍三个基于智能体的科学内容“重构”。"},
 {h:"Introduction",omitBefore:"first paragraph of the Introduction",x:"As a first step<<c: to presenting this [[conceptualization|way of thinking|idea]],>> we look back [[historically|at history|at history]] at changes in science that had [[significant|big|big]] benefits for both scientists and learners. The example that we have found most useful in presenting our idea is the shift from ((Roman to Hindu-Arabic numerals|roman)) in arithmetic.^^Hindu-Arabic numerals (0–9 with place value) reached Europe around 1200, helped by Fibonacci’s book Liber Abaci.^^ This was not done with an “[[educational intent|aim to help students|plan to help learning]].” But it had [[profound consequences|deep effects|big effects]] for education. <<c:The new direction suggested in the paper is to study more [[systematically|carefully|carefully]] changes of this kind, to examine the practices of science in search of cases that could but have not had similar educational consequences and to consider the possibility of [[deliberately|on purpose|on purpose]] making such changes in thinking about scientific (and, indeed, other) topics with an educational intent.=>The paper wants to make changes like this on purpose.>> <<w:The conceptualization of our own projects developed in the paper presents it as [[exemplifying|an example of|an example of]] this direction of work.>>",zh:"我们先回看历史上对科学家和学习者都有益的变化，最好的例子是从罗马数字到印度-阿拉伯数字。这个转变本来不是为了教育，却深刻影响了教育。本文主张系统研究这类变化，并有意为了教育去创造它们。"},
 {h:"A thought experiment",x:"Imagine a country, FOO, where people [[represented numbers|wrote numbers|wrote numbers]] as the Romans did, using symbols such as MCMXLVIII.^^MCMXLVIII = 1948. M = 1000, CM = 900, XL = 40, VIII = 8.^^ [[Learning Science researchers|Scientists who study learning|Learning experts]] in this [[imaginary|made-up|made-up]] country were very concerned with the difficulty of learning to handle numbers, and they worked hard to make these skills [[accessible|reachable|open]] to more of their [[citizens|people|people]]. They [[engaged in|tried|tried]] a number of different approaches. Some researchers collected the {{misconceptions|misconception}} and typical mistakes made by children. <<e:For example, they might have discovered that some children believed that since CX is ten more than one hundred, then CIX must be ten more than CI.>>^^CIX is really 109 (100 + 9). Ten more than CI (101) would be CXI (111). The symbols fooled the kids.^^ Others constructed and studied computer programs that allowed students to practice [[numerical operations|math with numbers|sums]]. Still others constructed specially developed [[*manipulatives*|hands-on learning objects|blocks to hold|manipulatives]]<<e: --wooden blocks marked with the symbols C, X, V, and I—>> to help students learn. <<x:Yet another group tried to [[elucidate|explain|explain]] the problem by [[framing it in evolutionary terms|explaining it through evolution|using evolution]], [[speculating|guessing|guessing]] that perhaps humans were just not [[wired|built|made]] to do multiplication and division.>>",zh:"想象一个叫FOO的国家，用罗马数字记数。那里的学习科学家为了让更多人学会算数想尽办法：收集孩子的错误观念（比如以为CIX比CI大10），做练习软件，做刻着C、X、V、I的木块教具，甚至猜测人类天生不适合乘除法。",views:"roman"},
 {x:"It is not hard to imagine<<d:, in our thought experiment,>> that many of these approaches brought about [[substantial improvement|big improvement|big gains]] in learning. But let us now imagine that, at some point, Hindu-Arabic numerals were invented by the educators of this country. This invention then opened up a new way to handle and think about numbers. [[Resulting gains in educability towards a functional numeracy|The improvement in how well people could learn useful math|How much better people learned math]] would likely far [[outstrip|beat|beat]] any of the benefits<<c: that would have [[accrued|built up|come]] from any of the improved techniques for teaching with the Roman numeral system=> of the other ideas>>. Before: the learning gap in arithmetic was [[immense|huge|huge]]<<n:: only a small number of trained people could do multiplication>>. After: multiplication became part of what we can expect everyone to learn.",zh:"这些办法都可能有效。但如果FOO的教育者发明了印度-阿拉伯数字，带来的进步会远远超过所有改进教法的效果。之前，只有少数受过训练的人会乘法；之后，人人都能学会。",xr:"px2"},
 {x:"This [[parable|teaching story|story]] is not [[intended|meant|meant]] to show that the other approaches were wrong. <<x:They added knowledge that would likely have useful applications even after the shift in representations.>> But the point is that the most dramatic improvements did not come from what we usually think of as the main part of the science of learning.",zh:"这个寓言不是说其他方法错了，而是说最大的进步并不来自我们通常认为的学习科学主体。"},
 {omitBefore:"one paragraph",x:"A first step is to name the sort of [[innovation|new idea|change]] associated with the shift from Roman to Hindu-Arabic [[representations of number|ways of writing numbers|number symbols]]. This sort of [[transformation|big change|change]] has no name in the standard [[educational discourse|way educators talk|teacher talk]]. <<x:It is not sufficient, for example, to say that we have a new “curriculum,” or a new “instructional approach.”>> <<e:Even in this simple case, the [[algorithms|step-by-step methods|methods]] that are taught, students’ [[mental representation|picture in their head|picture in their head]], their sense of [[systematicity|order|order]] in the field, psychologically important [[landmark values|key numbers|key numbers]], and even social [[embedding|place|place]] (“who can do what,” e.g., scribes for the emperor vs. modern carpenters or business people) changes.=>Many things change at once.>> In our [[terminology|words|words]], we will say that we have a new [[structuration|structure|structure]] of a discipline. <<w:The main thrust of this paper is to [[flesh out|fill in|explain]] this term through concrete examples. But, for now, we introduce a [[preliminary|first|first]] formal definition:=>Definition:>> By structuration we mean: [[the encoding of the knowledge in a domain as a function of the representational infrastructure used to express the knowledge|how the knowledge in a subject is shaped by the symbols and tools we use to write it down|how a subject depends on its symbols]]. A change from one structuration of a domain to another [[resulting from such a change in representational infrastructure|caused by a change in those symbols and tools|caused by new symbols]] we call a {{restructuration|restructuration}}.^^Example: arithmetic with Roman numerals and arithmetic with 0–9 are the same knowledge, built in very different ways. Switching from one to the other is a restructuration.^^",zh:"这种转变在教育界没有名字，说“新课程”“新教法”都不够：算法、心理表征、关键数值，甚至“谁能做什么”的社会分工都变了。作者把它叫作“结构化”：知识如何被表示它的工具所塑造；表示工具改变带来的结构变化，叫作“重构”（restructuration）。",xr:"px1"},
 {h:"Ways to evaluate restructurations",omitBefore:"three paragraphs on diSessa, Galileo and algebra",x:"From our current [[perspective|point of view|view]], it is obvious that the Hindu-Arabic restructuration leads to better results in being able to handle [[numerical relationships|how numbers relate|numbers]] than the Roman structuration. However, to the people of Foo<<w: and to Foo’s [[evaluators|judges|testers]] and test-makers>>, it was not obvious. In our thought experiment, students who learned the new Hindu-Arabic system would likely not be able to pass the [[standardized tests|official tests|tests]] developed using the old Roman system. <<e:Suppose they were asked: Which is the largest, CIX, XCI, or CXI?>>^^CIX = 109, XCI = 91, CXI = 111. A 0–9 kid might not even understand the question.^^ <<x:A student of the Hindu-Arabic system might not even understand this question, yet still be much better prepared to deal with real-world [[arithmetical problems|math problems|math]].>> The same set of difficulties may be [[anticipated|expected|expected]] today. <<c:To overcome this difficulty the Learning Sciences must [[strive|work hard|try]] to create [[evaluation measures|ways to test|tests]] that go beyond the [[specifics of a representation|details of one way of writing|symbols]] which is a [[means to an end|tool, not the goal|tool]] and instead [[devise|invent|make]] measures for the ends themselves.=>So tests should check the real goal, not the old symbols.>>^^Connection to reading: a test full of hard words can miss a kid who understands the ideas.^^",zh:"今天看来，阿拉伯数字显然更好，但FOO的人和出题者看不出来：学新数字的学生可能答不出“CIX、XCI、CXI哪个最大”，却更会解决真实问题。所以评价要考目标本身，而不是旧的表示方式。"},
 {h:"[Four ways to see a circle]",omitBefore:"the five properties of a restructuration",x:"We introduce the scientific restructurings by looking at a number of ways to think about a ((circle|circles)). For Euclid a circle is defined by the fact that all its points are at the same distance from a certain point called its center. <<c:An aspect of this that is to be kept in mind is that the decision about whether a point is on the circle requires access to a point that is not on the circle: an ant crawling on a path could not use this definition to decide whether the path is circular.=>But you need to see the center to use it.>>",zh:"用几种方式看“圆”。欧几里得：所有点到圆心距离相等。但这要看到圆外的圆心，在路上爬的蚂蚁没法用这个定义判断自己是不是在走圆。",views:"circles"},
 {x:"The second view of the circle is its definition by an [[equation|math sentence|formula]] such as x² + y² = K. <<w:This was made possible by a major restructuration of geometry, due to Descartes, by representing geometric entities in algebraic form.=>This came from Descartes.>>^^Descartes (1600s) turned shapes into equations with x and y coordinates: the grid you use for graphs.^^",zh:"第二种是方程 x²+y²=K，这来自笛卡尔把几何变成代数的重构。"},
 {x:"The third view will be presented [[anachronistically|out of its time order|out of order]] in terms of a computational object known as “the turtle” or “the Logo turtle.”^^Logo is a programming language for children. Papert and his colleagues created it in 1967.^^ Think of this as an [[entity|thing|thing]] that has two essential “state properties.” <<e:In Euclid’s geometry the fundamental element is a point defined by the fact that it has position and no other properties. As a mathematical entity it has no color, size or shape although the geometer may represent it as a small, black dot.>> The turtle is much like the point except that its has position and ONE other property, called its heading. <<x:Again on a computer screen it is represented as something with shape, color and size but these are not properties of the pure mathematical turtle.>> A turtle in motion has two velocities: <<c:its [[linear velocity|straight-line speed|speed]] is the rate of change of its position; its [[angular velocity|turning speed|turning]] is the rate of change of its heading.=>moving speed and turning speed.>>",zh:"第三种用Logo“小海龟”：它和点一样有位置，但多了一个属性“朝向”。移动的海龟有两种速度：直线速度（位置变化）和角速度（朝向变化）。"},
 {x:"With these [[preliminaries|basics|basics]] we can state our third view of the circle. If a turtle moves with both velocities [[constant|steady|the same]] it will draw a circle! What is [[remarkable|amazing|amazing]] about this is that the turtle draws the circle without reference to any [[external entity|outside thing|outside point]]<<e: such as Euclid’s “center” or Descartes “coordinate axes.”=>.>> Another way of saying this is that with this definition an ant walking on the circle can know that it is a circle. <<x:Yet another is that someone with a tiny [[field of view|area they can see|view]] can tell whether a figure is a circle by looking at all parts of it confined at each instant to the tiny field of view – and this is true no matter how tiny the field. We recall that using Euclid’s definition the observer’s field of view would have to be big enough to include the center as well as points of the [[circumference|edge of the circle|edge]].>>^^Try it: take one step, turn a little, repeat. Your path is a circle, and you never needed a center.^^",zh:"如果两种速度都保持不变，海龟就会画出一个圆！它不需要圆心或坐标轴，所以沿圆走的蚂蚁自己就能知道这是圆。"},
 {x:"We used a computational object to define a way of thinking about the circle for the reason that [[underlies|is behind|is behind]] the second plot line of our story: the turtle enables us to explain the concept in a simpler and more [[concrete|hands-on|real]] way than the one used by the [[pioneer|first person|first person]] of this way of thinking<<n: two centuries before the computer was invented>>. The pioneer was Isaac Newton and the concept is the core of what is now known as “calculus”<<x: although most contemporary students who are required to [[undergo|sit through|take]] school courses with this name would probably not recognize any connection>>. Newton’s great achievement was to [[deduce|work out|figure out]] a [[global property|fact about the whole shape|big picture]]<<e: (such as being a circle or an ellipse)>> from [[local properties|small, nearby facts|tiny steps]]<<e: (such as having constant curvature or the force of gravity at each point.)=>.>> This achievement gave rise rapidly to a restructuring of large areas of science. But<<x: – and one might say that this is the main theme of this paper –>> this restructuration could be appreciated and used only by people who had already acquired a rather complex body of [[prerequisite|needed-first|needed]] skills and knowledge, until the computer enables us to [[restructurate the restructuration|rebuild Newton’s idea again with new tools|rebuild it again]] and so make it accessible to many more people including, particularly, children considered too young to “learn calculus” in its pre-computational form.^^Signpost: when authors write “the main theme of this paper”, underline that sentence. This one is the whole paper in one line.^^",zh:"这背后是牛顿的思想：从局部性质（每一点的曲率、引力）推出整体性质（圆、椭圆），也就是微积分的核心。但过去只有掌握大量前置知识的人才能用；电脑让这个重构再被重构，连孩子也能学。"},
 {x:"<<w:This last [[assertion|claim|claim]] will be [[elaborated|explained more|explained]] shortly, but first we=>We>> introduce our fourth way of thinking about a circle. Place a large number of turtles at the same place. Give each one a random heading. Make them all move forward<<e: (i.e. in the direction of their headings)>> by the same amount. They will form a circle. <<x:In some ways this goes back to Euclid’s definition: but it has a new [[slant|angle|twist]]:=>Here,>> the circle [[emerged|appeared on its own|showed up]] from the behaviors of a large number of [[*agents*|computer creatures|little actors|agent]]. What will emerge in this case is “obvious.” But we shall see how the interaction of large numbers of agents each following a very simple rule can give rise to complex, scientifically interesting and [[by no means obvious|not at all obvious|surprising]] [[*emergent* effects|effects that come from the whole group|group effects|emergent]].",zh:"第四种：把很多海龟放在同一点，各自随机朝向，走同样的距离，它们就组成一个圆。圆是从大量智能体的行为中“涌现”出来的。简单规则的大量互动能产生复杂而不显然的涌现效果。"},
 {h:"Agent-based Modeling",omitBefore:"the rest of the circle story, Turtle Geometry and Example 1 (the Tick model)",x:"One powerful [[methodology|method|method]] that has emerged from [[complex systems theory|the science of complex systems|complexity science]] is agent-based modeling. In contrast to more traditional mathematical modeling which is typically done with equations, agent-based modeling makes use of simple [[computational rules|computer rules|rules]] as the [[fundamental modeling elements|basic building blocks|building blocks]]. The [[equational modeling game|equation approach|equation way]] is to observe a [[phenomenon|thing that happens|event]] and try to [[fashion|make|make]] an equation that fits the observed data. <<e:A classic example is the ((Lotka-Volterra equations|abm)) used to model the change in [[predator and prey|hunter and hunted|hunter and hunted]] population levels over time.>> <<x:In equational modeling, the core elements of the model are variables that refer to population-level [[descriptors|descriptions|numbers]].>> <<n:In the Lotka-Volterra equations, the core elements are L, the population level of the lynx predators, H, the population level of the hare prey, and K, the [[interaction constant|meeting number|number]] that describes the average [[predation|hunting|hunting]].>> <<c:To understand the state of the system at a future time T, you solve the equations for that time.>> In contrast, in the agent-based modeling game, the core elements are computational objects or “agents” that represent individual lynxes or hares.^^A lynx is a wild cat. A hare is a large wild rabbit. Lynxes eat hares.^^ <<e:Each of these agents has state variables that describe its particular state, such as age, energy level, hunger, etc.>> The behavior of the agents is determined by the computational rules that tell each agent what to do at each “tick” of a clock. The rules are framed from the agent’s point of view. <<e:For example, if the agent is a lynx, the rules might say: move a step in the direction you are headed, reduce your energy variable by a fixed amount, look for [[prey|animals to eat|food]] in the [[vicinity|area nearby|area]], if found where you are, try to eat it, if not turn to face closest prey you can see…>> To determine the state of the system at future time T, you run the system for T clock ticks. <<x:As rules typically have [[stochastic|random|chance]] components, one would typically run the system many times to capture the space of possible [[trajectories|paths|paths]] for the system.>>",zh:"基于智能体的建模来自复杂系统理论。传统方法用方程描述整体，比如Lotka-Volterra方程用L（猞猁数量）、H（野兔数量）、K（捕食常数）。智能体建模则把每只猞猁、野兔做成有年龄、能量等状态的个体，每个时钟“滴答”按规则行动；想知道未来，就运行模型，并多跑几次看各种可能。",views:"abm"},
 {omitBefore:"two paragraphs on why scientists like agent-based models",x:"In the educational context, there is one more advantage that is greatest of all: [[the greater ease of mastering the representations themselves|the tools themselves are easier to learn|the tools are easier to learn]]. Learning to master the LK equations requires the prior mastering of an [[extensive|large|large]] algebraic and calculus-based [[infrastructure|foundation|base]] that is out of reach for large numbers of our students. These students are therefore [[shut out of|locked out of|kept out of]] the scientific exploration of most worldly phenomena that change over time. <<x:And even those students who do eventually master algebra and calculus do so late in their student “careers”.>> Agent-based representations, in contrast, require [[significantly|much|much]] less effort to master. <<n:Research we have conducted shows that typical middle school students can [[profitably employ|use well|use]] these representations with only a small amount of prior instruction.=>Even middle schoolers can use them.>> [[Widespread adoption of agent-based representations|Using agent-based models everywhere|Using agent models widely]] can therefore lead to [[tremendous|huge|huge]] {{democratization|democratize}} of scientific knowledge.^^Connection: this is the FOO story again. Equations are like Roman numerals; agents are like 0–9.^^",zh:"在教育中最大的优势是：表示工具本身更容易掌握。学方程要先学代数和微积分，很多学生因此被挡在外面；而智能体模型连初中生稍加指导就能用。这能让科学知识大众化。"},
 {h:"Conclusion",omitBefore:"Examples 2 and 3 (GasLab and MaterialSim)",x:"We have briefly laid out the theory of restructurations and called for careful consideration of computer-based, and in particular, agent-based restructurations of science content and instruction. <<e:We have presented three examples of such restructurations.>> We note that such restructurating is not [[confined to|limited to|only for]] mathematics and natural science. <<x:Indeed, we [[suspect|think|think]] that agent-based restructurations of social science may give even [[grater leverage|greater power|more power||Small find: the paper has a typo here. “Grater” should be “greater”. Only a careful reader of the original spots it.]].>> We note that our own fields of education and learning sciences can be restructurated using agent-based approaches. <<e:To understand educational reform and phenomena such as curricular adoption, homework collaborations and the effects of educational policies, agent-based modeling can be a powerful tool.>> It enables us to study these phenomena as [[emergent from the interactions of the individuals|coming out of what individual people do together|coming from what each person does]] rather than through [[properties of the *aggregate* populations|averages of whole groups|group totals|aggregate]].",zh:"我们介绍了重构理论和三个例子。重构不限于数学和自然科学，社会科学甚至教育本身也能用智能体方法重构：把教育现象看成个体互动中涌现的结果，而不是整体平均值。",views:"end"}
]}};

  mechanism:{word:"mechanism",pos:"noun",rar:"rare",def:"The hidden steps inside something that make it work or change.",zh:"机制",ex:"One reason why progress in understanding these mechanisms has been so long in coming…",parts:"mechan- = machine (Greek). Think of the gears inside a clock that you can't see from the front.",ladder:["how it works","the inside parts","the hidden process","mechanism"]},
  addend:{word:"addend",pos:"noun (math)",rar:"rare",def:"A number that you add to another number. In 2 + 5, both 2 and 5 are addends.",zh:"加数",ex:"…counting up from the larger addend the number of times indicated by the smaller addend.",parts:"add + -end (“the thing to be ___ed”, Latin). Like dividend = the number to be divided.",ladder:["number","number you add","part of a sum","addend"]},
  variability:{word:"variability",pos:"noun",rar:"rare",def:"How much things change or are different from each other.",zh:"变异性，多变",ex:"More striking, however, was the variability in children’s strategy use.",parts:"vary (change) + -ability → how able something is to vary",ladder:["mix","how different","how much it varies","variability"]},

  transition:{word:"transition",pos:"noun",rar:"common",def:"The change from one way or state to another.",zh:"过渡，转变",ex:"…the short-cut sum strategy, may be critical to the transition.",parts:"trans (across) + it (go, Latin) → going across, from one side to the other.",ladder:["change","switch","moving from one to the next","transition"]},
