  ethnographic:{word:"ethnographic",pos:"adjective",rar:"legendary",def:"Studying people by spending a long time with them and watching their everyday life.",zh:"民族志的（长期实地观察的）",ex:"Through a longitudinal, ethnographic study of one … elementary school…",parts:"ethno (people) + graphic (writing) → writing about people from up close.",ladder:["watch and write","study by being there","long, close watching","ethnographic"]},
  proactive:{word:"proactive",pos:"adjective",rar:"rare",def:"Acting early to make something happen, instead of waiting.",zh:"主动的",ex:"…expecting students to be “proactive learners”…",parts:"pro (before) + active → acting before something happens.",ladder:["go-getter","acts first","takes the first step","proactive"]},
  entitlement:{word:"entitlement",pos:"noun",rar:"legendary",def:"The feeling that you have a right to something, like help from a teacher.",zh:"（理所当然的）权利感",ex:"…middle-class children’s sense of entitlement…",parts:"en (give) + title (a right) → being given a right to something.",ladder:["“I should get it”","feeling it’s your right","a sense of having a right","entitlement"]},
  capital:{word:"cultural capital",pos:"noun",rar:"legendary",def:"Know-how and habits from your family that help you get ahead, the way money does.",zh:"文化资本",ex:"…these behaviors become a form of cultural capital…",parts:"capital = wealth you can use to make more (from Latin caput, head, as in heads of cattle).",ladder:["know-how","family habits that help","know-how that works like money","cultural capital"]}
});
Object.assign(BG,{
  mathtest:{h:"Same test, different sentence",p:"Strong math students, women and men, took the same very hard math test. Half were told “this test usually shows gender differences”. Half were told “men and women score the same on it”. With the first sentence, women scored far below men. With the second, women and men scored about the same. (The bars show the pattern, not exact scores.)",q:"stereotype threat experiment explained"},
  verbaltest:{h:"Called a test, or called a puzzle",p:"Black and White Stanford students took the same very hard verbal test. When it was described as a measure of ability, Black students scored much lower than White students with similar past scores. When the same test was described as a puzzle task, they scored the same. (The bars show the pattern, not exact scores.)",q:"Claude Steele stereotype threat Stanford study"},
  fragments:{h:"Word puzzles that read your mind",p:"Fill in the gaps: __ce, la__, lo___. You might write “race”, “lace”, “lazy”, “lady”, “loser”, “lower”… The words people choose show what is on their mind. Black students who expected a test of ability chose more words linked to the stereotype and to self-doubt.",q:"implicit word stem completion task"},
  sisyphus:{h:"The boulder that rolls back",p:"In a Greek myth, King Sisyphus is punished by having to push a huge boulder up a hill forever. Every time it nears the top, it rolls back down. “Sisyphean” means a job that never ends, no matter how well you do it.",q:"myth of Sisyphus for kids"},
  stuy:{h:"Who got into Stuyvesant",p:"Stuyvesant is one of New York City’s best public high schools. Students get in with one hard test. In 2013 it offered places to 9 Black, 24 Latino, 177 White and 620 Asian students. In the city’s schools as a whole, most students are Black or Latino.",q:"Stuyvesant High School admissions test"},
  loop:{h:"The four-step loop",p:"1. Many Asian immigrants have more schooling than most people back home and in the US. 2. They bring extra after-school classes with them. 3. So a good label about Asian students forms. 4. Teachers expect more from the next Asian students, who rise to it. Then the loop starts again.",q:"Jennifer Lee stereotype promise"},
  wait:{h:"Wait time",p:"After asking “Any questions?”, the teachers waited only two or three seconds. Kids who already knew what to ask got in. Kids who needed a moment to notice they were stuck missed the chance.",q:"wait time teaching Mary Budd Rowe"},
  requests:{h:"Counting the asks",p:"Calarco counted every request for help during class. The average middle-class 5th grader asked teachers for help more than seven times. The average working-class 5th grader asked about once.",q:"Jessica Calarco negotiating opportunities"}
});
TEXTS.threat={id:"threat",genre:"Psychology paper",short:"Threat",gcol:"--bad",src:"American Psychologist · June 1997 · 17 pages",title:"A [[Threat|Danger|Danger]] in the Air: How [[*Stereotypes*|Labels about Groups|Group Labels|stereotype]] Shape [[Intellectual Identity|How Smart You Feel|Who You Are at School]] and [[Performance|How Well You Do|Scores]]",by:"Claude M. Steele",note:"Selected sections in the author’s own words, lightly trimmed. Headings in [brackets] are ours.",paras:[
 {h:"Abstract",x:"A general theory of [[domain identification|caring about a subject as part of who you are|caring about a subject||“Domain” means a subject area, like math. “Identification” means it is part of how you see yourself. The plain words lose the science name for it.]] is used to describe [[achievement barriers|things that block success|blocks]] still faced by women in advanced [[quantitative|math-heavy|math]] areas and by African Americans in school. The theory assumes that [[sustained|lasting|lasting]] school success requires identification with school; that [[societal pressures|pressures from society|outside pressures]] on these groups can [[frustrate|block|block]] this identification; and that in school areas where these groups are negatively stereotyped, those who have become identified face the further barrier of {{stereotype|stereotype}} threat, the threat that others’ judgments or their own actions will negatively stereotype them. Research shows that this threat [[dramatically depresses|sharply lowers|sharply lowers]] the test performance of women and African Americans who are in the academic {{vanguard|vanguard}} of their groups, that it causes {{disidentification|disidentify}} with school, and that practices that reduce this threat can reduce these negative effects.",
  zh:"本文用“领域认同”理论解释女性在高等数学领域、非裔美国人在学校中仍然面临的成就障碍。持续的学业成功需要认同学校；社会压力会阻碍这种认同；而在这些群体被负面刻板印象笼罩的领域，已经认同该领域的人还要面对“刻板印象威胁”。研究表明，这种威胁会显著拉低群体中最优秀学生的考试成绩，使他们与学业“去认同”，而减少威胁的做法能减轻这些负面影响。",
  gs:"This paper asks why some women do worse in hard math, and why some Black students do worse in school. Steele’s answer is {{stereotype|stereotype}} threat: the worry that people will judge you by a bad idea about your group. This worry can lower test scores, even for the best students. It can also make students stop caring about school. But schools can make the worry smaller."},
 {h:"[Same classroom, different experience]",x:"[[From an observer’s standpoint|To someone watching from outside|From outside]], the situations of a boy and a girl in a math classroom or of a Black student and a White student in any classroom are [[essentially|basically|basically]] the same. The teacher is the same; the textbooks are the same; and in better classrooms, these students are treated the same. Is it possible, then, that they could still experience the classroom differently, so differently in fact as to [[significantly|really|really]] affect their performance and achievement there? This is the central question of this article.",
  zh:"从旁观者的角度看，数学课上的男孩和女孩、任何课堂上的黑人学生和白人学生，处境基本相同：老师一样，课本一样，在好的课堂里待遇也一样。那么，他们有没有可能对课堂有完全不同的体验，不同到足以影响成绩？这是本文的核心问题。",
  gs:"If you watch a math class from the outside, a boy and a girl seem to be in the same situation. A Black student and a White student seem the same too. Same teacher, same books. But could they feel the class very differently? Different enough to change their grades? That is the big question of this paper.",
  dp:{q:"Think of a class where everyone has the same teacher and the same books. Could two students still be in different situations? What could be different?",a:"What each student expects others to think of them. The room is the same, but the “air” is not: one student may feel watched or doubted, and the other doesn’t."}},
 {h:"A threat in the air",x:"It is the social-psychological threat that arises when one is in a situation or doing something for which a negative stereotype about one’s group applies. This [[predicament|tricky situation|tricky spot]] threatens one with being negatively stereotyped, with being judged or treated stereotypically, or with the prospect of [[conforming to|fitting|fitting]] the stereotype. Called stereotype threat, it is a [[situational|caused by the situation|situation]] threat, a threat in the air,^^“In the air” means it lives in the situation, not inside the person. Leave the situation and the threat is gone.^^ that can affect the members of any group about whom a negative stereotype exists (e.g., skateboarders, older adults, White men, gang members).",
  zh:"当一个人身处某种情境、正在做的事情恰好对应着关于其群体的负面刻板印象时，就会产生这种社会心理威胁：害怕被刻板印象看待、被按刻板印象评判，或害怕自己真的印证了它。它叫“刻板印象威胁”，是一种情境性的威胁，“弥漫在空气中”，任何有负面刻板印象的群体都可能遇到（如玩滑板的人、老年人、白人男性、帮派成员）。",
  gs:"Stereotype threat happens when there is a bad idea about your group, and you are doing the very thing it is about. You worry: “Will people judge me by that idea? Will I prove it true?” Steele calls it a threat “in the air”: it comes from the situation, not from inside you. It can happen to any group with a bad label, like skateboarders, older people or White men.",
  dp:{q:"Steele lists “White men” as a group that can feel stereotype threat. In what situation could that happen?",a:"Any situation where a bad idea about White men fits. For example, a math test that is said to compare them with Asian students.",more:"In a 1999 study by Joshua Aronson and colleagues, White men who were very good at math did worse on a hard math test when they were told it was part of a study on why Asian students do well in math."}},
 {h:"Two ways it hurts",x:"First, if the threat is experienced in the middle of a performance, a classroom presentation or test-taking, for example, the emotional reaction it causes could directly [[interfere with|get in the way of|get in the way of]] performance. Second, when this threat becomes [[chronic|ongoing|constant]] in a situation, as for the woman who spends considerable time in a competitive, male-oriented math environment, it can pressure {{disidentification|disidentify}}, a [[reconceptualization of the self|new way of seeing yourself|new self-picture]] so as to remove the domain as a [[basis of self-evaluation|way you judge yourself|way to judge yourself]]. Disidentification offers the [[retreat|escape|escape]] of not caring about the domain. But as it protects in this way, it can [[undermine|weaken|weaken]] [[sustained motivation|the drive to keep going|drive]] in the domain.",
  zh:"第一，如果在表现过程中（比如课堂展示或考试时）感受到威胁，由此产生的情绪反应会直接干扰表现。第二，当威胁长期存在（比如一位女性长期身处竞争激烈、男性主导的数学环境），它会迫使人“去认同”：重新定义自我，不再把这个领域当作评价自己的依据。不在乎可以保护自己，但也会削弱在这个领域持续努力的动力。",
  gs:"Stereotype threat hurts in two ways. First, the worry during a test or a talk in class can make you do worse right then. Second, if the worry goes on for a long time, you may decide “math just isn’t me.” That is {{disidentification|disidentify}}. Not caring protects your feelings, but then you stop trying.",
  dp:{q:"“I don’t care about math anyway.” Why might someone say this to protect themselves? What does it cost them?",a:"If math doesn’t count toward who you are, a bad grade can’t hurt your self-respect. The cost: you stop practising, so you really do fall behind. The shield becomes a trap."}},
 {h:"Who it hits hardest",x:"Stereotype threat is especially frustrating because, at each level of schooling, it affects the {{vanguard|vanguard}} of these groups, those with the skills and self-confidence to have identified with the domain. [[Ironically|Strangely|Strangely]], their [[susceptibility|weakness|weakness]] to this threat derives not from internal doubts about their ability but from their identification with the domain and the resulting concern they have about being stereotyped in it. This argument has the hopeful [[implication|meaning|meaning]] that to improve these students’ performance, one should focus on the [[feasible|doable|doable]] task of lifting this situational threat rather than on altering their internal psychology.",
  zh:"刻板印象威胁特别令人沮丧，因为在每个教育阶段，它影响的都是这些群体的“先锋”：那些有能力、有自信、认同这个领域的人。讽刺的是，他们之所以容易受威胁，不是因为内心怀疑自己的能力，而是因为他们认同这个领域，所以在意被刻板印象看待。这带来一个充满希望的推论：要提高这些学生的表现，应该去做可行的事——消除情境中的威胁，而不是改变他们的内心。",
  xr:"tx1",
  gs:"The threat hits the best students hardest: the {{vanguard|vanguard}}, the ones who are skilled and confident and care about the subject. Strange but true: they are not worried because they doubt themselves. They are worried because they care, and they don’t want to be judged by the label. Good news: you don’t need to fix the student’s mind. You can fix the situation.",
  dp:{q:"Why is it “hopeful” that the problem is in the situation and not inside the student?",a:"A situation can be changed by teachers and schools fairly quickly: how a test is described, what students are told. Changing what is deep inside a person is much harder.",link:["promise","Lee & Zhou flip this idea around: what happens when the label about your group is a good one?"]}},
 {h:"[You don’t have to believe it]",x:"To experience stereotype threat, one need not believe the stereotype nor even be worried that it is true of oneself. The well-known African American social psychologist James M. Jones (1997) wrote: “When I go to the ATM machine and a woman is making a [[transaction|bank task|banking]], I think about whether she will fear I may rob her. Since I have no such intention, how do I put her at ease? Maybe I can’t . . . and maybe she has no such expectation. But it goes through my mind.” Jones felt stereotype threat in this situation even though he did not believe that the stereotype [[characterized|described|fit]] him.",
  zh:"要感受到刻板印象威胁，一个人不必相信刻板印象，甚至不必担心它适用于自己。著名非裔社会心理学家James M. Jones写道：“我去ATM机时，如果有位女士正在取钱，我会想她会不会怕我抢她。我没有这个意图，怎样才能让她安心？也许我做不到……也许她根本没这么想。但这个念头会在我脑中闪过。”Jones并不认为刻板印象描述的是他，但仍感受到了威胁。",
  gs:"You don’t have to believe a label for it to bother you. The psychologist James Jones, who is Black, wrote about standing at a cash machine behind a woman. He wondered: “Is she afraid I will rob her? How can I show her I won’t?” He knew the label was false. It still went through his mind.",
  dp:{q:"Jones didn’t believe the stereotype. So why did it still cost him something?",a:"Because he had to spend attention managing what someone else might think. That extra worry takes energy away from whatever you are doing, at the ATM or in a test."}},
 {x:"The effort to overcome stereotype threat by disproving the stereotype, for example by outperforming it in academic work, can be [[daunting|scary and huge|huge]]. Because these stereotypes are widely [[disseminated|spread|spread]] throughout society, a personal [[exemption|free pass|pass]] from them earned in one setting does not [[generalize|carry over|carry over]] to a new setting where one’s reputation is not known. Thus, even when the stereotype can be disproven, the need to do so can seem ((Sisyphean|sisyphus)), [[everlastingly recurrent|coming back forever|never-ending]].",
  zh:"试图通过推翻刻板印象来克服威胁（比如在学业上表现得比刻板印象好），是一项艰巨的任务。因为这些刻板印象在社会上广泛流传，在一个场合赢得的“豁免”不会延续到新场合——那里没人知道你的名声。所以即使刻板印象可以被推翻，这种需要也像西西弗斯推石头一样，永无止境。",
  gs:"Can you beat a label by doing great? Only for a while. If you prove it wrong in one class, you must prove it again in the next class, where nobody knows you. Steele calls this ((Sisyphean|sisyphus)): a job that never ends.",
  dp:{q:"Why doesn’t proving a stereotype wrong once make it go away?",a:"Because the stereotype lives in society, not in one person’s head. Every new teacher, new school or harder test is a new audience. Your success gets counted as an “exception”, not as proof."}},
 {h:"The math test experiments",x:"Spencer, Quinn, and I designed a basic research [[paradigm|test setup|setup]]: We recruited female and male students, mostly college sophomores, who were both good at math and strongly identified with it. We then gave them a very difficult math test one at a time. As expected, women significantly [[underperformed|did worse|did worse]] in relation to equally qualified men on this difficult math test. But more important, in another condition in which the test was an advanced literature test, and participants had been matched for their strong literature skills, women performed just as well as equally qualified men. This happened, we reasoned, because women are not stereotype threatened in this area.",
  zh:"我们设计了一个基本研究范式：招募数学好、并且非常认同数学的男女大学生（大多是大二学生），一个一个地给他们做一套很难的数学题。正如预期，女生的成绩明显低于水平相当的男生。但更重要的是，在另一个条件中，测试换成高难度的文学题，参与者都是文学能力强的学生，这时女生和水平相当的男生考得一样好。我们认为，这是因为在文学领域女性不受刻板印象威胁。",
  gs:"Steele’s team tested strong math students, women and men, who cared a lot about math. On a very hard math test, women did worse than equally good men. But on a very hard literature test, women did just as well as men. Why? There is no common label that says women are bad at literature."},
 {x:"A second experiment showed that women’s underperformance did not happen when the test was easier. But an alternative [[interpretation|explanation|explanation]] was possible: the biological limits of women’s math ability do not emerge until the material is difficult. A third experiment tested this by changing only how the same difficult test was described. Participants were told either that the test generally showed gender differences, or that it showed no gender differences. Women performed worse than men when they were told that the test produced gender differences, but they performed equal to men when the test was [[represented as insensitive to|described as not showing|said to show no]] gender differences, even though the same difficult test was used in both conditions. [[Genetic limitation|A limit in their genes|Genes]] did not cap the performance of women in these experiments.",
  zh:"第二个实验发现，题目较容易时，女生不会考得更差。但还有另一种解释：女性数学能力的生理极限只在题目很难时才显现。第三个实验检验了这一点：同一套难题，只改变描述方式。一组被告知这套题通常有性别差异，另一组被告知没有性别差异。前一组女生考得比男生差，后一组女生和男生一样好，尽管两组用的是同一套题。在这些实验中，基因并没有限制女性的表现。",
  views:"mathtest",
  gs:"On easier math tests, women did fine. Some people said: maybe women’s brains just hit a limit on hard math. So the team gave everyone the same hard test, but described it two ways. Group 1 heard: “Men and women usually score differently on this test.” Group 2 heard: “Men and women score the same.” In group 1, women did worse. In group 2, women did as well as men. Same test, different words. So genes were not the cause.",
  dp:{q:"Why was the third experiment so clever? What did it rule out?",a:"It kept everything the same, the people, the test, the difficulty, and changed only one sentence. If genes were the cause, one sentence couldn’t change the scores. Since it did, the situation must matter.",more:"Later scientists repeated these studies many times. The effect often showed up, but usually smaller than in the first experiments, and some repeats found none. Scientists still argue about how big stereotype threat is in real classrooms. Checking a finding again is a normal, healthy part of science."}},
 {h:"Black students and verbal tests",x:"Black and White Stanford University students took a test made of the most difficult items on the verbal GRE exam.^^The GRE is a hard exam many Americans take to get into graduate school.^^ The first study varied whether the test was presented as ability-{{diagnostic|diagnostic}}, that is, as a test of intellectual ability, or as ability-nondiagnostic, a laboratory problem-solving task unrelated to ability. Black participants greatly underperformed White participants in the diagnostic condition but equaled them in the nondiagnostic condition. A second experiment produced the same pattern with an even more slight change: whether or not participants recorded their race on a questionnaire just before taking the test. [[Salience|Being reminded|A reminder]] of the racial stereotype alone was enough to [[depress|lower|lower]] the performance of identified Black students.",
  zh:"斯坦福大学的黑人和白人学生做了一套由GRE语文部分最难题目组成的测试。第一个研究改变测试的说法：一种说它是“智力能力测试”，另一种说它只是与能力无关的实验室解题任务。在“能力测试”条件下，黑人学生的成绩远低于白人学生；在“非能力测试”条件下，两者持平。第二个实验的改动更小：考前填问卷时是否写下自己的种族。仅仅让种族刻板印象变得醒目，就足以拉低认同学业的黑人学生的成绩。",
  views:"verbaltest",
  gs:"Next, Black and White students at Stanford took a very hard words-and-reading test. Some were told it measured how smart they are: a {{diagnostic|diagnostic}} test. Others were told it was just a puzzle task. When it was called a test of ability, Black students scored much lower. When it was called a puzzle, they scored the same as White students. Even just writing down your race before the test lowered Black students’ scores.",
  dp:{q:"Writing your race on a form is a tiny thing. Why might it change a test score?",a:"It brings the stereotype to mind right before the test. Then part of your attention goes to the worry instead of the questions.",more:"Because of research like this, some researchers have suggested asking students about race and gender after a big test instead of before it."}},
 {h:"[What was on their minds]",x:"Did the threat really bring the stereotype to mind? Just before the test, participants completed 80 word fragments, 10 of which could be completed with words linked to the stereotype (for example, ((__ce, la__, or __or|fragments)) could become race, lazy, or poor) and 5 with words of self-doubt (loser, dumb, shame). Black participants in the diagnostic condition completed more fragments with stereotype- and self-doubt-related words than any other group. Also, as a last item before the test, participants could choose to record their race. All of the Black participants in the nondiagnostic condition and all of the White participants listed their race, whereas only 25% of the Black participants in the diagnostic condition did so.",
  zh:"威胁真的让人想到了刻板印象吗？考前，参与者完成80个单词填空，其中10个可以填成与刻板印象有关的词（如__ce、la__、__or可以填成race、lazy、poor），5个可以填成自我怀疑的词（loser、dumb、shame）。“能力测试”条件下的黑人学生填出的刻板印象词和自我怀疑词最多。考前最后一题让参与者选择是否填写种族：“非能力测试”条件下的黑人学生和所有白人学生都填了，而“能力测试”条件下的黑人学生只有25%填写。",
  gs:"Did the threat really put the label in their heads? The team gave word puzzles with missing letters, like ((__ce or la__|fragments)). Black students who expected a test of ability filled in more words like “race”, “lazy”, “loser” and “dumb”. Then everyone could choose to write their race on a form. Every other student did. Only 1 in 4 Black students expecting the ability test did.",
  dp:{q:"Why would someone leave their race off a form right before a hard test?",a:"To avoid being seen through the stereotype. It shows the students were not just nervous in general. They were trying to escape one specific label."}},
 {h:"“Wise” schooling",x:"As a different diagnosis, the present analysis comes to a different [[prescription|remedy|fix]]: the schooling of stereotype-threatened groups may be improved through situational changes that reduce the threat. Schooling that does this, I have called wise, a term borrowed from Irving Goffman (1963), who borrowed it from gay men and lesbians of the 1950s. They used it to [[designate|name|name]] people who understood their full humanity despite the [[stigma|shame others attached to them|bad label]]: family and friends, usually, who knew the person beneath the stigma.",
  zh:"诊断不同，药方也不同：通过改变情境、减少威胁，可以改善受刻板印象威胁群体的学业。我把这样的教育称为“明智的”（wise）。这个词借自社会学家Goffman，而他又借自20世纪50年代的同性恋群体：他们用这个词称呼那些不顾污名、看到他们完整人性的人——通常是了解污名之下真实的人的家人和朋友。",
  gs:"If the problem is the situation, the fix is to change the situation. Steele calls schools that do this “wise”. He borrowed the word from gay people in the 1950s. They called someone “wise” if that person saw the whole human, not the label. Usually that was family and friends.",
  dp:{q:"Who in your life is “wise” about you, seeing the person beneath a label? What do they do differently?",a:"They expect good things from you, tell you the truth about your work, and don’t treat one mistake as proof of a label."}},
 {h:"Three wise strategies",x:"Optimistic teacher-student relationships: critical feedback to African American students was strongly motivating when it was coupled with optimism about their potential. Challenge over {{remediation|remediation}}: giving challenging work conveys respect for students’ potential and shows them that they are not regarded through the lens of an ability-demeaning stereotype; remedial work, in contrast, reinforces the possibility that they are being viewed stereotypically. Stressing the [[expandability of intelligence|idea that intelligence can grow|growing brains]]: to the extent that schooling can stress what Carol Dweck called the [[incremental|step-by-step growing|growing]] nature of human intelligence, it should help to [[deflect|push away|push away]] this meanest implication of the stereotype.",
  zh:"三种明智的策略：一、乐观的师生关系——对非裔学生的批评性反馈，如果同时表达对其潜力的乐观，会很有激励作用。二、挑战优于补救——布置有挑战的任务表示尊重学生的潜力，说明没有用贬低能力的刻板印象看待他们；补救性的作业反而会强化“被刻板看待”的感觉。三、强调智力可以增长——如果学校强调Dweck所说的“智力可增长”，就能化解刻板印象最恶毒的含义。",
  gs:"Steele gives three ideas. 1. Teachers who are honest about mistakes, but sure the student can do better. 2. Give hard, interesting work, not easy catch-up work ({{remediation|remediation}}). Easy work can send the message “we think your group can’t do it.” 3. Teach that intelligence can grow with practice. Then a hard test can’t “prove” a fixed limit.",
  dp:{q:"Why could easy catch-up work make things worse for a student facing a stereotype?",a:"It can quietly say “we expect less of you”, which is the stereotype again. A challenge says “we think you can do this”.",more:"Carol Dweck later called the belief that intelligence can grow a “growth mindset”. Large studies in the 2010s found that short growth-mindset lessons help a little on average, and more for students who were struggling.",link:["help","Calarco shows another hidden rule of classrooms: who asks for help, and who gets it."]}}
]};
TEXTS.promise={id:"promise",genre:"Sociology paper",short:"Promise",gcol:"--l1",src:"Social Inclusion · 2014 · 15 pages",title:"From [[Unassimilable|Unable to Fit In|Outsiders]] to [[Exceptional|Top of the Class|Stars]]: the Rise of Asian Americans and “[[*Stereotype Promise*|the Lift of a Good Label|Good-Label Lift|promise]]”",by:"Jennifer Lee & Min Zhou",note:"Selected sections in the authors’ own words, lightly trimmed. Headings in [brackets] are ours.",paras:[
 {h:"Abstract",x:"Less than a century ago, Asian Americans were described as [[illiterate|unable to read|unable to read]], undesirable, and [[unassimilable|unable to fit in|never fitting in]] immigrants, yet today, they have the highest educational outcomes, highest rates of intermarriage, and lowest rates of residential segregation. Some scholars have [[attributed|credited|credited]] the dramatic change in their status to Asian culture and values. We argue that there is nothing [[essential|built-in|built-in]] about Asian culture or values that promotes exceptional outcomes, but, rather, a [[circular process|loop|loop]] unique to contemporary Asian immigrants in the United States. Stereotypes about Asian Americans are positive, which result in “{{stereotype promise|promise}}”, the promise of being viewed through the lens of a positive stereotype, which, in turn, can enhance the performance of Asian American students. This generates a {{self-fulfilling prophecy|prophecy}} and reproduces inequalities at the high end of education.",
  zh:"不到一百年前，亚裔美国人还被描述为不识字、不受欢迎、无法同化的移民；今天，他们的教育成就最高、通婚率最高、居住隔离率最低。一些学者把这一巨变归因于亚洲文化和价值观。我们认为，亚洲文化或价值观本身并没有什么必然带来卓越成就的东西，真正的原因是当代亚裔移民在美国特有的一个循环过程。关于亚裔的刻板印象是正面的，由此产生“刻板印象承诺”：被正面刻板印象看待，反过来能提升亚裔学生的表现。这形成了自我实现的预言，并在教育的高端再生产了不平等。",
  gs:"100 years ago, Americans called Asian immigrants dirty and said they could never fit in. Today Asian Americans finish more school than any other group in the US. Some people say: it’s because of Asian culture. Lee and Zhou disagree. They say it is a loop. People think Asian students are smart. That good label, “{{stereotype promise|promise}}”, helps the students do even better. Then the label seems true: a {{self-fulfilling prophecy|prophecy}}.",
  dp:{q:"The title says Asian Americans went “from unassimilable to exceptional”. If a group’s label can flip in 100 years, what does that tell you about labels?",a:"Labels say more about the time and the situation than about what a group really is. If culture were the cause, why was the same culture seen as a problem a century ago?",link:["threat","Steele studies the bad label: stereotype threat. Lee and Zhou study the good one."]}},
 {h:"Introduction",x:"Asian Americans are the fastest growing group in the United States, and account for 5.5% of the U.S. population, up from 0.7% in 1965. At UC Berkeley, Asian Americans [[constitute|make up|are]] 43% of the student population. Among the students offered admission to New York City’s famed Stuyvesant High School in the fall of 2013, ((9 were Black, 24 Latino, 177 White, and 620 Asian|stuy)). Given their [[overrepresentation|having more than their share|extra share]] at elite high schools and universities, [[pundits|TV and newspaper experts|commentators]] and scholars have [[touted|praised|praised]] Asian Americans as “model minorities,” whose success is [[attributed|said to be due|due]] to their exceptional cultural values.",
  zh:"亚裔是美国增长最快的群体，占美国人口的5.5%，1965年只占0.7%。在加州大学伯克利分校，亚裔占学生总数的43%。2013年秋纽约著名的史岱文森高中录取的学生中，黑人9名、拉丁裔24名、白人177名、亚裔620名。由于亚裔在顶尖高中和大学中比例过高，评论家和学者把他们称为“模范少数族裔”，并把成功归因于他们出色的文化价值观。",
  views:"stuy",
  gs:"Asian Americans are about 1 in 20 people in the US. But at UC Berkeley, a top university, they are 43 out of every 100 students. At Stuyvesant, a famous New York high school, ((620 of the 830 students offered a place were Asian|stuy)) in 2013. Only 9 were Black. So people started calling Asian Americans a “model minority” and said their culture was the reason.",
  dp:{q:"5.5% of the country, but 43% of Berkeley. What questions would you ask before deciding why?",a:"Who immigrated, and how much schooling did the parents have? Who could pay for tutoring? How do schools choose students? Big gaps usually have more than one cause.",more:"Stuyvesant admits students using one test. In 2018 New York’s mayor proposed changing this to admit more Black and Latino students, which started a big public fight."}},
 {x:"While the cultural values associated with Asian Americans today are positive, it is worth remembering that less than a century ago, Asians were described as illiterate, undesirable, and unassimilable immigrants, full of “filth and disease.” As “marginal members of the human race,” they were denied the right to [[naturalize|become citizens|become citizens]], denied the right to intermarry, and were [[residentially segregated|forced to live apart|kept apart]] in crowded ethnic [[enclaves|neighborhoods|areas]]. Despite decades of [[institutional discrimination|unfair treatment built into laws and systems|unfair laws]], the status of Asian Americans has risen dramatically in less than a century.",
  zh:"虽然今天与亚裔相关的文化价值观是正面的，但值得记住：不到一百年前，亚洲人被描述为不识字、不受欢迎、无法同化、满身“污秽和疾病”的移民。作为“人类的边缘成员”，他们不能入籍、不能与白人通婚，被隔离在拥挤的族裔聚居区。尽管经历了几十年的制度性歧视，亚裔的地位在不到一百年里大幅上升。",
  gs:"Don’t forget: less than 100 years ago, Asian immigrants were called dirty and diseased. They could not become citizens. They could not marry White Americans. They had to live in crowded separate neighborhoods. Yet in under 100 years, their place in America rose a lot.",
  dp:{q:"Why do the authors remind us of this ugly history before talking about success?",a:"To show that the “culture” explanation doesn’t work. The culture didn’t change much, but the label flipped. Something else must explain it.",more:"The Chinese Exclusion Act of 1882 banned Chinese workers from coming to the US. It was the first US law to keep out a whole nationality, and it lasted until 1943."}},
 {x:"We argue that Asian American exceptionalism is a result of a four-part circular process. First, contemporary Asian immigrants are highly educated and highly selected: those who immigrate are more highly educated than people who stayed behind, and also more than the U.S. average. This is what we refer to as “{{hyper-selectivity|hyperselect}}.” Second, they bring middle-class practices from their countries of origin, including a [[sophisticated|well-developed|big]] system of [[supplementary education|extra after-school classes|extra classes]]. Third, stereotypes about Asian Americans become positive and lead to “stereotype promise.” Fourth, when students succeed, teachers point to them as evidence that they were correct all along, and favour the next group of Asian American students, generating a new ((cycle|loop)).",
  zh:"我们认为，亚裔的“卓越”来自一个四步循环。第一，当代亚裔移民受教育程度高、经过高度筛选：移民者比留在本国的人受教育多，也高于美国平均水平，我们称之为“超高选择性”。第二，他们带来了本国的中产阶级做法，包括完善的课外补习体系。第三，关于亚裔的刻板印象变得正面，产生“刻板印象承诺”。第四，学生成功后，老师把他们当作自己判断正确的证据，进而偏爱下一批亚裔学生，开始新一轮循环。",
  views:"loop",
  gs:"The authors describe a loop with four steps. 1. Many Asian immigrants to the US had more schooling than most people back home, and more than most Americans ({{hyper-selectivity|hyperselect}}). 2. They bring extra classes and tutoring with them. 3. So people form a good label about Asian students. 4. When those students do well, teachers think “I was right” and expect a lot from the next Asian students. Then the ((loop starts again|loop)).",
  dp:{q:"Which step of the loop do you think is easiest to break? What would happen if it broke?",a:"Step 4, the teachers’ expectations, is the step schools control most. If teachers judged each student by their work, not by their group, the loop would lose its push."}},
 {h:"Data and Methods",x:"The data include 82 face-to-face, life-history interviews with 1.5- and second-generation Chinese and Vietnamese^^“1.5 generation” means born abroad and moved to the US as a child. “Second generation” means born in the US to immigrant parents.^^ randomly drawn from a large survey of the adult children of immigrants in Los Angeles. Unlike their Chinese immigrant counterparts, the Vietnamese first entered the country as {{refugees|refugee}} after the fall of Saigon in 1975. Most refugees had low levels of [[human and financial capital|schooling, skills and money|schooling and money]]. Despite the stark differences in the backgrounds of Vietnamese refugees and Chinese immigrants, their children [[converge|end up close together|end up alike]] in their educational outcomes, a pattern that we refer to as “second-generation convergence.”",
  zh:"数据包括82个面对面的生命史访谈，对象是从洛杉矶一项大型移民子女调查中随机抽取的1.5代和第二代华裔和越南裔。与华人移民不同，越南人是1975年西贡陷落后以难民身份来到美国的，大多数难民的教育和经济资本都很少。尽管越南难民和华人移民的背景差别很大，他们的子女在教育成就上却趋于一致，我们称之为“第二代趋同”。",
  gs:"The authors interviewed 82 grown-up children of Chinese and Vietnamese immigrants in Los Angeles. Many Vietnamese families came as {{refugees|refugee}}, escaping war after 1975, often with little money or schooling. Many Chinese parents came with more. But the children of both groups did about equally well in school.",
  dp:{q:"Why is the Vietnamese case so important for the argument?",a:"Their parents mostly did not have much schooling, yet the children still did very well. So “rich, educated parents” alone can’t explain it. Something in the community and the schools must help.",more:"Hundreds of thousands of Vietnamese “boat people” fled by sea from 1975 into the early 1990s. Many spent months or years in refugee camps before reaching the US."}},
 {h:"[Jason]",x:"Jason is a 25 year-old second-generation Chinese male who grew up in a working-class neighbourhood in Long Beach with parents who did not graduate from high school. As soon as his parents could afford it, they moved to a modest home in Cerritos because they learned from the “Chinese Yellow Book”^^The Chinese Yellow Book is a 2,500-page directory of Chinese businesses in Southern California. It also ranks local schools.^^ that Cerritos High School “ranks in the teens” for academics. When Jason moved to Cerritos in seventh grade, he was placed in the “regular” academic {{track|track}}. Concerned, his parents immediately enrolled him in an after-school Chinese academy, which he attended for three hours every day. When Jason took the exam for high school, his scores boosted him into the Advanced Placement (AP) track. He graduated in the top 10% of his class, and later from a top University of California school.",
  zh:"Jason，25岁，第二代华裔，在长滩的工人阶级社区长大，父母都没有高中毕业。家里一负担得起，就搬进了喜瑞都的一套普通房子，因为他们从《华人黄页》上得知喜瑞都高中的学业排名“在十几名”。七年级搬到喜瑞都时，Jason被分到“普通”班。父母很着急，马上让他上中文课后补习学校，每天三小时。升高中考试后，他进入了AP（大学先修）课程班。他以全班前10%毕业，后来从加州大学一所名校毕业。",
  gs:"Meet Jason. His parents worked hard jobs and never finished high school. They read in a Chinese business directory that the school in Cerritos was very good, so they moved there. At first Jason was put in the regular class group, not the top one. So his parents sent him to a Chinese after-school academy, 3 hours every day. Soon he moved up to the top {{track|track}}. Later he went to a top university.",
  dp:{q:"Jason’s parents had little money and little English. Where did they get the information and help they used?",a:"From their ethnic community: the Yellow Book, friends, and Chinese after-school academies. The authors call these “ethnic resources”: help that comes from your community, not from your own family’s money."}},
 {h:"[Vivian]",kicker:"Vivian, 25, remembers school in Taiwan",dlg:true,x:"Vivian: I would wake up at like 6:00 every morning and then go to school until 6:00 at night. And then, I would eat dinner, like, every day in the car. And then after like an hour or so, I would go to another like school, like an after school thing for whatever subject, like English, Math, or Physics. I didn’t leave after school until 11:00.\nInterviewer: So from 6:00 in the morning until 11:00 at night?\nVivian: Every day. I was thirty pounds lighter than what I am. I was like a bone skinny person, just totally not healthy.\nInterviewer: Did your friends do that too?\nVivian: Yeah everybody did that, starting in middle school, so it was a nightmare.",
  zh:"Vivian：我每天早上6点起床，上学到晚上6点。然后每天在车里吃晚饭。大概一小时后，再去另一个学校，就是课后补习班，英语、数学、物理什么都有。补习班要到11点才放学。\n访谈者：从早上6点到晚上11点？\nVivian：每天都是。我比现在轻30磅，瘦得皮包骨，完全不健康。\n访谈者：你的朋友也这样吗？\nVivian：是啊，大家都这样，从初中开始，简直是噩梦。",
  gs:"Vivian went to school in Taiwan before moving to the US. Every day she studied from 6 in the morning until 11 at night: regular school, then after-school classes. She ate dinner in the car. She got very thin and unhealthy. All her friends did the same. She calls it “a nightmare”.",
  dp:{q:"Vivian calls this schedule “a nightmare”. Is all extra study good for you? Where would you draw the line?",a:"Extra practice helps up to a point. After that, sleep, health and interest suffer. The system the authors describe works for grades, but it has real costs for kids."}},
 {h:"[Robert]",x:"Robert was born in Taiwan, migrated to the United States at the age of 7, and entered the second grade without speaking a word of English. However, by the third grade, he was placed into GATE (Gifted and Talented Education). The school first placed him into the ESL track, but upon his mother’s insistence, Robert was retested. He told us: “A lot of them thought because I was Asian, because I was one of the few Asians in my classes, they would think, ‘Oh well, he’s Asian, he must be smart.’”",
  zh:"Robert生于台湾，7岁移民美国，上二年级时一句英语也不会说。可到了三年级，他已经进了“天才班”（GATE）。学校起初把他分到英语补习班，在妈妈的坚持下他重新接受测试。他说：“很多老师觉得，因为我是亚洲人，班上亚洲人又少，‘他是亚洲人，肯定聪明’。”",
  gs:"Robert came from Taiwan at age 7 and spoke no English. At first the school put him in English-learner classes. His mom asked for a new test, and by third grade he was in the gifted program. Robert thinks teachers assumed: “He’s Asian, he must be smart.”",
  dp:{q:"Two things helped Robert: his mom pushed, and teachers assumed the best. Which do you think mattered more?",a:"Both together. His mom opened the door; the teachers’ good label kept it open. A kid with neither could have stayed in the lower group."}},
 {h:"[Ophelia]",x:"Ophelia, a 23 year-old second-generation Vietnamese woman, described herself as “not very intelligent”: “I wasn’t an exceptional student; I was a straight C student.” She took the AP exam at the end of junior high school, and failed. Although she failed the AP exam, Ophelia was placed into the AP track in her predominantly white high school, nevertheless. Once there, something “just clicked”: “I wanted to work hard and prove I was a good student.” She graduated from high school with a GPA of 4.2,^^GPA is a grade average. In many US schools 4.0 means all A’s, and hard AP classes can push it above 4.^^ and was admitted into a highly competitive pharmacy program.",
  zh:"Ophelia，23岁，第二代越南裔，说自己“不太聪明”：“我不是优秀学生，我门门都是C。”初中毕业时她参加了AP考试，没通过。尽管没通过，她还是被分进了以白人为主的高中的AP班。到那里后，她突然“开窍了”：“我想努力，证明我是好学生。”她以4.2的GPA高中毕业，考进了竞争激烈的药学专业。",
  gs:"Ophelia got C’s in school. She failed the test for the top AP classes. But her high school put her in the AP group anyway. There, something “clicked”. She wanted to show she was a good student, and she worked hard. She finished with top grades and got into a hard pharmacy program.",
  dp:{q:"Ophelia failed the test but was placed in AP anyway. Was that fair? Who else might have deserved that place?",a:"It helped her, but a non-Asian student with the same failing score probably would not have been placed there. A label can open doors for some kids and keep them shut for others."}},
 {h:"A self-fulfilling prophecy",x:"Teachers are more likely to notice Asian American students who excel, and overlook or ignore those who do not. Turning to Merton’s (1948) classic concept of the {{self-fulfilling prophecy|prophecy}}: it begins with a false definition of the situation, [[evoking|bringing out|causing]] a new behaviour, which makes the original false [[conception|idea|idea]] come true. The prophecy under consideration (that all Asians are high-achieving) is not correct, but only becomes so when students learn of their teachers’ and peers’ high expectations, resulting in a change in the students’ behaviour, and ultimately, a change in their academic outcomes.",
  zh:"老师更容易注意到表现出色的亚裔学生，而忽视那些表现一般的。用默顿（1948）的经典概念“自我实现的预言”来解释：它始于对情境的错误定义，引发新的行为，从而让最初错误的想法成真。“所有亚洲人都成绩好”这个预言本身不对，但当学生得知老师和同学对自己期望很高时，他们的行为改变了，最终成绩也改变了，预言就成真了。",
  gs:"Teachers tend to notice the Asian students who do great and forget the ones who don’t. The authors use an old idea from Robert Merton: the {{self-fulfilling prophecy|prophecy}}. A belief starts out false. But people act on it, and their actions make it come true. “All Asian kids are top students” is false. But when kids feel that high hope, they work harder, and their grades go up.",
  dp:{q:"Can you think of a self-fulfilling prophecy outside school?",a:"A team told it will surely lose stops trying, and loses. A kid everyone calls “the funny one” keeps making jokes until it is who they are.",more:"Merton’s own example was a healthy bank in the 1930s. A rumour said it was failing, so customers rushed to take out their savings, and the rush made it fail."}},
 {h:"Stereotype threat and stereotype promise",x:"Steele and Aronson (1995) found evidence of “stereotype threat”: the fear of performing in a way that would confirm a negative stereotype of one’s group, which decreases performance. Building on this, Shih, Pittinsky and Ambady (1999) found that Asian American women who are strong in math performed better on a math test when experimenters [[cued|reminded them of|reminded them of]] their ethnic identity, but worse when they cued their gender. We found evidence of “stereotype promise”: the promise of being viewed through the lens of a positive stereotype that leads one to perform in a way that confirms it.",
  zh:"Steele和Aronson（1995）发现了“刻板印象威胁”：担心自己的表现会印证群体的负面刻板印象，结果成绩下降。在此基础上，Shih等人（1999）发现，数学好的亚裔女性，在实验者暗示其族裔身份时数学成绩更好，暗示其性别时成绩更差。我们发现了“刻板印象承诺”：被正面刻板印象看待，促使人做出印证它的表现。",
  gs:"Steele showed that a bad label can lower scores. Another study tested Asian American women who were good at math. When reminded that they were Asian (“Asians are good at math”), they scored higher. When reminded that they were women (“women are bad at math”), they scored lower. Same people, different reminder. The authors call the good side {{stereotype promise|promise}}.",
  dp:{q:"The same women scored higher or lower depending on which part of who they are was mentioned. What does this say about “ability”?",a:"A test score is not a pure measure of what’s inside you. It also depends on what you are thinking about in that moment, and that can be changed.",link:["threat","Read the original stereotype threat experiments next to this."]}},
 {h:"Discussion and Conclusions",x:"A glance at second-generation Asians in other countries illustrates the flaws in the cultural values argument. Unlike Chinese immigrants to the United States, Chinese immigrants to Spain are not hyper-selected. Their children exhibit the lowest educational aspirations of all second-generation groups: nearly 40% expect to complete only basic secondary school, roughly the equivalent of tenth grade. Seeing a closed opportunity structure, Chinese immigrants in Spain have turned to [[entrepreneurship|starting businesses|businesses]] as the route to [[upward mobility|moving up in life|moving up]]. These [[counterfactuals|“what if things were different” cases|comparison cases]] illustrate that it is not something essential about Chinese or Asian culture that promotes exceptional educational outcomes.",
  zh:"看看其他国家的第二代亚裔，就能发现“文化价值观”论的漏洞。与赴美的华人移民不同，去西班牙的华人移民没有经过高度筛选。他们的子女在所有第二代群体中教育期望最低：近40%只打算读完初级中学，大约相当于美国十年级。由于看到西班牙的上升通道是封闭的，那里的华人选择创业作为向上流动的途径。这些反事实的例子说明，并不是中国或亚洲文化本身带来了卓越的教育成就。",
  gs:"Look at Chinese families in Spain. Most came with little schooling. Their children expect the least schooling of all immigrant groups there: almost 4 in 10 plan to stop after about grade 10. They believe that in Spain, starting a business is the best way to get ahead. So “Chinese culture” can’t be the reason for top grades. Same culture, different country, different results.",
  dp:{q:"Why is comparing Chinese families in the US and in Spain such a strong test of the “culture” idea?",a:"It keeps the culture the same and changes the situation. If the results change a lot, the situation must matter. It works like Steele’s experiment, but with whole countries."}},
 {x:"Just like inequalities at the low end of the educational spectrum, where some students are assumed to be low-achievers, are tracked into [[remedial|catch-up|catch-up]] classes, and then “prove” their low achievement, inequalities are reproduced at the high end, where students perceived to be high-achievers (regardless of actual performance) are tracked into high-level classes and [[rise to the occasion|step up|step up]], thus “proving” the initial [[presumption|guess|guess]] of their ability. Self-fulfilling prophecies can operate to reproduce inequalities at the high end of the educational distribution, just as they do on the low end.",
  zh:"就像教育低端的不平等一样——有些学生被认定为差生，被分进补救班，然后“证明”自己确实差——高端也在再生产不平等：被认为是优等生的学生（不管实际成绩如何）被分进高水平班，然后迎难而上，“证明”了最初对他们能力的假设。自我实现的预言在教育的高端和低端同样会再生产不平等。",
  xr:"pr1",
  gs:"Labels create unfair gaps at both ends. Some kids are labeled weak, put in easy classes, and then fall behind, which seems to “prove” the label. Other kids are labeled strong, put in hard classes, and rise to meet them, which also seems to “prove” the label. Either way, the label made itself come true.",
  dp:{q:"If labels push some kids up and others down, should schools stop sorting kids into tracks? What might go wrong either way?",a:"Without tracks, fast learners may get bored and teachers juggle more. With tracks, early labels can stick for years. Many schools try a middle way: mixed classes, plus extra challenge open to anyone who wants it.",link:["help","Calarco finds another hidden way some kids get more: they ask for help."]}}
]};
TEXTS.help={id:"help",genre:"Sociology paper",short:"Help",gcol:"--coin",src:"American Sociological Review · 2011 · 21 pages",title:"“I Need Help!” Social Class and Children’s [[Help-Seeking|Asking for Help|Asking for Help]] in Elementary School",by:"Jessica McCrory Calarco",note:"Selected sections in the author’s own words, lightly trimmed. Headings in [brackets] are ours.",paras:[
 {h:"Abstract",x:"What role do children play in education and {{stratification|stratification}}? Are they merely [[passive recipients|people who just receive|just receivers]] of unequal opportunities that schools and parents create for them? Or do they actively shape their own opportunities? Through a [[longitudinal|long-term|long]], {{ethnographic|ethnographic}} study of one [[socioeconomically diverse|mixed richer-and-poorer|mixed]] public elementary school, I show that children’s social-class backgrounds affect when and how they seek help in the classroom.^^Here, middle-class parents mostly have college degrees and office or professional jobs. Working-class parents mostly have hands-on or service jobs and less schooling.^^ Compared to their working-class peers, middle-class children request more help from teachers and do so using different strategies. Rather than wait for assistance, they call out or approach teachers directly, even interrupting to make requests. In doing so, middle-class children receive more help from teachers, spend less time waiting, and are better able to complete assignments.",
  zh:"孩子在教育和社会分层中扮演什么角色？他们只是被动接受学校和父母创造的不平等机会吗？还是会主动塑造自己的机会？通过对一所社会经济背景多元的公立小学的长期民族志研究，我发现孩子的社会阶层背景影响他们在课堂上何时、如何求助。与工人阶级家庭的同学相比，中产阶级孩子向老师求助更多，方式也不同：他们不等待，而是直接喊老师或走过去，甚至打断老师。这样，他们得到更多帮助，等待更少，也更能完成作业。",
  gs:"Do kids just get whatever chances school and parents give them? Or do kids make some of their own chances? Calarco watched one school with richer and poorer families for a long time. Kids from middle-class homes asked teachers for help much more. They didn’t wait. They called out or walked up, even interrupting. So they got more help, waited less and finished more work.",
  dp:{q:"Before reading on: in your class, who gets more help, the kids who need it most or the kids who ask most?",a:"Often the kids who ask most. Teachers can only help with needs they notice, and a loud request is easier to notice than a quiet struggle."}},
 {x:"The great [[irony|strange twist|twist]] in education is that while children are the principal [[beneficiaries|people who benefit|people helped]] of schooling, their role in this process is understudied and poorly understood. I compare middle-class and working-class (white) students’ classroom behaviors and teachers’ responses to them. I focus specifically on students’ help-seeking. The classrooms I studied had no [[explicit|clearly stated|clear]] rules for help-seeking.",
  zh:"教育中最大的讽刺是：孩子是学校教育的主要受益者，他们自己在其中的作用却很少被研究、很少被理解。我比较中产阶级和工人阶级（白人）学生的课堂行为以及老师的回应，重点关注学生的求助行为。我研究的课堂没有关于求助的明确规则。",
  gs:"Here is a funny thing: school is for kids, yet scientists rarely study what kids themselves do there. Calarco compares White kids from middle-class and working-class homes. She looks at one thing: how kids ask teachers for help. In these classrooms, nobody explained the rules for asking.",
  dp:{q:"Why might Calarco compare only White students?",a:"To study social class without mixing in race. If she found differences, they couldn’t be explained by race."}},
 {h:"[What counts as help-seeking]",x:"Help-seeking means children’s requests for assistance, clarification, information, and checking-of-work from teachers. Research indicates that teachers expect students to seek help when needed, and that doing so [[bolsters|boosts|boosts]] learning and achievement. In interviews, teachers described expecting students to be “{{proactive|proactive}} learners,” which meant not only paying attention and working hard but seeking help when they were struggling. During class, however, these expectations were stated only indirectly, if at all.",
  zh:"求助指孩子向老师请求帮助、解释、信息和检查作业。研究表明，老师希望学生需要时主动求助，而这样做能促进学习和成绩。访谈中老师们说，他们希望学生是“主动的学习者”：不仅要专心、努力，遇到困难时还要求助。但在课堂上，这些期望最多只是间接表达，甚至根本不提。",
  gs:"Help-seeking means asking a teacher to help you, explain something, tell you more, or check your work. Asking helps you learn. Teachers said they wanted {{proactive|proactive}} learners: kids who speak up when they are stuck. But teachers almost never said this out loud in class.",
  dp:{q:"If teachers want students to ask, why don’t they just say so clearly?",a:"To adults it feels obvious, so they don’t notice it is a rule. Rules that “everyone knows” are often known only by kids whose families taught them at home."}},
 {x:"On the second day of school, Mr. Fischer explained to his 5th graders: “I expect there are times that 5th graders can work independently and be ‘in the zone.’ But if you need me, I’m up here.” Such [[ambiguous|unclear|unclear]] statements gave students little information about when and how to seek help. After going over directions, teachers generally asked: “Any questions?” In doing so, however, they typically waited only ((two or three seconds|wait)) before moving on. Should students ask for help the moment they “get stuck,” or should they try to work through it first? Should they raise their hands, call out, or go up to the teacher?",
  zh:"开学第二天，Fischer老师对五年级学生说：“我希望五年级学生有时能独立学习，进入‘状态’。但如果你需要我，我就在这儿。”这样含糊的话几乎没告诉学生何时、如何求助。讲完要求后，老师们通常问“有问题吗？”，但一般只等两三秒就继续。学生该一卡住就问，还是先自己想办法？该举手、直接喊，还是走到老师那里？",
  gs:"Mr. Fischer told his class: “If you need me, I’m up here.” But when? And how? Teachers asked “Any questions?” and then waited only ((2 or 3 seconds|wait)). Kids had to guess: ask right away, or try first? Raise a hand, call out, or walk up? Nobody said.",
  dp:{q:"Count to three in your head. Is that enough time to notice you have a question and decide to ask it?",a:"For most people, no. Short waits reward kids who are already confident and ready, and leave out kids who need a moment.",more:"In the 1970s, science educator Mary Budd Rowe found that teachers usually waited about one second after asking a question. When they waited three seconds or more, more students answered, and their answers were longer and more thoughtful."}},
 {h:"[Ethan and Ted]",x:"Ethan and Ted, two middle-class boys, were having trouble finding people for their history cards on the super rich. Ethan calls out loudly: “Mr. Fischer! I can’t find any really rich people!” Mr. Fischer called out, telling them where to look in their books, but they still could not find it. Ethan says [[insistently|without giving up|firmly]]: “But it doesn’t say they’re rich!” Mr. Fischer moves quickly toward Ethan, points at a page and reads aloud: “Joseph Pulitzer and William Randolph Hearst both owned major newspapers in New York.”^^Pulitzer and Hearst owned big newspapers around 1900. Today the Pulitzer Prize for journalism is named after Pulitzer.^^ He explains that if these men owned newspapers, they were probably very, very wealthy.",
  zh:"中产阶级男孩Ethan和Ted在做历史卡片，找不到“超级富豪”。Ethan大声喊：“Fischer老师！我找不到真正有钱的人！”老师远远地告诉他们去书里哪儿找，可他们还是找不到。Ethan坚持说：“可书上没说他们有钱啊！”老师很快走过来，指着书念：“普利策和赫斯特都在纽约拥有大报社。”并解释说，拥有报社的人很可能非常非常有钱。",
  gs:"Ethan and Ted, two middle-class boys, were making cards about very rich people from history. They got stuck. Ethan called out loudly: “Mr. Fischer! I can’t find any really rich people!” The teacher told them where to look. Still stuck, Ethan insisted again. So Mr. Fischer came over and showed them the clue: men who owned big newspapers must have been very rich.",
  dp:{q:"Ethan asked twice. What did he get that a quiet student wouldn’t?",a:"The teacher came over in person, pointed to the exact line, and explained the clue. That is help with the task, plus a lesson in reading between the lines."}},
 {h:"[Anna]",x:"Anna, a middle-class girl, called out: “Ms. Dunham! I need help! Ms. Dunham!” Ms. Dunham nods, noting [[distractedly|while busy with something else|while busy]]: “I’ll be there soon.” Anna, however, does not give up: “I can’t get it to stay so I can do 170 degrees!” At this, Ms. Dunham immediately moved toward Anna, showing her how to hold the protractor. By persisting in these requests, middle-class children generally succeeded in getting help and getting it right away. This [[persistence|not giving up|not giving up]] seemed to show middle-class children’s sense of {{entitlement|entitlement}} to have teachers meet their needs fully and immediately.",
  zh:"中产阶级女孩Anna喊道：“Dunham老师！我需要帮助！Dunham老师！”老师心不在焉地点点头：“我马上来。”Anna没有放弃：“我没法让它固定住，画不出170度！”老师立刻走过去，教她怎么拿量角器。中产阶级孩子坚持请求，通常都能马上得到帮助。这种坚持显示了他们的“权利感”：认为老师应该完全、立刻满足自己的需要。",
  gs:"Anna called out: “Ms. Dunham! I need help!” The teacher said: “I’ll be there soon.” Anna didn’t wait. She said exactly what was wrong with her protractor. The teacher came right away. Middle-class kids kept asking until they got help, right then. Calarco calls this a sense of {{entitlement|entitlement}}: feeling you have a right to the teacher’s help.",
  dp:{q:"Is “entitlement” a good or a bad thing here? When does it help, and when does it annoy people?",a:"In everyday talk it sounds bad: acting like you deserve special treatment. Here it is also useful: believing you have a right to help gets you help. The same habit can look pushy or smart, depending on who has it and where."}},
 {h:"Working-class students",x:"Unlike their middle-class peers, working-class students rarely admitted they were struggling. Sadie and Carter were both bent over their worksheets, frowning. Despite the trouble they were having, they did not admit they were confused or ask for help. During this activity, Ms. Nelson helped three groups of middle-class students who requested her assistance but never helped Sadie or Carter. Fifteen minutes later, they were the only students still working: “You guys! Time’s up. You were the only group that didn’t finish.” Sadie and Carter appear to be upset but do not say anything.",
  zh:"与中产阶级同学不同，工人阶级学生很少承认自己有困难。Sadie和Carter皱着眉趴在练习纸上，虽然遇到了麻烦，却没有承认自己不懂，也没有求助。这段时间里，Nelson老师帮助了三组主动求助的中产阶级学生，却从没帮过Sadie和Carter。15分钟后，只有他们俩还没做完。老师说：“你们俩！时间到了，只有你们组没做完。”两人看起来很难过，但什么也没说。",
  gs:"Kids from working-class homes rarely said they were stuck. Sadie and Carter frowned at their math worksheet. They argued quietly, but they didn’t ask for help. The teacher helped three middle-class groups who asked. She never helped Sadie and Carter. In the end they were the only ones who didn’t finish, and the teacher scolded them. They said nothing.",
  dp:{q:"Whose fault was it that Sadie and Carter didn’t finish?",a:"Not only theirs. The teacher never noticed, and the rules for asking were never explained. Calarco’s point: a gap can grow without anyone meaning to be unfair."}},
 {h:"[Amelia]",x:"Many puff-paint bottles were clogged, and six middle-class children went to Ms. Phillips to ask for help getting paint “un-stuck.” Meanwhile, Amelia, a high-achieving working-class girl, was wrestling with a paint bottle. She gives it a good shake. All of a sudden, about a half-cup of red glittery paint explodes out of the bottle and onto Amelia’s paper. Amelia began to cry silently, putting her head down on her desk. By the time teachers [[intervened|stepped in|stepped in]], working-class students’ problems were often much larger than they would have been had they immediately requested help.",
  zh:"很多立体颜料瓶堵住了，六个中产阶级孩子去找Phillips老师帮忙“弄通”。同时，成绩很好的工人阶级女孩Amelia自己和颜料瓶较劲。她用力一甩，突然大约半杯红色亮片颜料喷到了她的画上。Amelia默默地哭了，把头埋在桌上。等老师介入时，工人阶级学生的问题往往比一开始就求助要大得多。",
  gs:"Paint bottles kept getting stuck. Six middle-class kids went and asked the teacher to open them. Amelia, a working-class girl with good grades, tried to fix hers alone. She shook it hard, and a big splash of red glitter paint exploded onto her work. She cried quietly. By the time the teacher came, a small problem had become a big one.",
  dp:{q:"Amelia was a top student. Why might a strong student still not ask?",a:"Maybe she learned at home to solve problems yourself and not bother adults. That is a real strength in many places, but in this classroom it cost her."}},
 {h:"[Counting the requests]",x:"When I counted students’ interactions, the average middle-class 5th-grader made ((more than seven requests for help|requests)) from teachers, while the average working-class 5th-grader made only one. Middle-class children asked not only for more help but for a wider range of help, regularly requesting assistance, clarification, information, and checking-of-work. I did not witness any requests for information or checking by working-class students during the counting sessions.",
  zh:"我统计了学生的互动：中产阶级五年级学生平均向老师求助七次以上，工人阶级五年级学生平均只有一次。中产阶级孩子不仅求助更多，求助的种类也更广，经常请求帮助、解释、信息和检查作业。在统计期间，我没有看到工人阶级学生请求信息或检查作业。",
  views:"requests",
  gs:"Calarco counted. A middle-class 5th grader asked teachers for help ((more than 7 times|requests)) while she was counting. A working-class 5th grader asked about once. Middle-class kids also asked for more kinds of help, like “Can you check my work?” Working-class kids never asked that while she was counting.",
  dp:{q:"Stories and numbers: why does Calarco use both?",a:"Stories show how it happens and how it feels. Counts show it isn’t just a few memorable kids. Together they are much harder to argue with."}},
 {h:"[Not better, just a better fit]",x:"It is important to recognize that middle-class help-seeking styles were more effective not because they were [[inherently|by nature|naturally]] better, or because teachers were [[biased|unfair|unfair]] against working-class students, but because they [[aligned with|matched|fit]] the conditions that exist in [[contemporary|today’s|today’s]] elementary classrooms. Teachers could more [[explicitly|clearly|clearly]] state their expectations regarding appropriate times and strategies for help-seeking, make themselves more [[accessible|easy to reach|easy to reach]], and actively encourage all students (particularly those from working-class backgrounds) to feel comfortable approaching them.",
  zh:"需要认识到：中产阶级的求助方式更有效，不是因为它本身更好，也不是因为老师歧视工人阶级学生，而是因为它契合当今小学课堂的条件。老师可以更明确地说明何时、如何求助，让自己更容易被找到，并积极鼓励所有学生（尤其是工人阶级家庭的学生）放心地来找自己。",
  xr:"hx1",
  gs:"Calarco is careful here. Middle-class kids didn’t win because their way is better, or because teachers were unfair. Their way simply matched busy classrooms, where the teacher helps whoever asks first. Teachers can fix this: explain when and how to ask, be easy to reach, and invite quiet kids to ask, especially working-class kids.",
  dp:{q:"Design one classroom rule that would make asking for help fair for everyone.",a:"Ideas: a “stuck” card every student can put up; the teacher visits every table once before taking calls; a ten-second wait after “Any questions?”. Each one makes the hidden rule visible.",link:["threat","Steele also says: change the situation, not the child."]}},
 {h:"[What the children said]",x:"In interviews, both middle- and working-class students reported wanting and appreciating teachers’ help. That said, working-class students expressed uncertainty about when and how to seek help and concern about making teachers upset with their requests. Middle-class children expressed little [[hesitance|hesitation|worry]] about help-seeking, expecting teachers to be [[responsive|quick to answer|helpful]]. It is only when students’ help-seeking habits align with classroom conditions that these behaviors become a form of {{cultural capital|capital}}, yielding meaningful profits in the classroom and beyond.",
  zh:"访谈中，中产阶级和工人阶级的学生都说希望得到、也感激老师的帮助。不过，工人阶级学生不确定何时、如何求助，并担心请求会让老师不高兴；中产阶级孩子则很少犹豫，认为老师会回应。只有当学生的求助习惯契合课堂条件时，这些行为才成为一种“文化资本”，在课堂内外带来实际收益。",
  gs:"Calarco also asked the kids. All of them liked getting help. But working-class kids weren’t sure when or how to ask, and they worried the teacher would get upset. Middle-class kids weren’t worried; they expected teachers to help. Knowing how to ask is a kind of {{cultural capital|capital}}: like money, it gets you things, here in school.",
  dp:{q:"Calarco calls help-seeking “cultural capital”. What other know-how works like money at school?",a:"Knowing how to talk to adults, how to email a teacher, what a good essay “sounds like”, how to sign up for clubs. Families pass these on without noticing.",more:"The idea of cultural capital comes from the French sociologist Pierre Bourdieu in the 1970s. He argued that schools reward habits that richer families teach at home, and then treat those habits as natural talent.",link:["promise","Lee & Zhou describe another kind of capital: a good reputation, which they call symbolic capital."]}}
]};

 paper0:"People usually think school goals are fixed. In math, kids learn counting, then adding, then multiplying, then fractions. So education research asks: how do we reach those goals best? What is hard for students? Is teaching method A better than method B?",
 paper1:"This paper asks a different question. Not “how should we teach?” but “what should we learn, and in what form?” The shape of an idea can make it easier or harder to learn. The authors show three ways computers can reshape science ideas, called {{restructurations|restructuration}}.",
 paper2:"Look at history. People switched from Roman numerals (like XIV) to the numbers 0–9 we use today. Nobody did it to help students. But it made math much easier to learn. The authors want to make changes like this on purpose, to help learning.",
 paper3:"Imagine a country, FOO, that still uses Roman numerals. Its learning experts work hard to help people do math. Some study kids’ {{misconceptions|misconception}}, like thinking CIX is ten more than CI. Some build practice software or wooden blocks. Some even guess that humans just can’t do multiplication.",

 siegler0:"To learn how children’s thinking changes, we need to watch changes closely. The {{microgenetic|microgenetic}} method does this in three ways: watch the same children the whole time they are changing, watch them very often, and study every single try. It takes a lot of time, but it shows things no other method can.",
 siegler1:"Growing up is all about change. But it is very hard to see how change happens. Because of that, scientists have not learned much about it.",

TEXTS["idp"]={id:"idp",genre:"Psychology review paper",short:"Identity",gcol:"--legend",src:"Child Development · 1990 · 21 pages",title:"[[Identity|Who-I-Am|Who You Are|identity]] Processes among Racial and [[Ethnic Minority|Smaller Culture-Group|Minority|minority]] Children in America",by:"Margaret Beale Spencer and Carol Markstrom-Adams",note:"Selected sections in the authors’ own words, lightly trimmed (citations removed). Headings in [brackets] are ours.",paras:[
 {h:"[Why identity matters]",x:"In this article we present a [[synthesis|summary that puts things together|summary]] and overview of the [[literature|research that has been written|research]] on identity development during childhood and adolescence for ethnic and racial minority groups in the United States. The [[establishment of identity|building a sense of self|knowing who you are|identity]] is a major developmental task for all adolescents. As a psychosocial task, striving for a sense of unification and [[cohesiveness|holding together|being whole]] in the self provides meaning, direction, and purpose.",gs:"This paper sums up what research says about how minority kids in the U.S. build their sense of who they are. Every teen has a big job: figuring out who they are. Feeling like one whole person gives you meaning, direction and a reason to keep going."},
 {x:"While identity development is a complex task for all youths, it is particularly complicated for children and adolescents belonging to [[ethnic and racial minority groups|smaller culture and race groups|minority groups|minority]] in the United States. Specifically, the complexity of identity formation may increase [[as a function of|because of|because of]] color, behavioral distinctions, language differences, physical features, and long-standing, although frequently [[unaddressed|not talked about|ignored]], social stereotypes. For example, the issue of color may be more [[salient|noticeable and important|important]] for African Americans and American Indians than it is for other minority groups.",gs:"Building an identity is hard for everyone. It is even harder for {{minority|minority}} kids. Why? Skin color, different ways of acting, a different language, looks, and old stereotypes nobody talks about. For example, skin color may matter more for Black and Native American kids."},
 {x:"As a term, [[ethnicity|shared culture|culture group|ethnicity]] refers to a characteristic of shared unique cultural traditions and a [[heritage|history handed down|traditions|heritage]] that persists across generations. It is not identical to race. Race and ethnicity may overlap, as seen with African Americans and Chinese Americans. In addition, Hispanics are [[distinguished|set apart|marked]] by their shared language (Spanish) although they may differ by race. Ethnic group membership [[accords|gives|gives]] the individual a cultural identity, a sense of belonging and group pride, and a set of [[prescribed norms|expected rules|rules]], values, and social behaviors.",gs:"{{Ethnicity|ethnicity}} means sharing a culture and traditions that are passed down for generations. It is not the same as race, but the two can overlap. For example, Hispanic people share Spanish, but they can be of different races. Being part of an ethnic group gives you a culture, a place to belong, pride, and rules for how to act."},
 {h:"Identity formation in childhood",x:"A commonly used [[procedure|method|method]] in studying ethnic and racial identification, preference, and attitudes is to present a child with dolls and pictures that are [[representative of|showing|showing]] his or her own group and of the majority group. Using this procedure, questions were posed to subjects related to their preferences toward and identification with the different dolls. Taken together, these studies show that preschool and young school-age children demonstrate a [[white bias|leaning toward white|white-leaning]]. These findings are disturbing; however, certain [[qualifiers|conditions to keep in mind|“buts”]] are required.",gs:"A common test: show a child dolls or pictures of their own group and of the main group. Then ask: which doll do you like? Which one looks like you? Most young children picked the white dolls more. That is upsetting, but there is more to the story."},
 {x:"Black children’s tendency to [[misidentify|pick the wrong group|pick wrong]] has been viewed as supporting assumptions of personal disorganization. However, [[empirical findings|results from real studies|study results]] for both attitude/preference and self-concept suggest the presence of positive self-esteem and pro-white attitudes/preferences. We believe that African American children’s pro-white racial attitude and preference patterns appear to represent [[cultural-ecological variables|things from society around them|outside messages]] (i.e., negative social stereotypes about blacks) and not psychological characteristics.",gs:"People thought it meant Black kids felt bad or mixed up about themselves. But studies found the same kids liked themselves just fine, while still picking white. The authors think the kids were showing what society taught them, its stereotypes, not something wrong inside them."},
 {x:"Beuf reports that around age 10, American Indian children begin to show a greater preference toward and identification with their own group. A [[parallel|similar|same kind of]] pattern of own-group preference has been described for older (ages 10 and 12) African American children. Such advances in [[cognitive skills|thinking skills|thinking]] are perhaps reflected in a more realistic [[assessment|judgment|view]] of oneself and one’s group.",gs:"Around age 10, Native American kids started to choose their own group more. Black kids aged 10 to 12 showed the same change. As kids think in more grown-up ways, they see themselves and their group more truly."},
 {h:"Identity formation in adolescence",x:"Identity formation has been regarded by Erikson as the fifth stage in [[psychosocial|mind and social|growing-up]] development. Marcia provides a model useful in such research. He [[conceives of|thinks of|sees]] identity as four “statuses” (achievement, moratorium, foreclosure, and diffusion). Identity achievement is characterized by exploration of and [[commitment|choosing and sticking with it|choosing]] to an identity; moratorium status exists when the individual, having explored an identity, remains uncommitted to one; foreclosed status refers to [[prematurely|too early|too early|foreclosure]] closed off exploration; and diffused status is an inability to reconsolidate the ego.",gs:"The psychologist Erikson said building an identity is the 5th big stage of growing up. Another scientist, Marcia, named four ways teens can be on the path to finding who they are. Achievement: you explored, then chose. Moratorium: you’re still exploring. Foreclosure: you chose without exploring. Diffusion: you’re stuck and haven’t chosen."},
 {x:"It has been reported in these studies that minority adolescents tend to score higher in foreclosure than white adolescents. Exploration is a key [[ingredient|part|part]] for identity-formation processes. Minority youth are faced with an assumed consciousness of [[prejudicial attitudes|unfair opinions|prejudice]] and [[discriminatory practices|unfair treatment|unfair treatment]] of the majority group. The overall effect may be one of discouragement from involvement with those outside of one’s own reference group and/or a subsequent [[diminished|lower|lower]] level of exploration.",gs:"Studies found that minority teens “close the door” early more often than white teens. Exploring is a key part of finding who you are. But minority teens know that some people are prejudiced against them. So they may stay away from outside groups and explore less."},
 {x:"An [[alternative explanation|different reason|other reason]] to the above results is that some minority groups, by certain preferences in life-style, migration, or [[acculturation|taking on a new culture|fitting in]] rates, may foster greater foreclosure. Further, foreclosure may be an [[adaptive|helpful for survival|helpful]] identity status for these youths (in the short run). For example, American Indian adolescents [[reared|raised|raised]] on reservations, where the [[adherence to cultural norms|following the culture’s rules|keeping traditions]] is encouraged and exploration discouraged, might, quite adaptively, hold a foreclosed identity. The point is that exploration of identity may not be desirable for such youth when social and ideological roles are clearly defined by the community.",gs:"Another reason: some groups simply expect their kids to follow the group’s way of life. And “closing the door” early may actually help these teens, at least for now. For example, Native teens on reservations, where keeping traditions is valued, may do well by sticking with them. So exploring isn’t always the best thing, when the community already gives clear roles."},
 {x:"Phinney and Tarver examined the processes of search and commitment in ethnic identity among 24 black and 24 white, middle-class eighth graders. While no significant differences were found between the two groups, there was evidence that ethnic identity begins to form as early as the eighth grade. However, a [[qualitative analysis|close reading|close look]] of the [[transcribed|written down|written-out]] interviews revealed that blacks had a better understanding of prejudice and had greater understanding of their own culture than did whites. The researchers argue that the experience of prejudice might [[foster|encourage|grow]] the need for greater understanding of one’s culture.",gs:"Two researchers interviewed 48 Black and white 8th graders about their ethnic identity. Both groups were similar, and ethnic identity was already forming by 8th grade. But Black students understood prejudice and their own culture better. Maybe facing prejudice makes you want to understand your culture more."},
 {h:"[Barriers to identity]",x:"Ramirez and Castaneda identify the [[melting-pot philosophy|idea that everyone should blend into one culture|blend-in idea|meltpot]] as a major barrier against minority group members adopting an adaptive ethnic identity. The historical argument of this philosophy was that by the [[conglomeration|mixing together|mixing]] of all races in the United States, a new, [[superior|better|better]] race would be formed. The melting pot has not come to be, yet the approach taken by many educators toward minority children is that such a reality exists. Thus, Ramirez and Castaneda argue that for Mexican American children, the values presented at school are [[in direct conflict|clashing|clashing]] with those presented at home. Ramirez and Castaneda state that, ideally, children should be allowed to develop a [[bicultural|belonging to two cultures|two-culture]] identity that consists of a dual identification.",gs:"Some researchers say the {{melting-pot|meltpot}} idea gets in the way of a healthy ethnic identity. The idea was that all groups would mix into one new, “better” people. That never happened, but many teachers act as if it did. So Mexican American kids hear one set of values at school and another at home. It would be better to let kids belong to both cultures at once."},
 {x:"Another barrier to identity formation may come from within the family. Too often minority status parents may not discuss ethnic or racial issues with their children since the adults themselves remain uncomfortable with these issues having to do with either race or ethnicity. Research studies suggest a general [[reluctance|not wanting to|not wanting to]] by African American parents to [[broach|bring up|bring up]] the issue of race unless the subject is raised first by their children since many parents assume that the 1960s took care of the significant issues. It is argued that this reluctance may reflect a [[defensive strategy|way of protecting yourself|self-protection]] on the part of the parents that leaves their children exposed to the continuing problem of racial [[intolerance|not accepting others|unfairness]], albeit expressed in [[subtle|quiet and hard to notice|quiet]] forms.",gs:"Another problem can come from home. Some parents don’t talk about race with their kids, because it makes the parents uncomfortable too. Many Black parents wait for their kids to bring it up, thinking the 1960s fixed the big problems. But staying quiet can leave kids unready for racism that still happens in quieter ways."},
 {x:"Several factors thus complicate the task of identity formation among minority youth. The value conflicts that exist between cultures, the lack of identity-achieved adult [[role models|grown-ups to look up to|heroes]], and the lack of culture-focused specific guidance from the family represent ongoing issues. The [[preponderance|very large number|huge amount]] of negative stereotypes about minorities in general is also [[counterproductive|working against the goal|harmful]] to acquiring a solid sense of self. One difficulty is that most [[instruments|tests and surveys|tests]] are administered in English, which is a major problem for minorities for whom English is a second language.",gs:"So many things make building an identity harder for minority kids. Clashing values, too few grown-ups to look up to, and too little talk about culture at home. And so many negative stereotypes make a strong sense of self harder to build. Even the research has problems: most tests are in English, which is hard for kids who speak another language first."}]};
