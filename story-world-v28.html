Object.assign(BG,{
  storm:{h:"Snapshots vs a movie",p:"Two photos, before and after a tornado, show how bad the damage is. But only many frames taken during the storm show how it happened. The authors say most studies of children are like the two photos.",q:"tornado time lapse"},
  conserve:{h:"The water-pouring test",p:"Pour the same water from a short wide glass into a tall thin one. Young children often say the tall glass has more. Older children know pouring does not change the amount. Psychologists call this “conservation”.",q:"piaget conservation of liquid experiment"},
  minstrat:{h:"The min strategy",p:"To add 2 + 5, start at the bigger number (5) and count up the smaller number: “6, 7”. It is called “min” because you only count the minimum, the smaller number.",q:"counting on strategy addition for kids"},
  eureka:{h:"“Eureka!”",p:"A story says the Greek thinker Archimedes saw the water rise in his bath and suddenly knew how to test the king’s crown. He ran out shouting “Eureka!” (“I found it!”). It is our favourite picture of discovery, but most children in this study did not discover things that way.",q:"archimedes eureka story for kids"},
  dog:{h:"The dog that did nothing",p:"In a Sherlock Holmes story a horse is stolen at night, but the guard dog never barks. Holmes says that is the clue: the dog must have known the thief. Sometimes the important thing is what did NOT happen. Here: no child ever tried a wrong way of adding.",q:"sherlock holmes silver blaze dog in the night time"},
  counts:{h:"Three ways to count 4 + 2",p:"Sum: count 1 to 4, count 1 to 2, then count all of them, 1 to 6. Short-cut sum: count 1 to 4, then keep going, 5, 6. Min: start at 4 and say 5, 6. The short-cut is halfway between, and it showed up just before every child found the min strategy.",q:"counting all vs counting on addition"},
  fig1:{h:"What the hard problems did",p:"Before the challenge problems (like 22 + 3), the five children who already knew the min strategy used it on fewer than 20% of counting trials. Right after them: 60%. By the end: about 90%. Being pushed did not create the new idea, but it made kids use it much more.",q:"Siegler min strategy discovery children"},
  plates:{h:"Wegener and the moving continents",p:"On a world map, the coasts of South America and Africa fit like puzzle pieces. Alfred Wegener said the continents were once joined and slowly drifted apart. He talked about the fit in 1903, but dated his theory to 1910. A big idea can sit in your head for years.",q:"Wegener continental drift for kids"}
});
TEXTS.siegler={id:"siegler",genre:"Psychology paper",short:"Psych paper",gcol:"--l2",src:"American Psychologist · June 1991 · 15 pages",title:"The [[*Microgenetic* Method|Step-by-Step Watching Method|Watching Change Up Close|microgenetic]]: A [[Direct Means|Direct Way|Direct Way]] for Studying [[Cognitive Development|How Thinking Grows|How Thinking Grows]]",by:"Robert S. Siegler & Kevin Crowley",note:"Selected sections in the authors’ own words, lightly trimmed. Headings in [brackets] are ours.",paras:[
 {h:"Abstract",x:"[[Progress|Moving forward|Moving forward]] in understanding [[cognitive developmental change mechanisms|the hidden steps by which children’s thinking changes|how thinking changes||“Mechanisms” means the hidden machine behind the change. “How thinking changes” drops the machine and keeps only the result.]] requires methods that [[yield|give|give]] detailed data about particular changes. The {{microgenetic|microgenetic}} method is an approach that can yield such data. It involves <<e:(a) observations of individual children throughout the period of the change, (b) a high [[density|number|number]] of observations relative to the [[rate of change|speed of the change|speed]] within that period, and (c) intensive trial-by-trial analyses intended to [[infer|figure out|figure out]] the processes that gave rise to the change=>three things>>. This approach can [[illuminate|shed light on|show]] both [[qualitative and quantitative|what-kind and how-much|kind and amount]] aspects of change<<c:, indicate the conditions under which changes occur,>> and yield <<x:otherwise unobtainable >>information about [[short-lived|brief|short]] transition strategies. <<x:The cost in time and effort of such studies is often high, but the value of the information about change can more than justify the cost.>>",zh:"要理解认知发展的变化机制，需要能提供具体变化细节的方法。微观发生法就是这样的方法：(a) 在整个变化期间观察同一批孩子；(b) 相对于变化速度，观察要非常密集；(c) 逐次分析每一次尝试，推断变化背后的过程。它能揭示变化的“质”和“量”，以及短暂的过渡策略。代价很高，但值得。",views:"sstart"},
 {x:"The [[essence|core|heart]] of development is change. However, [[determining|figuring out|knowing]] how change occurs is very difficult. <<d:Historically,=>So far,>> this difficulty has limited both [[theoretical and empirical|idea-building and evidence-gathering|idea and data]] progress in understanding [[cognitive development|how thinking grows|how thinking grows]]. <<w:As Flavell (1984) commented, “Serious theorizing about basic mechanisms of cognitive growth has actually never been a popular pastime, now or in the past.”>>^^John Flavell is a famous child psychologist. A “pastime” is a hobby: he is joking that almost nobody wanted to work on this hard question.^^",zh:"发展的本质是变化，但弄清变化如何发生非常困难。这限制了认知发展研究在理论和实证上的进展。心理学家Flavell说：认真研究认知成长的基本机制，从来都不是热门消遣。"},
 {omitBefore:"one paragraph on recent books about change",x:"One reason why progress in understanding these {{mechanisms|mechanism}} has been so long in coming has been the difficulty of [[devising|inventing|making]] effective methods for studying the topic. <<w:As Appelbaum and McCall (1983) noted, “In contrast to other specialties, the study of development is the study of change. . . . But developmental psychology has often not been truly developmental.”>> The main purposes of this article are to describe a method that seems particularly well suited to studying change, to review the progress that has been made using it, and to [[advocate|argue for|push for]] its increased use.",zh:"进展缓慢的一个原因是：很难设计出研究“变化”的有效方法。本文的目的：介绍一种特别适合研究变化的方法，回顾用它取得的进展，并呼吁更多人使用它。"},
 {h:"The Microgenetic Method",x:"Three key properties define the microgenetic approach: <<e:(a) Observations [[span|cover|cover]] the entire period from the beginning of the change to the time at which it reaches a [[relatively stable state|fairly steady point|steady point]]. (b) The density of observations is high relative to the rate of change of the [[phenomenon|thing being studied|thing]]. (c) Observed behavior is subjected to intensive trial-by-trial analysis, with the goal of inferring the processes that give rise to both qualitative and quantitative aspects of change.=>watch the whole change, watch it often, and study every try.>>",zh:"微观发生法有三个关键特征：(a) 观察覆盖从变化开始到相对稳定的整个时期；(b) 观察密度远高于变化速度；(c) 对每一次尝试做细致分析，推断产生变化的过程。",xr:"sx1"},
 {h:"Rationale",x:"Most [[developmental methods|ways of studying growth|studies of growth]] only [[indirectly assess|measure from the side|guess at]] change. They are more like [[snapshots than movies|photos than videos|photos, not videos||A snapshot freezes one moment; a movie shows everything in between. The easy words keep the idea but lose the quick, sharp pair.]]. <<x:This criticism has often been leveled at cross-sectional designs, but it applies equally to most longitudinal approaches.>>^^Cross-sectional: test different kids at different ages, once. Longitudinal: test the same kids again and again over the years.^^ <<e:Observing a given child at ages 6, 8, 10, and 12 tells us more about stability of individual differences than does observing different children of each age at a single point in time. However, ordinarily it tells us no more about the process that produced the changes.>>",zh:"大多数发展研究方法只是间接地评估变化，更像快照而不是电影。这对横断研究和大多数纵向研究都一样。在6、8、10、12岁观察同一个孩子，能告诉我们个体差异是否稳定，却不能告诉我们变化是怎么发生的。",views:"storm"},
 {x:"The crucial variable is not whether the design is longitudinal, but rather is [[the density of observations during the period of change relative to the rate of change of the phenomenon|how often you look while the change is happening, compared with how fast it happens|how often you look during the change]]. This can be illustrated by thinking of depictions of ((tornadoes or hurricanes descending on a town|storm)). <<e:Photographs of an area before and after a [[cataclysm|disaster|disaster]] allow appreciation of the extent of damage and often elicit a “wow” reaction.>> To [[comprehend|understand|understand]] the process that [[wreaked the damage|caused the damage|did the damage]], however, requires observation of the effects at much more frequent intervals. <<e:A movie is ideal, but even a sequence of still photos, taken before, after, and at frequent intervals during the storm, yields a much finer understanding of the change than do before-and-after shots.>>",zh:"关键不是纵向还是横断，而是：在变化期间，观察的密度相对于变化速度有多高。想想龙卷风袭击小镇：前后两张照片能让人惊叹破坏之大，但要理解破坏如何发生，需要更频繁的观察。电影最好，哪怕在风暴中多拍几张照片，也比前后对比强得多。",xr:"sx2"},
 {x:"The situation is the same in trying to understand the less [[cataclysmic|dramatic|dramatic]] process of cognitive change. Suppose we wanted to study development of understanding of ((liquid quantity conservation|conserve)). <<n:Suppose further that individual children took roughly one month to progress from thinking that the taller liquid column must contain more water, to being unsure, to realizing that simply pouring the water does not change its quantity.=>Suppose each child changes in about a month.>> <<e:Examining understanding of liquid quantity conservation at ages five, six, seven, and eight would indicate how many children understood the concept at each age.>> However,<<x: regardless of whether the design was cross-sectional or longitudinal,>> such a study would reveal little about how the change occurred. The density of observations during the period of change would simply be too low<<x: relative to the rate of conservation acquisition>>.",zh:"认知变化也一样。假设每个孩子大约用一个月，从“高的杯子水更多”到不确定，再到明白倒水不改变水量。如果只在5、6、7、8岁各测一次，只能知道每个年龄有多少孩子懂了，却几乎看不到变化如何发生：观察太稀疏了。"},
 {h:"[Why so few studies?]",omitBefore:"the rest of the Rationale and the History section (Werner, Vygotsky)",x:"With all of these [[testimonials|good reports|good reports]] and positive examples, one might expect microgenetic experiments to be extremely [[prevalent|common|common]]. In fact, they are not. <<n:There seem to be between 10 and 20 such studies on cognitive development.>> The reason for the [[relative paucity|small number|lack]] of such experiments is not hard to see: They are difficult and time consuming to conduct. <<c:Subjects generally must be tested individually to obtain the type of detailed data that is essential for trial-by-trial analyses of performance. Determining when changes occur for each subject requires [[poring over|studying closely|watching closely]] the videotaped record of performance, transcribing large numbers of verbal statements, and classifying each trial with regard to the approach the subject used.>>",zh:"有这么多赞誉，你会以为这类研究很普遍，其实不然，认知发展领域只有10到20项。原因很简单：太难、太费时。要一个个单独测试，反复看录像、转录大量口头陈述，还要给每一次尝试分类。"},
 {h:"A Microgenetic Study of Strategy Discovery",omitBefore:"two paragraphs on why these studies are hard and why they are growing",x:"The ((min strategy|minstrat)) is an approach to adding that involves counting up from the larger {{addend|addend}} the number of times indicated by the smaller addend. <<e:For example, a child using the min strategy to solve 2 + 5 would start at 5 and count upward 2 counts (the child would think “5, 6, 7”).>> <<n:Some kindergartners and most first, second, and third graders know and use this strategy.>>",zh:"“min策略”是一种加法方法：从较大的加数开始，往上数较小加数那么多次。比如2+5，从5开始数两下：“5、6、7”。一些幼儿园孩子和大多数一到三年级学生会用这个策略。",views:"minstrat"},
 {omitBefore:"the earlier timing studies of how children add",x:"Siegler (1987) presented kindergartners, first graders, and second graders simple addition problems and collected both solution times and [[verbal reports of strategy use|what children said about how they solved it|what kids said they did]] immediately following each problem. Children reported using not only the min strategy but also the [[sum strategy|count-everything way|count-all way]]<<e: (representing the first addend, representing the second addend, and then counting from one to the sum of the addends)>>, decomposition<<e: (e.g., 9 + 4 = 10 + 4 − 1)>>, retrieving answers from memory, and guessing. <<n:The [[diversity|variety|variety]] of strategy use characterized individual children as well as the group; most children reported using at least three strategies. Overall, children reported using the min strategy on only 36% of trials.=>Most children used several strategies.>>",zh:"Siegler（1987）让幼儿园、一年级和二年级孩子做简单加法，记录解题时间，并在每题后马上问他们怎么算的。孩子们除了min策略，还用“全部数”（sum策略）、拆分（9+4=10+4−1）、从记忆中提取和猜。多数孩子至少用三种策略，min策略只占36%。"},
 {h:"The Microgenetic Experiment",x:"The Siegler and Jenkins (1989) experiment included two main parts: a pretest and an 11-week practice period. <<c:The pretest was used to select four- and five-year-olds who did not already know the min strategy but who possessed some skill in adding numbers.>> <<n:This selection procedure resulted in 10 children being selected for participation in the practice period.>> <<n:The 11-week practice period involved approximately three sessions per week for each child. In general, seven problems were presented in each session.>> <<c:Strategy assessment involved a combination of videotaping and asking the child immediately after each trial how he or she had solved the problem.>>",zh:"Siegler和Jenkins（1989）的实验分两部分：前测和11周练习期。前测挑出还不会min策略、但会一点加法的4到5岁孩子，共10人。练习期每周约三次，每次一般七道题。判断策略的方法：录像，加上每题后马上问孩子怎么算的。"},
 {omitBefore:"a paragraph on children who dropped out and flu season",x:"The original plan was to present repeatedly the problems with addends 1–5 until all of the children discovered the min strategy. <<n:After seven weeks of the practice period, five of the eight children had made the discovery. However, they tended to use it only occasionally.>> This led to [[adoption|use|use]] of a [[necessity-is-the-mother-of-invention perspective|“when you need it, you invent it” idea|“need it, invent it” idea||The proverb “Necessity is the mother of invention” means: real need makes people invent. The plain words keep the idea but lose the famous saying that makes it stick.]]. To create a need to use the min strategy, the experimenter presented [[challenge problems|hard problems|hard sums]] during Week 8. <<e:These were problems such as 2 + 21, that is, problems with one large and one small addend.>> <<c:These challenge problems provided both [[a carrot and a stick|a reward and a push|a reward and a push||A carrot pulls a donkey forward; a stick pushes it from behind. The idiom means two forces at once, one nice and one not. The plain words lose the donkey picture.]] for using the min strategy: the carrot because such problems could be solved quite easily by counting from the larger addend, the stick because the children’s other strategies, such as the sum strategy and retrieval, could not be easily executed on them.>>",zh:"原计划是反复出加数为1到5的题，直到所有孩子都发现min策略。七周后，八个孩子中有五个发现了，但很少用。于是研究者采用“需要是发明之母”的思路：第8周出“挑战题”，比如2+21，一个加数大、一个小。这些题既有“胡萝卜”（从大数往上数很容易）又有“大棒”（其他策略很难用）。"},
 {h:"Overview of Findings",omitBefore:"a paragraph on speed and accuracy",x:"Children used a number of strategies to solve problems. <<n:Across all children, the sum strategy and retrieval were the approaches used most often, with the two strategies being employed on 34% and 22% of trials, respectively.>> More striking, however, was the {{variability|variability}} in children’s strategy use. <<n:As shown in Table 2, each child used at least five strategies.>> <<n:Use of the sum strategy ranged from 0% to 69%, use of retrieval from 1% to 61%, use of finger recognition from 0% to 25%, and so on.>> <<x:The child who used retrieval on the greatest percentage of trials ranked seventh among the eight children in percentage correct.>>^^Look at the picture on the word card for “variability”: each bar is one child. No two bars look alike.^^",zh:"孩子们用了很多策略，最常用的是sum策略（34%）和记忆提取（22%）。但更惊人的是策略使用的多变性：每个孩子至少用五种策略；sum策略的使用从0%到69%，提取从1%到61%。最常用记忆提取的孩子，正确率在八人中排第七。"},
 {h:"Discovering a New Strategy",x:"<<n:Over the 11 weeks, seven of the eight children made the discovery.=>Most of the children made the discovery.>> The time that they required varied greatly. <<n:The first discovery occurred in the 2nd session of the experiment, on the particular child’s 8th trial. The last discovery occurred in the 30th session, on the 209th of the 210 trials that that child encountered.>> <<w:The following [[protocol|word-for-word record|record]] was taken from the trial on which one five-year-old girl first used the min strategy.=>Here is what one girl said.>>",zh:"11周里，八个孩子中有七个发现了新策略，所需时间差别很大：最早的在第2次课第8题，最晚的在第30次课、210道题中的第209题。下面是一个五岁女孩第一次用min策略时的对话记录。"},
 {kicker:"E = the experimenter · B = Brittany, age 5",dlg:true,x:"E: OK Brittany, how much is 2 + 5?\nB: 2 + 5—[whispers] 6, 7—it’s 7.\nE: How did you know that?\nB: [excitedly] Never counted.\nE: You didn’t count?\nB: Just said it—I just said after 6 something—7—6, 7.\nE: You did? Why did you say 6, 7?\nB: Cause I wanted to see what it really was.\nE: OK, well—so, did you—what—you didn’t have to start at one, you didn’t count 1, 2, 3, you just said 6, 7?\nB: Yeah—smart answer.",zh:"研究者：2+5是多少？ 布列塔妮：（小声）6、7，是7。 研究者：你怎么知道的？ 布列塔妮：（兴奋地）没数！就是说了6之后，7。 研究者：你不用从1开始数？ 布列塔妮：对，聪明的答案！"},
 {x:"This protocol fits well with the common [[prototype|picture|picture]] of discovery, which is probably ((Archimedes shouting “eureka”|eureka))<<e: following his insight in the bathtub concerning how to test whether the king’s crown was pure gold>>. This prototype [[entails|includes|has]] awareness of what has been done, realization that it is important, and excitement at making the discovery. Other children’s discoveries showed none of these properties, however. Consider Whitney’s protocol:",zh:"这段对话很符合人们对“发现”的典型想象：阿基米德在浴缸里想到如何检验王冠是否纯金，大喊“尤里卡！”这种想象包括：知道自己做了什么、意识到它重要、为发现而兴奋。但其他孩子的发现完全没有这些特征。看看惠特尼的记录："},
 {kicker:"E = the experimenter · W = Whitney, age 5",dlg:true,x:"E: How much is 4 + 3?\nW: 5, 6, 7, I think it’s 7.\nE: 7, OK, how did you know that?\nW: Because I’m smart and I just knew it.\nE: Can you tell me, I heard you counting. I heard you. Tell me how you counted.\nW: I just—I didn’t count anything—[long pause] I just added numbers onto it.\nE: Can you tell me how you added numbers?\nW: No.\nE: Come on Whitney—come on, we have to do this, OK?\nW: OK [in a bored voice], 3, add one makes 4, add one makes 5, add one makes 6, add one makes 7, add one more makes 8.\nE: Wait, but how did you know what 4 + 3 was?\nW: Cause I did what I just showed you. I just used my mouth to figure it out.",zh:"研究者：4+3是多少？ 惠特尼：5、6、7，我觉得是7。 研究者：你怎么知道的？ 惠特尼：因为我聪明，我就是知道。 研究者：我听到你在数。 惠特尼：我没数……我就是往上加。 （无聊地）3，加一是4，加一是5……再加一是8。 研究者：那你怎么知道4+3的？ 惠特尼：就像我刚才那样，用嘴算出来的。"},
 {x:"Unlike Brittany, Whitney showed little [[awareness|understanding|understanding]] of what she had done<<e: (she first said that she just knew it, and the counting that she reported in the protocol was not the counting that was recorded on the videotape)>>. She also displayed little [[affect|feeling|feeling]] during or immediately after her first use of the new strategy.^^Look back: Whitney really said “5, 6, 7”. That is the min strategy. But when she “shows” how, she counts 3, 4, 5, 6, 7, 8 and gets 8! What she says she did and what she did are different.^^ <<e:The most insightful first uses of the new strategy showed surprising understanding of why the new strategy was desirable. For example, Ruth explained why she had counted from 4 on 4 + 3 by saying that “I don’t have to count a very long ways if I start from 4, I just have to do 3 more.”>> Thus, strategy discoveries clearly [[entail|involve|have]] a wide range of degrees of awareness, insight into implications, and [[affective reactions|feelings|feelings]].",zh:"和布列塔妮不同，惠特尼几乎不知道自己做了什么：她先说“就是知道”，后来演示的数法也和录像里不一样。她第一次用新策略时也没什么情绪。最有洞察力的孩子，比如露丝，能解释：“从4开始就不用数那么远，只要再数3个。”可见，发现新策略时，孩子的觉察、理解和情绪差别很大。",xr:"sx3"},
 {h:"The Role of Impasses in Discoveries",x:"What types of problems give rise to discoveries? One common view is that discoveries generally occur on difficult problems that cannot be solved in other ways. This view is often labeled [[*impasse* driven learning|learning that starts when you get stuck|learning from being stuck|impasse]]. Discoveries of the min strategy [[were inconsistent with|did not fit|did not fit]] this view, however. <<e:The problems on which discoveries were made were quite representative of the total set of problems that children encountered: 2 + 5, 5 + 2, 4 + 1, 3 + 9, 1 + 24, and 4 + 3 (twice).>> Apparently, discoveries can occur in the course of solving easy problems, difficult problems, or problems of [[middling|medium|medium]] difficulty. <<x:Further, most of the discoveries came on problems that, earlier in the experiment, the particular child had solved correctly without any apparent difficulty.>>",zh:"什么样的题会引发发现？一种常见观点是：发现通常发生在用别的方法解不了的难题上，叫“僵局驱动的学习”。但min策略的发现不符合这种观点：发现时的题目很普通，有简单的、难的、中等的。而且大多数发现出现在孩子以前轻松做对过的题上。"},
 {h:"Discoveries That Were Not Made",omitBefore:"two paragraphs on other changes that happen without failure, and why change may be the normal state",x:"The situation was reminiscent of the classic conversation in ((The Memoirs of Sherlock Holmes|dog)): Holmes: “But there was the curious incident of the dog in the nighttime.” Watson: “The dog did nothing in the nighttime.” Holmes: “That was the curious incident.” In Siegler and Jenkins (1989), the curious incident was that not one child ever used a strategy that [[violated the principles underlying addition|broke the rules of adding|broke adding rules]]. <<e:For example, children might have tried counting the first addend twice, or counting on from the second addend the number of times indicated by the larger addend, regardless of whether it was first or second.>> In fact, not one child used these or other [[illegitimate|not-allowed|wrong]] strategies on even one trial. This raised the question, Why not?^^The authors’ answer: children carry a “goal sketch”, a plan in their head of what any good adding method must do (like “show both numbers”). Wrong methods never even get tried.^^",zh:"这让人想起福尔摩斯的经典对话：“夜里那只狗的奇怪事件。”“那只狗夜里什么也没做。”“这就是奇怪之处。”在这个研究里，奇怪的是：没有一个孩子用过违反加法原理的策略，比如把第一个加数数两遍。一次也没有。为什么？"},
 {h:"Transition Strategies",omitBefore:"goal sketches, the role of fingers, and the count-from-first idea",x:"The microgenetic data suggested that a different strategy, the [[short-cut sum strategy|shortcut count-all way|shortcut way]], may be critical to the {{transition|transition}}. <<c:It is like the sum strategy in that it involves starting at one and counting all of the numbers between one and the sum of the addends. It is like the min strategy in that representation of the second addend and its addition to the running total take place [[simultaneously|at the same time|together]].>> <<e:Thus, on 4 + 2, a child using the short-cut sum strategy would count “1, 2, 3, 4—5, 6” rather than “1, 2, 3, 4—1, 2—1, 2, 3, 4, 5, 6,” as the sum strategy would dictate, or “4, 5, 6,” as the min strategy would dictate.>> <<n:Use of the short-cut sum strategy emerged prior to use of the min strategy in all seven children who discovered the min strategy during the experiment.>> <<x:Interestingly, because the short-cut sum strategy, like the traditional sum approach, produces solution times proportional to the sum of the addends, there is no obvious way that [[chronometric|timing|timing]] or accuracy data could ever have led to its identification.>>",zh:"微观数据显示，另一个策略“简便sum策略”可能是过渡的关键。它像sum策略一样从1开始数到总和，又像min策略一样把第二个加数直接接在后面数。比如4+2：数“1、2、3、4，5、6”。七个发现min策略的孩子，都是先用了这个简便策略。有趣的是，只看答题时间和正确率，永远发现不了它。",views:"counts"},
 {h:"Generalization of the Discovery",x:"Discovery of the min strategy did not quickly lead to its [[widespread *generalization*|use everywhere|wide use|generalization]]. <<n:Even children who eventually generalized the strategy quite widely used it only occasionally at first. For example, the two children who eventually used the strategy on the highest percentages of trials of any participant used it on only 7 of 84 and 2 of 49 trials following their discoveries.>> Again, this ran counter to the [[eureka stereotype|“aha!” idea|“aha!” idea||A stereotype is a fixed picture everyone has in their head. The plain words lose the warning that this picture is too simple.]], in which discovery of a new approach leads to its immediate application.",zh:"发现min策略后，孩子并没有很快把它推广开。即使后来用得最多的两个孩子，刚发现后也只在84题中用了7次、49题中用了2次。这又和“尤里卡”式的刻板印象相反：以为一发现就会马上用。"},
 {omitBefore:"a paragraph on what should count as a discovery",x:"A more useful [[conceptualization|way of thinking about it|way to think]] may be to recognize that discovery of a strategy is frequently just the first step toward its mastery. Only as people use new concepts and strategies, and experience their consequences, do they fully comprehend their advantages, disadvantages, and conditions of applicability. <<w:Adults—even the most innovative scientists—are also far from immune. Wegener, the father of ((plate tectonic theory|plates)), described his theory as originating in 1910 or 1911, as a result of his being struck at that point “by the congruence of the coastlines on either side of the Atlantic.” Yet Giere (1988) noted that a fellow graduate student recalled that Wegener was struck by this same congruence, and talked about it often, in 1903.=>Even great scientists sit on an idea for years.>>",zh:"更好的理解是：发现一个策略往往只是掌握它的第一步。只有用了新概念和新策略、体验了后果，人才会真正明白它的优缺点和适用条件。大人也一样：板块构造理论之父魏格纳说他1910年才想到，但同学记得他1903年就常谈大西洋两岸海岸线吻合的事。"},
 {h:"The Role of Impasses (again)",x:"Recall that in the eighth week of the practice period, children were presented challenge problems such as 22 + 3. Such problems did not [[facilitate|help|help]] discovery of the min strategy<<n:; none of the three children who had not previously used the min strategy did so in response to this set of challenge problems>>. However, the problems did have a large impact on generalization of the strategy among the five children who had used the min approach previously. <<n:Use of the strategy, which had been below 20% of trials on which the children counted, immediately jumped to 60% of the challenge problems on which counting occurred. The use continued to increase in the last three weeks of the experiment, eventually reaching 90% of trials on which children used counting strategies.>> These findings suggest that impasses play an important role in learning, but not necessarily the role that usually has been attributed to them.",zh:"第8周的挑战题（如22+3）并没有帮助发现：三个之前没用过min策略的孩子仍然没发现。但它们极大促进了推广：五个已经发现的孩子，min策略的使用从不到20%立刻跳到60%，最后达到90%。可见“卡住”在学习中很重要，但作用和人们通常以为的不同。",views:"fig1"},
 {h:"Conclusions",omitBefore:"two paragraphs summing up what microgenetic studies can show",x:"<<e:These two commonly observed phenomena may at a deeper level constitute two realizations of the same phenomenon:=>In short:>> Cognition and cognitive growth are far more variable than our models typically suggest. People often use multiple strategies where they have been depicted as using only one. <<x:The most accurate children tend to use the more advanced strategies, but sometimes do not.>> <<n:Long solution times precede many, but not all, children’s discoveries.>> Discoveries are made following successes as well as failures, and are often used [[sporadically|only now and then|only now and then]] once they are made. <<c:[[Unambiguous|Clear|Clear]] documentation of this variability may provide the [[impetus|push|push]] for future models that will account for it and explain its role in producing change.>>",zh:"总之，认知和认知发展比我们的模型所描述的多变得多。人们常常同时使用多种策略。最准确的孩子通常用高级策略，但也不总是。很多发现之前解题时间很长，但不是全部。发现既出现在成功之后，也出现在失败之后，而且发现后常常只是偶尔使用。清楚记录这种多变性，会推动未来的理论去解释它。",views:"send"}
]};
