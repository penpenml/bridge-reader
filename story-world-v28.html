STRUCT["goals"]={"0": [["Point", "Adolescence is a developmental period when youth are preoccupied with their identities—who they are and who they will become."], ["Term", "These identities are tied to social expectations and stereotypes, which function like “social mirrors” reflecting society’s image of who and what one should be."], ["Example", "Black males, {for example}, are routinely depicted as aggressive, hypersexual, and violent; they are gang members, criminals, or professional athletes."], ["Main idea", "{While} this cultural image does not represent the vast majority of Black males, its dominance as a stereotype tangibly impacts how young Black males come to view themselves and make sense of their own identities."]], "1": [["Expert", "Decades ago, Erik Erikson articulated the influence of social expectations on identity processes, arguing that “a young person may well put his energy into becoming exactly what the careless and fearful community expects him to be.”"], ["Term", "{In other words}, youth may accommodate to stereotypes, endorsing and reinforcing stereotypes in their own identities."], ["Example", "A Black male, {for example}, in response to being stereotyped as threatening and aggressive reacts with violent outbursts of anger."], ["Example", "{Or}, being viewed by his teachers as a troublemaker who does not value education, a Black boy drops out of school."]], "2": [["Background", "This process of accommodation has been the focus of much research about Black males."], ["Turn", "{At the same time}, there is growing evidence that youth desire not to be a stereotype and, in fact, often resist stereotypes in ways that are beneficial to their health and well-being."], ["Example", "An example of such resistance is when Black males cultivate “scholar identities” and resolve to excel in school despite the low expectations they face."]], "3": [["Method", "The current study examined identity development as a process of resistance and accommodation to racial and gender stereotypes among Black adolescent males."], ["Method", "Data were collected at Black Male Charter School (BMCS), an all-Black, all-male high school located in a Midwest urban center."], ["Scene", "The leaders describe BMCS as a space designed to provide its students with “positive counter-images of successful Black men” and give them a “vision for college.”"], ["Scene", "They refer to the students as “scholars” and college graduation (not merely acceptance or attendance) defines the school’s primary mission."]], "4": [["Finding", "In our analysis, we found more evidence of resistance to racial stereotypes and more accommodation to gender stereotypes."], ["Quote", "Across the interviews, the majority of the boys were able to name and reject negative racial stereotypes in some form. {For example}, Monte, describing what other people think about Black people, said, “Society says that we are illiterate and that’s not true.”"], ["Contrast", "{In contrast}, when talking about gender, two thirds of the boys either stated that there were no stereotypes about boys or reiterated the stereotypes as “natural.”"], ["Quote", "Ronald said, “Not really, especially being a boy I guess you’re supposed to act in a certain way—Well, not supposed to, but it just comes naturally… just guys like to get into trouble… like to fight, make fun of each other.”"], ["Explains", "{Although} boys readily challenged stereotypes about the intellectual inferiority and incompetence of Black people, they endorsed the idea that as boys they were to be independent, emotionally stoic, and heterosexual."]], "5": [["Finding", "The pattern of more resistance to racial stereotypes and more accommodation to gender stereotypes became more prevalent over time."], ["Explains", "Gender accommodation was expressed in the repetition of phrases “I don’t care,” which downplays emotion in alignment with masculine stoicism, and “I just do me,” which extols autonomy over relatedness."], ["Quote", "Devin said in 10th grade, “I don’t want to say I really don’t care about stuff but I really don’t let stuff bother me… So that’s how I became me, you know, Mr. Don’t Care.”"]], "6": [["Finding", "{At the same time}, boys’ awareness of and resistance to racial stereotypes have become more pronounced over time, as boys understood their potential to disrupt negative stereotypes."], ["Quote", "Michael said, “Sometimes it hurts a little bit, but then I don’t even think about it because as long as I know I’m not adding on to those stereotypes or adding a number to the statistics it doesn’t bother me because I know I’m doin’ my part.”"], ["Main idea", "It was this sense of agency in the face of racial stereotypes that seemed to sustain resistance over time."]], "7": [["Method", "Our within-case analysis examined each subject along the dimensions of resistance (and accommodation) to racial stereotypes and gender stereotypes."], ["Number", "We found three groups: the “Accommodators” (n = 5; 24%), the “Resisters” (n = 4; 19%), and the “Exceptions” (n = 12; 57%) who were characterized by viewing themselves as exceptions to the stereotypes."], ["Point", "{While} differences between the case studies are emphasized, it is important to note the rich nuance and diversity across all of the boys’ identities."]], "8": [["Term", "The “accommodators” were a group of boys who, on the whole, exhibited little resistance and reinforced racial and gender stereotypes."], ["Explains", "{Rather than} challenge these negative stereotypes, the “accommodators” tended to perpetuate them."], ["Quote", "When asked what he doesn’t like about being Black, Omar said, “Everybody think[s] you’re like the other Black person they see… And I’m like, don’t judge me; let me at least show you what I’m about before you judge me.”"], ["Main idea", "The “accommodators,” like Omar, did not necessarily believe the stereotypes to be true, {but} {instead of} rejecting them, they tried to repurpose them in order to survive."]], "9": [["Term", "The “resisters” were more likely to see stereotypes as a system of oppression that undermines an entire social group (e.g., Black people) rather than individuals."], ["Quote", "Marcus explained, “Society has its boxes for everybody, and they don’t like it when you like jump outside of it… You’re not supposed to be a bookworm, be feminine.”"], ["Quote", "Marcus said, “My plan in life is to be as unique and extraordinary as possible… I have goals to prove all those people wrong and not fit into any one of those boxes.”"], ["Quote", "He said, “I actually get kind of mad but I try to keep that anger under wraps… So I try to focus it in, do my schoolwork, so I can break the stereotype.”"]], "10": [["Quote", "Marcus said, “Guys aren’t supposed to be sensitive or show their feelings, or cry. That’s a big one… of course you gonna cry cause that’s like human nature, you’re supposed to cry, that’s why you have tear ducts in your body.”"], ["Contrast", "{In contrast to} the “accommodators” who viewed gender stereotypes as natural and beneficial, the “resisters” questioned the assumed privilege of this gender ideology."], ["Conclusion", "The “resisters” were acutely aware of what society said they were supposed to be and challenged the expectations by questioning the truth of the “boxes.”"]], "11": [["Term", "The final pattern identified was the “exceptions” who comprised the majority of the sample. They are so named {because} they viewed themselves as exceptions to the stereotypes."], ["Quote", "Jaire said, “I have to hold myself to a higher standard because people don’t think that African American males can do this and do that, like go to college, accomplish things.”"], ["Explains", "{But}, {unlike} the “resisters” who challenged the truth of the stereotype, the “exceptions” established their identities viewing themselves as an exception to it."], ["Explains", "{In other words}, Jaire’s self-description suggests that other Black boys might be dumb and uneducated, {but} I’m not."]], "12": [["Quote", "Jaire said, “Like men, there’s not supposed to be any emotion in your decisions… Because men make hard decisions without emotion.”"], ["Explains", "Jaire reiterates the stereotype that women are emotional (and therefore weak), whereas men are stoic (and therefore strong)."], ["Conclusion", "The “exceptions” were characterized by this duality in responding to oppression: Resisting the oppression of racial stereotypes (specifically for the self) while also accommodating to the male privilege of gender stereotypes."]]};GSENT["goals"]={"0": ["Teens think a lot about who they are and who they will become.", "Labels from society work like mirrors. They show teens what society thinks they should be.", "For example, Black boys and men are often shown as violent, as criminals, or as sports stars.", "This picture doesn’t fit most Black males. But because it is everywhere, it really affects how Black boys see themselves."], "1": ["Long ago, the scientist Erik Erikson warned: a teen may work hard to become just what a careless, scared community expects.", "In other words, teens may {{accommodate|accommodate}}: they start to act out the label.", "For example, a boy who is treated as dangerous may explode in anger.", "Or a boy whose teachers think he doesn’t care about school drops out."], "2": ["Most research on Black boys has studied this “giving in.”", "But more and more studies show that teens don’t want to be a label, and they push back in ways that keep them healthy.", "For example, some Black boys decide to be scholars and do great in school, even when people expect little of them."], "3": ["This study looks at how Black teen boys accept or push back on labels about race and about being a boy.", "The boys went to an all-Black, all-boys high school in a Midwest city.", "The school wanted to show them pictures of successful Black men and help them aim for college.", "Students were called “scholars,” and the goal was finishing college."], "4": ["The boys pushed back on race labels, but went along with boy labels.", "Most boys could name a race label and say it was wrong. Monte said: “Society says that we can’t read, and that’s not true.”", "But about boys, two out of three said there were no labels, or that the labels were just “natural.”", "Ronald said boys just naturally like to get into trouble and fight.", "They fought the idea that Black people are not smart. But they agreed that boys should be tough, alone and not show feelings."], "5": ["This pattern got stronger as the boys got older.", "More boys kept saying “I don’t care” (hide your feelings) and “I just do me” (don’t need anyone).", "Devin said he stopped letting things bother him, and became “Mr. Don’t Care.”"], "6": ["At the same time, the boys pushed back harder on race labels, because they saw they could break them.", "Michael said the label hurts a little, but he is doing his part by not becoming a number in the bad statistics.", "Feeling that they could make a difference kept them pushing back."], "7": ["The authors looked at each boy: did he push back on race labels? On boy labels?", "They found three groups: 5 Accommodators, 4 Resisters, and 12 Exceptions, who saw themselves as different from the label.", "Each boy is still his own person, with his own story."], "8": ["Accommodators mostly went along with both race and boy labels.", "Instead of fighting the labels, they kept them going.", "Omar, one of them, said: people think every Black person is the same. Don’t judge me before you know me.", "They didn’t believe the labels. But they used the tough image to stay safe."], "9": ["Resisters saw labels as something unfair that hurts a whole group, not just one person.", "Marcus said: society has boxes for everyone, and doesn’t like it when you jump out.", "His plan is to be one of a kind and prove everyone wrong.", "He gets mad, but he turns the anger into schoolwork to break the label."], "10": ["Marcus said people think boys can’t cry. But crying is human. That’s why we have tears!", "Accommodators thought boy labels were natural and good. Resisters asked if they really were.", "Resisters knew what society expected, and asked: are these boxes even true?"], "11": ["Most boys were Exceptions: they saw themselves as not like the label.", "Jaire said he must do better than everyone, because people think Black boys can’t go to college.", "But unlike Marcus, Jaire didn’t say the label was false. He said he was different from it.", "His message: maybe other Black boys fit the label, but I don’t."], "12": ["Jaire also said men should make choices without feelings.", "He repeats the label that women are too emotional and men are strong.", "So the Exceptions did two things at once: they fought race labels for themselves, but kept the boy labels that give men an advantage."]};ROLE["goals"]={"0": ["hook", "opens with the idea of stereotypes as “social mirrors”"], "1": ["background", "introduces “accommodation” with Erikson’s warning"], "2": ["contrast", "the other path: resistance"], "3": ["method", "describes who was studied and where"], "4": ["finding", "first finding: race labels rejected, boy labels accepted"], "5": ["finding", "second finding: over time, both patterns grew"], "6": ["finding", "the hopeful side: resisting race labels gave them a mission"], "7": ["finding", "names the three groups"], "8": ["example", "path 1: Omar, the “accommodator”"], "9": ["example", "path 2: Marcus, the “resister”"], "10": ["contrast", "Marcus pushes back on the “boys don’t cry” label too"], "11": ["example", "path 3: Jaire, the “exception”"], "12": ["contrast", "the contradiction inside the “exceptions”"]};
SEC["goals"]=[
 {id:"gl1",t:"Mirrors and boxes",paras:[0, 1, 2],look:"What two ways can a teen respond to a stereotype?",logic:{"q": "What is the difference between “accommodating” and “resisting” a stereotype?", "o": ["Accommodating means believing it; resisting means not knowing about it", "Accommodating means acting it out or taking it into who you are; resisting means challenging it", "They mean the same thing"], "a": 1, "why": "Erikson’s example: a boy seen as a troublemaker drops out, which accommodates. Building a “scholar identity” despite low expectations is resistance."},keys:[["Teens build identities while society shows them “social mirrors” (stereotypes)",/identit|mirror|stereotype|society/i],["Black boys are pictured in negative ways that don’t fit most of them",/aggressive|violent|criminal|athlete|negative|image/i],["Accommodate: become what people expect (e.g., drop out)",/accommodat|become|expect|drop out|troublemaker/i],["Resist: challenge it, e.g., build a scholar identity",/resist|scholar|excel|challenge/i]],model:"Teens figure out who they are while society holds up “mirrors” of what they should be, and Black boys are often shown as violent or only good at sports. A teen can accommodate (start acting like the label, like dropping out when seen as a troublemaker) or resist (push back, like deciding to be a scholar)."},
 {id:"gl2",t:"What the boys said",paras:[3, 4, 5, 6],look:"Which labels did the boys push back on, and which did they accept?",logic:{"q": "The boys pushed back on race stereotypes but saw boy stereotypes as “natural.” What does that show?", "o": ["That gender stereotypes are true", "That a stereotype can be harder to resist when it doesn’t feel like a stereotype at all", "That the boys didn’t care about either"], "a": 1, "why": "Ronald says fighting and flirting “just comes naturally.” Because he doesn’t see it as a label, he can’t push back on it, while he easily rejects the label that Black people can’t read."},keys:[["21 Black boys at an all-boys charter school were interviewed over two years",/interview|21|charter|school|9th|10th/i],["Most rejected race stereotypes (e.g., “we are illiterate”)",/race|racial|illiterate|reject|18/i],["Most accepted boy stereotypes as natural",/gender|natural|boy|fight|ronald/i],["Over time: more “I don’t care,” “I just do me,” but also more resistance to race labels",/don’t care|do me|over time|michael|my part/i]],model:"The researchers interviewed 21 Black boys at an all-boys charter school in 9th and 10th grade. Most rejected race stereotypes, like “Black people are illiterate,” but saw boy stereotypes, like fighting and not showing feelings, as just “natural.” Over time they said “I don’t care” and “I just do me” more, but also pushed back harder on race labels."},
 {id:"gl3",t:"Three paths",paras:[7, 8, 9, 10, 11, 12],look:"What are the three kinds of boys, and how are they different?",logic:{"q": "Jaire says he is “not just a regular Black man.” Why do the authors call this only a partial resistance?", "o": ["Because Jaire doesn’t care about school", "Because he treats himself as the exception but leaves the stereotype standing for other Black boys, and accepts gender stereotypes", "Because he agrees with the race stereotype about himself"], "a": 1, "why": "Marcus says the boxes are wrong for everyone. Jaire says “others may be that way, but I’m not,” so the label survives, and he still says men shouldn’t show emotion."},keys:[["Accommodators (Omar): went along with race and gender labels to survive",/accommodator|omar|survive|tough/i],["Resisters (Marcus): challenged both race and gender labels, for everyone",/resister|marcus|box|cry|feeling/i],["Exceptions (Jaire): “I’m not like them” on race, but accepted gender labels",/exception|jaire|higher standard|regular|men run/i],["Most boys (12 of 21) were exceptions",/12|most|majority|57/i]],model:"The boys followed three paths. Accommodators like Omar went along with race and gender labels, partly to stay safe. Resisters like Marcus pushed back on both and said the “boxes” are wrong for everyone, including the idea that boys can’t cry. Most boys were Exceptions like Jaire: “I’m not like other Black boys,” while still saying men shouldn’t show feelings."}];

CARDS["return"]={word:"rate of return",pos:"noun phrase",rar:"rare",def:"How much extra you get back each year for every dollar you put in.",zh:"回报率",ex:"…every dollar invested in high-quality early childhood education produces a 7 to 10 percent per annum return on investment.",parts:"“Return” means what comes back to you. 7% return = 7 cents back each year per dollar.",ladder:["money back", "what you get back", "extra each year per dollar", "rate of return"]};
TEXTS["ece"]={id:"ece",genre:"Economics essay",short:"Early years",gcol:"--coin",src:"American Educator · Spring 2011 · 5 pages",title:"The Economics of [[Inequality|Unfairness|Unfair Gaps]]: The Value of [[Early Childhood Education|School before Kindergarten|Preschool]]",by:"James J. Heckman",note:"Selected sections in the author’s own words, lightly trimmed (citations removed). Headings are the author’s.",paras:[
 {h:"[Two ways to see fairness]",x:"Educational equity is often discussed as a [[moral issue|question of right and wrong|right and wrong]]. Another way to think about equity is as a way to promote [[productivity|how much people can produce|output]] and [[economic efficiency|getting the most from money|no waste|efficiency]]. As an economist, I focus on the economic value of equalizing educational opportunities and achievement in order to identify the most effective way to increase the productivity of the American economy. [[Underdeveloped human potential|talent that never got to grow|wasted talent]] [[burdens|weighs down|hurts]] our economy and leaves us with a workforce that is less than it could be.",gs:"People usually say fair schooling is about being good and fair. But you can also see fairness as a way to make the economy work better. Heckman studies money. He asks: what gives the country the most value? When kids don’t get to grow their talents, the whole country loses."},
 {x:"Traditionally, [[equity|fairness|fairness|equity]] and efficiency are viewed as [[competing goals|goals that fight each other|rivals]]. One can be fair in [[devising|planning|making]] a policy, but it often happens that what is fair is not economically efficient. Thus a cut in the tax rate on [[capital gains|money made from investments|investment profits]] promotes economic efficiency by [[stimulating|boosting|boosting]] investment; it is not fair because it mainly benefits the rich. What is remarkable is that there are some policies that both are fair—i.e., promote equity—and promote economic efficiency. Investing in the early years of [[disadvantaged|poor|poor|disadv]] children’s lives is one such policy.",gs:"Usually, being fair and being efficient fight each other. A fair plan is often not the money-smart plan. For example, lower taxes on investments help the economy grow, but they mostly help rich people. The surprise: some plans are both fair and money-smart. Spending on poor kids when they are very young is one of them."},
 {x:"For many years, Flavio Cunha from the University of Pennsylvania, myself, and colleagues have been [[synthesizing|putting together|combining]] what is known from the fields of biology, human development, education, psychology, cognitive science, and economics to answer the following three questions: 1. When does inequality start? 2. Is it worthwhile to reduce inequality by investing in education? 3. How best to invest limited resources to create more productive [[human capital|people’s skills|skills|humancap]]? The evidence is quite clear that inequality in the development of human capabilities produces negative social and economic outcomes that can and should be prevented with investments in early childhood education, particularly [[targeted toward|aimed at|for]] disadvantaged children and their families.",gs:"Heckman and his team put together facts from many sciences to answer three questions: When do the gaps between kids start? Is fixing them worth the money? What is the best way to spend? His answer: gaps in skills cause big problems later, and we should stop them early with preschool for poor families."},
 {h:"Winning or losing the lottery of birth",x:"Each of us is born into [[circumstances|situations|situations]] over which we have no control. Our parents, their genes, education, health status, economic resources, and environment are passed onto us through our families and neighborhoods. By nature and circumstance, [[endowments|what we are born with|starting gifts]] are unequal. We can’t completely change that picture. But we can change some of it. In particular, we should address the [[inequity|unfairness|unfairness]] in the resources families have to properly develop their children’s potential.",gs:"Nobody gets to choose the family they are born into. We get our parents’ genes, money, health, schooling and neighborhood. So what each baby starts with is not equal. We can’t fix all of it. But we can fix some. Most of all, we should help families who have less to help their kids grow."},
 {x:"Gaps in [[cognitive and emotional stimulation|brain and feelings support|learning and love]] for children from families of different [[socioeconomic status|how much money and schooling a family has|family wealth]] open up early. There are large gaps in cognitive stimulation and emotional support at early ages. They [[persist|last|last]] throughout childhood and strongly influence adult [[outcomes|results|results]]. The fraction of American children under age 18 with only a single parent (i.e., never married or divorced) has grown from 12 percent to over 27 percent during this period.",gs:"Some kids get read to and encouraged much more than others, and the gap starts very early. The gaps are big when kids are tiny. They last all through childhood and shape adult life. More kids now live with one parent: from 12 in 100 kids to over 27 in 100 since 1968."},
 {x:"The problem is not just income. Good parenting is more important than cash. High-quality parenting can be available to a child even when the family is in [[adverse financial circumstances|money trouble|money trouble]]. An [[economically advantaged|well-off|rich]] child exposed to low-quality parenting is more disadvantaged than an economically disadvantaged child exposed to high-quality parenting.",gs:"The problem is not only money. Good parenting matters more than cash. A poor family can still parent very well. A rich kid with poor parenting is worse off than a poor kid with great parenting."},
 {h:"Cognition and character propel success",x:"Numerous studies have [[documented|recorded and shown|shown]] that cognitive ability, usually measured by scholastic achievement tests, predicts schooling, wages, participation in crime, health, and success in many [[facets|sides|parts]] of life. Personality traits—often referred to as character—have also proven to be powerful predictors of the same outcomes. These abilities are [[attributes|qualities|parts]] of character: [[perseverance|not giving up|not quitting|perseverance]], motivation, self-esteem, self-control, [[conscientiousness|being careful and responsible|being careful]], and forward-thinking behavior. Cognition and character work together.",gs:"Many studies show that test smarts predict school, pay, crime and health. But character predicts the same things just as strongly. Character means not giving up, wanting to do well, liking yourself, self-control, being careful, and planning ahead. Thinking skills and {{character skills|character}} work as a team."},
 {x:"Those who don’t graduate from high school but [[obtain|get|get]] a GED are less successful economically than high school graduates. This has more to do with [[shortfalls|gaps|gaps]] in personality skills—or character—than cognition. The GED test is effective in [[screening|checking|testing]] for test takers’ cognitive abilities. It completely misses their [[noncognitive traits|skills that aren’t about thinking|habits]]. Individuals who persist in graduating from high school are more likely to have personality traits that help them succeed in life. They show up, control their [[impulses|sudden urges|urges]], work toward a goal, and work with others.",gs:"People who pass the GED test instead of finishing high school earn less than graduates. It is not because they are less smart. It is because of character. The GED tests smarts, but not habits like sticking with things. People who finish high school show up, control themselves, work toward goals and work with others."},
 {x:"Given this fact, it is [[alarming|worrying|scary]] that our education system primarily values cognitive achievement. Important character traits that promote personal achievement are largely ignored or [[maligned|put down|mocked]] as “soft” and nonmeasurable skills. Evidence suggests that efforts that focus mainly on closing [[disparities|gaps|gaps]] in cognitive achievement are not as successful as they could be because they neglect the need to close gaps in character development.",gs:"So it is worrying that schools mostly care about test smarts. Character skills get ignored or called “soft.” Plans that only close test-score gaps don’t work as well, because they forget the character gaps."},
 {h:"Targeting disadvantaged children promotes economic efficiency",x:"Gaps in the [[capabilities|abilities|skills]] that play important roles in determining diverse adult outcomes open up early across socioeconomic groups. The gaps [[originate|start|start]] before formal schooling begins and persist through childhood and into adulthood. [[Remediating|Fixing later|Fixing|remediate]] the problems created by the gaps is not as [[cost effective|good value for the money|cheap]] as preventing them [[at the outset|at the start|at the start]]. For example, schooling after the second grade plays only a minor role in creating or reducing gaps. [[Conventional|Usual|Usual]] measures of educational inputs—class size and teacher salaries—that receive so much attention in policy debates have small effects on creating or eliminating disparities.",gs:"The skill gaps between rich and poor kids open early. They start before school and last into adult life. Fixing gaps later costs more than stopping them at the start. After 2nd grade, school does little to change the gaps. Even smaller classes and higher teacher pay don’t change the gaps much."},
 {h:"Enriching early family environments can compensate for disadvantage",x:"The Perry Preschool Program is the [[flagship|most important|best-known]] early childhood [[intervention|program to help|help program]] program. Perry enriched the lives of low-income African American children with initial IQs of 85 or below. The intervention was targeted to 3-year-olds and was [[relatively modest|fairly small|small]]: 2.5 hours per day of classroom instruction, 5 days per week, and 1.5 hours of weekly home visits. Children participated for only two years, and no further intervention was given. But the lives of participants were tracked for decades to see the effect on school and adult outcomes.",gs:"The most famous preschool program is Perry Preschool. It helped poor Black children who started with low IQ scores. It was small: 2.5 hours of class a day, plus a teacher’s home visit each week, starting at age 3. Kids went for just two years. Then researchers followed their lives for decades."},
 {x:"Perry did not produce lasting gains in the IQs of its male participants and produced at best modest gains in IQ for females. Yet the program has a [[rate of return|money paid back each year|payback|return]] of around 7 to 10 percent [[per annum|each year|a year]] for males and females—well above the post–World War II stock market returns to equity (estimated to be 5.8 percent before the 2008 meltdown). Even though their IQs after age 10 were not higher on average, participants’ achievement test scores were higher. The [[principal|main|main]] influence in the Perry Program was its positive effect on noncognitive (character) skills.",gs:"Perry did not raise boys’ IQ for long, and girls’ IQ only a little. Yet every dollar paid back 7 to 10 cents a year. That beats the stock market. Their IQs were not higher, but their school test scores were. Perry worked mostly by building {{character skills|character}}."},
 {h:"Moving toward better education and economic outcomes",x:"The logic is quite clear from an economic [[standpoint|point of view|view]]. We can invest early to close disparities and prevent achievement gaps, or we can pay to [[remediate|fix|fix|remediate]] disparities when they are harder and more expensive to close. Either way we are going to pay. But, there is an important difference between the two approaches. Investing early allows us to shape the future; investing later [[chains us to|ties us to|traps us in]] fixing the missed opportunities of the past.",gs:"For an economist, the answer is clear. We can pay early to stop the gaps, or pay later to fix them when it’s harder and costs more. We will pay either way. But paying early builds the future. Paying late only fixes the past."}]};

SEC["ece"]=[
 {id:"ec1",t:"Fair and smart at the same time",paras:[0, 1, 2],look:"Usually fairness and efficiency fight. What is the exception?",logic:{"q": "Why does Heckman start with the tax-cut example?", "o": ["To argue that taxes on the rich should be cut", "To show the usual trade-off, so his exception (early education is fair AND efficient) stands out", "To prove that all fair policies are efficient"], "a": 1, "why": "The tax cut is efficient but not fair: the normal trade-off. Then he says “What is remarkable is…” early education is both. The example makes the exception surprising."},keys:[["Fairness (equity) and efficiency usually compete",/compet|trade|fight|usually|either/i],["Example: a capital gains tax cut is efficient but not fair",/tax|rich/i],["Investing in disadvantaged young children is both fair and efficient",/both|early|young|disadvantaged|preschool/i],["His three questions: when inequality starts, is it worth reducing, how to invest",/when|start|worth|how to invest|question/i]],model:"Usually a policy is either fair or efficient, not both: a tax cut for investors helps the economy but mostly helps the rich. Heckman’s surprise is that investing in poor children’s early years is both fair and good for the economy, and he asks when inequality starts and how best to invest."},
 {id:"ec2",t:"Where the gaps come from",paras:[3, 4, 5, 6, 7, 8],look:"What makes children unequal before school even starts?",logic:{"q": "Heckman says “Good parenting is more important than cash.” Which example does he use to support this?", "o": ["Rich families always parent better", "A richer child with low-quality parenting is worse off than a poorer child with high-quality parenting", "Single parents earn less money"], "a": 1, "why": "He compares two children: money without good parenting loses to good parenting without money. That is why he says income is not enough to measure what a child gets."},keys:[["Inequality starts early: kids are born into different families (lottery of birth)",/birth|born|lottery|family|early/i],["Gaps in stimulation and support open early and last into adulthood",/gap|stimulation|support|reading|last|persist/i],["It is not just money: parenting quality matters more than income",/money|income|cash|parenting/i],["Cognitive skills and character skills (perseverance, self-control) both matter",/character|personality|cognitive|persever|self-control|ged/i]],model:"Children are born into very different families, and gaps in how much they are read to and encouraged open up before age 3 and last. Money alone isn’t the issue; good parenting matters more. Success needs both thinking skills and character skills like perseverance and self-control, which schools mostly ignore."},
 {id:"ec3",t:"Pay now or pay later",paras:[9, 10, 11, 12],look:"Why is it cheaper to invest early than to fix things later?",logic:{"q": "Perry Preschool did not raise boys’ IQ for long. Why does Heckman still call it a success?", "o": ["Because it was cheap", "Because it raised achievement and character, and paid back 7–10% a year", "Because girls’ IQ went up a lot"], "a": 1, "why": "IQ gains faded, but test scores, adult life and character improved, and the return beat the stock market. So the program worked through character, not IQ."},keys:[["Gaps open before school; preventing them is cheaper than fixing them later",/before school|early|prevent|cheaper|cost|fix later|remediat/i],["Perry Preschool: small program, tracked for decades",/perry|preschool|3-year|decades/i],["No lasting IQ gain, but 7–10% return through character skills",/iq|7|10|percent|return|character|noncognitive/i],["Invest early to shape the future; investing later only fixes the past",/future|past|later|either way|pay/i]],model:"Gaps open before school and fixing them later costs more than preventing them. The Perry Preschool program gave a few hours a day to 3- and 4-year-olds; IQs did not stay higher, but achievement and character did, and it paid back 7–10% a year. We pay either way, but investing early shapes the future."}];
CARDS["fadeout"]={word:"fade out",pos:"verb phrase",rar:"rare",def:"When an early gain slowly disappears, so the helped group ends up no better than the others.",zh:"效果消退",ex:"Studies suggest short-term gains in test scores “fade out” for many Head Start children.",parts:"Like a song that fades out: loud at first, then quieter until you can’t hear it.",ladder:["disappear", "slowly go away", "gains that don’t last", "fade out"]};

CARDS["panel"]={word:"panel survey",pos:"noun phrase",rar:"legendary",def:"A study that asks the same families questions again and again over many years.",zh:"追踪调查（面板调查）",ex:"…because the PSID is a panel which stretches back over a quarter century…",parts:"A “panel” is a fixed group of people. Asking the same panel for years shows how lives change.",ladder:["ask again", "ask the same people", "follow families for years", "panel survey"]};
CARDS["control"]={word:"control (for)",pos:"verb",rar:"legendary",def:"In research: to take away the effect of other things, so you can see the effect of the one thing you study.",zh:"控制（变量）",ex:"…we are able to control for family background…",parts:"Think of a fair race: everyone starts at the same line. Controlling makes the comparison fair.",ladder:["make it fair", "take out other causes", "compare fairly", "control for"]};
CARDS["spillover"]={word:"spillover",pos:"noun",rar:"rare",def:"A good (or bad) effect that spreads from one person to others nearby.",zh:"溢出效应",ex:"There is some evidence of positive spillovers from older Head Start children to their younger siblings.",parts:"Like water spilling over the top of a full cup onto the table.",ladder:["spread", "help that spreads", "effects that reach others", "spillover"]};
CARDS["confer"]={word:"confer",pos:"verb",rar:"legendary",def:"To give something, like a benefit or a prize.",zh:"给予、带来",ex:"This paper addresses the important question of whether the Head Start program confers longer-term benefits on participants.",parts:"con (together) + ferre (to bring). Same root as “transfer”.",ladder:["give", "hand over", "bring to someone", "confer"]};
TEXTS["hs"]={id:"hs",genre:"Economics study",short:"Head Start",gcol:"--l1",src:"American Economic Review · 2002 · 15 pages",title:"[[Longer-Term|Long-Lasting|Lasting]] Effects of Head Start",by:"Eliana Garces, Duncan Thomas, and Janet Currie",note:"Selected sections in the authors’ own words, lightly trimmed (citations and statistics tables removed). Headings in [brackets] are ours.",paras:[
 {h:"[The question]",x:"Head Start, a public preschool program for [[disadvantaged|poor|poor|disadv]] children, is designed to close the gaps between these children and their more [[advantaged peers|better-off classmates|richer kids]]. Begun in 1965 as part of the “War on Poverty,” Head Start has enjoyed widespread [[bipartisan|from both parties|both parties|bipartisan]] support along with increasing budgets. It is now a $4.7 billion program serving more than 800,000 children and it is a model for separate state-funded programs.",gs:"Head Start is a free government preschool for poor kids. It tries to close the gap between them and richer kids. It started in 1965 to fight poverty. Both political parties have liked it, and its budget keeps growing. Today it costs $4.7 billion and serves over 800,000 kids."},
 {x:"Head Start is an investment in children that is [[intended|meant|meant]] to help them through the rest of their lives. Although there is evidence suggesting [[significant|important|real]] short-term benefits associated with participation in the program, [[critics|people who disagree|doubters]] point out there is no evidence that the program has lasting benefits. Studies suggest short-term gains in test scores [[“fade out”|slowly disappear|disappear|fadeout]] for many Head Start children. Evidence cited in support of the long-term effectiveness of early interventions comes from analyses of other programs, such as the famous Perry Preschool intervention, most of which [[bear little resemblance to|are not much like|differ from]] the Head Start model.",gs:"Head Start is supposed to help kids for their whole lives. It clearly helps at first. But critics say no one has shown that the help lasts. Studies show the test-score gains {{fade out|fadeout}} for many kids. The proof that preschool helps for a long time comes from other programs, like Perry Preschool, which are not much like Head Start."},
 {x:"This paper addresses the important question of whether the Head Start program [[confers|gives|gives|confer]] longer-term benefits on participants. First, in 1995, questions about participation in Head Start and other preschools were included in the interviews and asked about all adult household members age 18 through 30. Second, because the PSID is a [[panel|survey of the same families|long survey|panel]] which stretches back over a quarter century, we are able to [[control for|take into account|adjust for|control]] family background and the environment in which each respondent grew up in great detail. Third, the PSID provides a [[nationally representative sample|group that looks like the whole country|fair mix]] of children who participated in actual Head Start programs rather than [[experimental model programs|special test programs|test programs]].",gs:"This paper asks: does Head Start help kids in the long run? In 1995, a big survey asked adults aged 18 to 30 whether they had gone to Head Start or another preschool. The same families were followed for over 25 years, so the authors know a lot about how each person grew up. And the people in it went to real, everyday Head Start programs, from all over the country."},
 {h:"[Comparing brothers and sisters]",x:"Currie and Thomas attempt to control for [[unobserved characteristics|hidden differences|hidden things]] of children by comparing [[siblings|brothers and sisters|brothers and sisters]] who participated in Head Start with those who did not. The idea is that by using siblings as the [[controls|comparison group|comparison|control]], any shared characteristics of family background will be controlled. We also [[exploit|make use of|use]] the family-based sampling frame of the PSID by including [[maternal fixed effects|same-mother comparisons|same-mom checks]] and comparing adult outcomes of siblings.",gs:"The authors compare brothers and sisters: one went to Head Start, one did not. Siblings share the same parents and home, so those things can’t explain the difference. This study does the same: it compares the adult lives of brothers and sisters from the same mother."},
 {x:"Studies have shown that participation in Head Start is [[associated with|linked to|linked to]] short-term benefits, as indicated by improved test scores. These benefits appear to “fade out” by around the third grade so that Head Start children are no better off than controls at that point. [[Dissipation|Disappearing|Losing]] of test-score gains does not necessarily imply that Head Start children do not benefit from starting school “on the right foot.” For example, avoidance of [[grade repetition|repeating a grade|repeating a grade]] and special education early in life may be associated with higher [[eventual schooling attainment|how far you get in school in the end|final schooling]]. Head Start may also be associated with lasting improvements in [[noncognitive skills|habits and character|habits]] that are important for future success in life.",gs:"Studies show Head Start raises test scores at first. By about 3rd grade, the gain is gone. But losing the test gain doesn’t mean kids got nothing from a good start. For example, kids who don’t repeat a grade may go further in school later. Head Start may also build habits and character that last."},
 {x:"Both the Carolina Abecedarian Project and Perry Preschool intervention were [[funded at higher levels|given more money|richer]] than Head Start. For example, in 1998 it cost slightly over $5,000 to keep a child in a part-day Head Start program for 34 weeks a year. The two-year, part-day Perry Preschool intervention cost nearly $13,000 per child. Thus, the results of these programs probably provide an [[upper limit|best possible result|best case]] on what one could reasonably expect from Head Start. These two programs also involved small, [[localized|in one place|local]] interventions, and thus their findings may not [[generalize|apply everywhere|apply elsewhere]].",gs:"The famous programs got much more money per child than Head Start. Head Start cost about $5,000 per child per year. Perry cost about $13,000 per child. So those programs show the best possible result, not what Head Start can do. They were also small and local, so their results may not apply everywhere."},
 {h:"[Results]",x:"We find that, for whites, participation in Head Start is associated with a significantly increased [[probability|chance|chance]] of completing high school and attending college as well as [[elevated earnings|higher pay|more money]] in one’s early twenties. We find that the long-term benefits of Head Start are even greater for whites in this group: those who attended Head Start are nearly 30 percent more likely to have completed high school than their siblings. These children are 28 percent more likely to attend college than siblings who attended no preschool and nearly 20 percent more likely than those who attended other preschools.",gs:"White kids who went to Head Start were more likely to finish high school and go to college, and maybe earn more in their early 20s. For the poorest white families, Head Start kids were almost 30% more likely to finish high school than their siblings. They were also 28% more likely to go to college than siblings with no preschool."},
 {x:"In contrast to the results for [[educational attainment|how far people got in school|schooling]], this estimate appears to be [[driven by|coming from|from]] African-Americans. African-American children who attended Head Start are 12 percentage points less likely to report being [[booked or charged|arrested or charged|arrested]] than siblings who did not. Reynolds et al. report a similar gap between treatments and controls in [[juvenile|young people’s|kids’]] and violent crime rates among poor black children who participated in the Chicago CPC study.",gs:"The crime result is different: it shows up for Black participants. Black adults who went to Head Start were 12 points less likely to have been charged with a crime than their siblings. Another study in Chicago found the same kind of gap."},
 {h:"V. Conclusions",x:"Very little is known about the longer-term effects of participation in Head Start, although previous research showing “fade-out” in effects on test scores raises [[legitimate|fair|fair]] questions about whether early gains [[translate into|turn into|become]] benefits later in life. Finally, we find some evidence suggesting that there are [[positive spillovers|good effects that spread|help that spreads|spillover]] from older children who attended Head Start to their younger siblings, particularly with regard to [[brushes with the law|trouble with the police|police trouble]]. We have sought to carefully describe the limitations as well as the strengths of our study sample and methods. With those limitations in mind, we conclude that the results are supportive of the view that Head Start participants gain social and economic benefits that [[persist|last|last]] into adulthood.",gs:"Before this study, we knew little about Head Start’s long-term effects, and the fading test scores made people doubt them. Older siblings who went to Head Start may also help their younger brothers and sisters stay out of trouble. The study has limits. But its answer is: yes, Head Start’s benefits last into adult life."}]};

 {id:"hs1",t:"The question",paras:[0, 1, 2],look:"What do critics say about Head Start, and what new data do the authors have?",logic:{"q": "Why do the authors say evidence from Perry Preschool can’t settle the Head Start question?", "o": ["Because Perry happened in another country", "Because Perry was a small, much richer and higher-quality program that “bears little resemblance” to Head Start", "Because Perry never followed children as adults"], "a": 1, "why": "Perry and Abecedarian cost far more per child and were small local programs, so their results are an upper limit, not proof that ordinary Head Start works."},keys:[["Head Start is a big public preschool program for poor children",/head start|preschool|poor|public/i],["Critics: test-score gains fade out, no proof of long-term benefits",/fade|critic|short-term|no evidence|last/i],["Other programs like Perry are different and more expensive",/perry|abecedarian|different|expensive|cost/i],["New data: PSID asked adults about Head Start; compares siblings",/psid|survey|adult|sibling|brother|sister/i]],model:"Head Start is a big government preschool for poor kids. Critics say its test-score gains fade out and there’s no proof of lasting benefits; famous programs like Perry were smaller and richer, so they don’t prove much about Head Start. This study uses a long survey of families to compare adults who went to Head Start with their own brothers and sisters who didn’t."},
 {id:"hs2",t:"How to compare fairly",paras:[3, 4, 5],look:"Why compare a child with their own brother or sister?",logic:{"q": "What is the main advantage of comparing siblings?", "o": ["Siblings always go to the same preschool", "Siblings share the same family background, so differences between them are less likely caused by family", "Siblings are easier to find in surveys"], "a": 1, "why": "If one sibling went to Head Start and the other didn’t, family things like parents and home are the same for both. So a difference in adult life is more likely due to Head Start."},keys:[["Compare siblings: one went to Head Start, one did not",/sibling|brother|sister/i],["Siblings share family background, so it is controlled",/family|background|same|share|parent/i],["Other famous programs were richer and higher quality; their results are an upper limit",/perry|abecedarian|upper|expensive|quality|cost/i],["Fade-out of test scores does not mean no benefit (grade repetition, special education, character)",/fade|repeat|special education|noncognitive|character|right foot/i]],model:"The authors compare brothers and sisters: one went to Head Start, one didn’t. Because siblings share parents and home, differences between them are more likely due to Head Start. They also argue that fading test scores don’t prove Head Start fails, and that richer programs like Perry only show the best case."},
 {id:"hs3",t:"What they found",paras:[6, 7, 8],look:"Who gained what from Head Start as adults?",logic:{"q": "The results differ by group. Which statement matches the findings?", "o": ["Head Start helped every group in the same way", "White participants were more likely to finish high school and go to college; Black participants were less likely to be charged with a crime", "Head Start made no difference for anyone after age 18"], "a": 1, "why": "Gains in schooling were driven by whites; the crime result was driven by African-Americans. The benefits were real but different for different groups."},keys:[["Whites: more likely to finish high school and attend college (than siblings)",/white|high school|college/i],["African-Americans: less likely to be booked or charged with a crime",/black|african|crime|booked|charged/i],["Spillovers to younger siblings",/spill|younger|sibling/i],["Conclusion: benefits last into adulthood",/adult|last|persist|long-term/i]],model:"White adults who went to Head Start were more likely than their own siblings to finish high school and go to college. Black adults who went were less likely to be charged with a crime. Some benefits even spilled over to younger siblings. So Head Start’s benefits seem to last into adulthood."}];
CARDS["sieve"]={word:"sieve",pos:"noun",rar:"rare",def:"A tool with tiny holes that lets some things through and keeps others out, like a strainer.",zh:"筛子",ex:"…formal education has been less of a ladder than a “social sieve”…",parts:"Used in kitchens to sort flour from lumps. Here it sorts people into different jobs and lives.",ladder:["strainer", "sorter", "something that lets some through", "sieve"]};

CARDS["stratify"]={word:"stratification",pos:"noun",rar:"legendary",def:"Sorting people into higher and lower levels in a society, like layers of rock.",zh:"社会分层",ex:"Sociologists long have recognized that schooling is central to stratification in modern societies…",parts:"stratum = a layer (of rock). Society gets sorted into layers.",ladder:["ranking", "sorting into levels", "layers of rich and poor", "stratification"]};
CARDS["mobility"]={word:"social mobility",pos:"noun phrase",rar:"rare",def:"Moving up (or down) to a different level in society than the family you were born into.",zh:"社会流动",ex:"The notion that formal education might serve as a meritocratic mechanism of social mobility…",parts:"mobile = able to move. Social mobility = moving between levels of society.",ladder:["moving up", "changing your place", "moving between rich and poor", "social mobility"]};
CARDS["merit"]={word:"meritocratic",pos:"adjective",rar:"legendary",def:"Giving rewards based on how good or hard-working you are, not on who your family is.",zh:"精英制的、任人唯贤的",ex:"The notion that formal education might serve as a meritocratic mechanism of social mobility…",parts:"merit (what you deserve) + -cracy (rule): rule by what people earn.",ladder:["fair by effort", "rewards for skill", "earned, not inherited", "meritocratic"]};
CARDS["hub"]={word:"hub",pos:"noun",rar:"common",def:"The center that many lines connect to, like an airport where many flights meet.",zh:"枢纽",ex:"We propose that higher education is a hub connecting some of the most prominent institutional sectors of modern societies…",parts:"A wheel’s hub is the middle part where all the spokes meet.",ladder:["center", "meeting point", "place where many lines meet", "hub"]};
CARDS["credential"]={word:"credential",pos:"noun",rar:"rare",def:"A paper or title that proves you finished something, like a diploma or degree.",zh:"资质证书、文凭",ex:"…the presumption that higher education is primarily a credentialing system…",parts:"Same root as “credit” and “credible”: something that makes people believe you.",ladder:["a diploma", "proof you finished", "paper that opens doors", "credential"]};

TEXTS["hied"]={id:"hied",genre:"Sociology review paper",short:"College",gcol:"--accent",src:"Annual Review of Sociology · 2008 · 25 pages",title:"[[Sieve|Sorter|Strainer|sieve]], [[Incubator|Growing Place|Nest]], [[Temple|Holy Place|Temple]], [[Hub|Center|Center|hub]]: [[Empirical|Research-Based|Research]] and [[Theoretical|Idea|Idea]] Advances in the Sociology of [[Higher Education|College|College]]",by:"Mitchell L. Stevens, Elizabeth A. Armstrong, and Richard Arum",note:"Selected sections in the authors’ own words, lightly trimmed (citations removed). Headings are the authors’ unless in [brackets].",paras:[
 {h:"Introduction",x:"There may be no [[institution|big organization in society|big organization]] more [[fundamental|basic and important|important]] to sociology than higher education. Most sociologists are employed at colleges and universities. Yet higher education remains without an [[intellectually coherent|clear and connected|joined-up]] sociology. Instead, the varied and [[empirically rich|full of real data|data-rich]] sociological work on higher education is scattered throughout the field. Our review moves to [[redress|fix|fix]] this situation by [[integrating|bringing together|joining]] the diverse sociological scholarship on higher education.",gs:"Colleges matter a lot to sociology. Most sociologists work at colleges! But there is no clear, joined-up sociology of college. The research on college is spread out in many places. This paper tries to fix that by bringing the research together."},
 {x:"We identify some of the central [[metaphors|picture comparisons|pictures|metaphor]] sociologists have [[invoked|used|used]] or implied when describing higher education, explaining that sociologists have conceived of higher education systems as sieves for regulating the mobility processes underlying the [[allocation of privileged positions|handing out of good positions|giving out top spots]] in the society, incubators for the development of [[competent social actors|capable grown-ups|capable adults]], and temples for the [[legitimation|making official|approving|legit]] of official knowledge. The [[peculiar|unusual|special]] location of higher education at the intersection of multiple institutions encourages us to argue that higher education should also be seen as a hub, connecting multiple social processes that often are regarded as distinct.",gs:"Researchers have pictured college in three ways: a sieve that decides who gets good positions, an incubator that grows capable young adults, and a temple that makes knowledge official. The authors add a fourth picture: a hub, where many parts of society meet."},
 {x:"We use these metaphors as [[heuristic devices|thinking tools|tools]], recognizing that each has its limits. Metaphors, by definition, are imaginative interpretations and summaries of reality; their job is to [[illuminate|light up|show]] features of a phenomenon that more [[mundane|ordinary|plain]] descriptions would not reveal. Because our intent is to spur novel analytic paths through a substantive field that many may think already well traveled, the use of [[provocative|thought-provoking|bold]] if perhaps imperfect imagery seems justified.",gs:"These pictures are thinking tools, and each one has limits. A {{metaphor|metaphor}} is a creative way to describe something. It can show things that plain words would miss. The authors want fresh ideas in an old field, so bold pictures are worth it, even if they aren’t perfect."},
 {h:"Sieve: higher education and social stratification",x:"Sociologists long have recognized that schooling is central to [[stratification|sorting into higher and lower levels|ranking|stratify]] in modern societies, as the allocation of [[occupational positions|jobs|jobs]] is done largely on the basis of [[educational attainment|how much schooling you finish|schooling]]. The notion that formal education might serve as a [[meritocratic mechanism|fair way to reward effort|fair system|merit]] of [[social mobility|moving up in society|moving up|mobility]] has been an animating ideal for many social scientists and social reformers for over a century. Nevertheless formal education has been less of a ladder than a “social sieve,” regulating access to privileged social positions. Max Weber’s core insight that education has a [[dual character|two sides|two sides]]—both [[facilitating and constraining|helping and limiting|helping and blocking]] social opportunity—has informed most subsequent stratification scholarship.",gs:"School decides a lot about who ends up higher or lower in society, because jobs go to people with more schooling. For 100 years, people hoped school would be fair: work hard and you move up. But school works less like a ladder and more like a {{sieve|sieve}}: it lets some people through to the top and keeps others out. An old idea: school both opens doors and closes them."},
 {x:"Blau & Duncan demonstrated that for the [[cohort|group of people born around the same time|age group]] they examined in the United States, [[occupational destinations|the jobs people end up in|final jobs]] were strongly associated with educational attainment but that this attainment itself was greatly, though not entirely, determined by family background. Subsequent research has repeatedly demonstrated that [[socioeconomic background|family’s money and education|family wealth]] predicts college entrance and completion, [[holding other factors constant|when everything else is the same|all else equal]]. The role of social background in predicting college admission has generated an [[enduring|long-lasting|long]] discussion about the fairness of college admissions.",gs:"A famous study found that your job depends on your schooling. But your schooling depends a lot on your family. Study after study shows that family money and schooling predict who goes to college and who finishes. So people keep arguing about whether college admissions are fair."},
 {x:"For example, community college degrees have benefits relative to high school diplomas but, perhaps not surprisingly, lower [[labor market returns|pay at work|pay]] than four-year degrees. Differences among four-year colleges such as [[admissions selectivity|how hard it is to get in|how picky]], however, have only relatively small effects on adult earnings relative to attending other four-year colleges. The notable exception occurs at the very most selective, elite U.S. colleges, which serve a [[demonstrable|clearly shown|clear]] mobility function for nonwhite students. In the most general terms, however, completion of any four-year degree is likely a [[watershed event|turning point|turning point]] in individual biographies.",gs:"A two-year college degree helps more than a high school diploma, but less than a four-year degree. Surprise: going to a hard-to-get-into college instead of an ordinary one changes pay only a little. Except at the very top colleges, which really help students of color move up. Overall, finishing any four-year degree is a turning point in a person’s life."},
 {h:"Incubator: investigating the experiential core of college life",x:"Stratification scholars have shown that higher education is associated not only with occupational attainment and [[marital outcomes|marriage results|marriage]], but also with other outcomes of interest, for example health, happiness, sociopolitical attitudes, [[civic participation|taking part in community life|voting and helping]], [[cosmopolitanism|feeling at home in the wider world|worldliness]], cultural taste, and [[social capital|useful connections with people|who you know]]. However they have attended less to how the process of moving through college contributes to these outcomes. In general, though, sociologists have attended much more carefully to the lived experiences of students in elementary and secondary schools than they have to those in college. This is a [[significant oversight|big thing that was missed|big miss]], leaving us with an incomplete understanding of just how college attendance impacts so many arenas of life.",gs:"College is linked to better jobs and marriages, and also to health, happiness, voting, culture and who you know. But researchers haven’t looked much at how college life causes these things. They studied kids in elementary and high school much more than college students. That’s a big miss: we don’t fully know how college changes so many parts of life."},
 {x:"Colleges and universities are [[quintessentially|perfectly, at heart|truly]] social places, shaping the number, quality, and type of [[social ties|connections with people|connections]] that particular individuals and groups enjoy. We know that the number and kind of ties students build while in college are associated with patterns of academic achievement and degree completion. These ties may have [[myriad|many|many]] lifelong consequences, as people often find jobs, marriage partners, medical care, homes, and schools for their children through people they know. Classic studies of U.S. higher education suggest that colleges and universities, especially elite ones, are important sites for the [[coalescence|coming together|forming]] of privileged identities, group boundaries, and social networks—in a word, incubators for young adults and the relationships that [[solidify|make solid|firm up]] and divide them into groups.",gs:"Colleges are social places. They shape how many friends and connections you have, and what kind. The friends you make in college are linked to your grades and whether you finish. These ties matter for life: people find jobs, partners, doctors, homes and schools through people they know. So colleges, especially top ones, are “incubators”: warm places where young adults grow, form groups, and get sorted."},
 {h:"Temple: higher education and the legitimation of knowledge",x:"For Talcott Parsons, the primary purpose of higher education was to preserve, promote, and [[inculcate|teach by repeating|drill in]] the modern “cognitive complex,” a rational, [[universalistic|the same for everyone|universal]] mode of thinking. In this approach formal education not only [[certifies|officially approves|approves]] social capacities, it produces a distinctive kind of social actor: the legally and normatively [[autonomous|free to decide for oneself|free]], rights-bearing, rationally cognizant citizen of Enlightenment modernity. Because this production process entails the formal organization of knowledge into curriculum, it also defines what counts as [[legitimate knowledge|knowledge that officially counts|real knowledge]]. As the organizational instantiation of intellectual progress, the university is the [[secular|not religious|non-religious]] temple of modern societies.",gs:"One sociologist said college’s main job is to teach a modern, logical way of thinking. Others said school doesn’t just give out diplomas. It makes a kind of person: a free, thinking citizen with rights. And by choosing what to teach, school decides what counts as real knowledge. So the university is like a temple for modern society, but for knowledge, not religion."},
 {h:"Hub: higher education and the structuration of modern societies",x:"We propose that higher education is a hub connecting some of the most [[prominent institutional sectors|big parts of society|big parts]] of modern societies: the labor market and the larger economy, the professions and the sciences, the [[philanthropic sector|charities|charities]], the family, and the [[nation-state|country and its government|government]]. This structural arrangement is historically specific and [[cross-nationally variable|different from country to country|different by country]], but in certain times and places, higher education systems are key sites where institutions intersect. Over the course of 50 years and through the massive financial [[largesse|generous giving|generous money]] of state and federal governments, U.S. universities became virtually [[unavoidable passageways|doors you must go through|must-go doors]] into the upper middle class and [[central nodes|main meeting points|centers]] in the professional networks of literally all fields of expert knowledge and practice.",gs:"The authors’ big idea: college is a {{hub|hub}} that connects jobs and the economy, science, charities, families and the government. This isn’t true everywhere or always, but in some times and places, college is where these parts of society meet. Over 50 years, with lots of government money, U.S. colleges became almost the only door into the upper middle class, and the center of every expert field."},
 {h:"Conclusion",x:"First, the [[presumption|assumption|guess]] that higher education does its work on individuals should not lead us to ignore the fact that people experience schooling as a thick web of relationships. Students are also nodes in networks that supply them with much of what they need to get through school: money, advice, friendship, [[emotional nurturance|care and support|care]], and information. Second, the presumption that higher education is primarily a [[credentialing system|system for giving out diplomas|diploma machine|credential]] should not limit our consideration of other significant aspects of schooling. Ultimately our guiding image of the hub is not merely a [[rhetorical device|nice way of saying it|figure of speech]] but a theory about the sociological significance of universities: They are central to the [[infrastructure of modernity|basic structure of modern life|backbone of modern life]], connecting modern societies’ major institutions even while they remain officially independent and [[intermittently|from time to time|sometimes]] critical of them.",gs:"First, college isn’t only about single people. Students live in a thick web of relationships. Those webs give them money, advice, friends, care and information to get through school. Second, college does more than hand out degrees. In the end, “hub” is more than a nice picture. It is the authors’ theory: colleges hold modern society together, even while they stay independent and sometimes criticize it."}]};
