STRUCT["idp"]={"0": [["Plan", "In this article we present a synthesis and overview of the literature on identity development during childhood and adolescence for ethnic and racial minority groups in the United States."], ["Point", "The establishment of identity is a major developmental task for all adolescents."], ["Reason", "As a psychosocial task, striving for a sense of unification and cohesiveness in the self provides meaning, direction, and purpose."]], "1": [["Claim", "{While} identity development is a complex task for all youths, it is particularly complicated for children and adolescents belonging to ethnic and racial minority groups in the United States."], ["Reason", "{Specifically}, the complexity of identity formation may increase as a function of color, behavioral distinctions, language differences, physical features, and long-standing, although frequently unaddressed, social stereotypes."], ["Example", "{For example}, the issue of color may be more salient for African Americans and American Indians than it is for other minority groups."]], "2": [["Definition", "As a term, ethnicity refers to a characteristic of shared unique cultural traditions and a heritage that persists across generations."], ["Contrast", "It is not identical to race. Race and ethnicity may overlap, as seen with African Americans and Chinese Americans."], ["Example", "{In addition}, Hispanics are distinguished by their shared language (Spanish) {although} they may differ by race."], ["Point", "Ethnic group membership accords the individual a cultural identity, a sense of belonging and group pride, and a set of prescribed norms, values, and social behaviors."]], "3": [["Method", "A commonly used procedure in studying ethnic and racial identification, preference, and attitudes is to present a child with dolls and pictures that are representative of his or her own group and of the majority group."], ["Method", "Using this procedure, questions were posed to subjects related to their preferences toward and identification with the different dolls."], ["Finding", "Taken together, these studies show that preschool and young school-age children demonstrate a white bias."], ["Problem", "These findings are disturbing; however, certain qualifiers are required."]], "4": [["Common view", "Black children’s tendency to misidentify has been viewed as supporting assumptions of personal disorganization."], ["Turn", "{However}, empirical findings for both attitude/preference and self-concept suggest the presence of positive self-esteem and pro-white attitudes/preferences."], ["Main idea", "We believe that African American children’s pro-white racial attitude and preference patterns appear to represent cultural-ecological variables (i.e., negative social stereotypes about blacks) and not psychological characteristics."]], "5": [["Finding", "Beuf reports that around age 10, American Indian children begin to show a greater preference toward and identification with their own group."], ["Finding", "A parallel pattern of own-group preference has been described for older (ages 10 and 12) African American children."], ["Reason", "Such advances in cognitive skills are perhaps reflected in a more realistic assessment of oneself and one’s group."]], "6": [["Background", "Identity formation has been regarded by Erikson as the fifth stage in psychosocial development."], ["Term", "Marcia provides a model useful in such research. He conceives of identity as four “statuses” (achievement, moratorium, foreclosure, and diffusion)."], ["Definition", "Identity achievement is characterized by exploration of and commitment to an identity; moratorium status exists when the individual, having explored an identity, remains uncommitted to one; foreclosed status refers to prematurely closed off exploration; and diffused status is an inability to reconsolidate the ego."]], "7": [["Finding", "It has been reported in these studies that minority adolescents tend to score higher in foreclosure than white adolescents."], ["Reason", "Exploration is a key ingredient for identity-formation processes."], ["Reason", "Minority youth are faced with an assumed consciousness of prejudicial attitudes and discriminatory practices of the majority group."], ["Result", "The overall effect may be one of discouragement from involvement with those outside of one’s own reference group and/or a subsequent diminished level of exploration."]], "8": [["Other side", "An alternative explanation to the above results is that some minority groups, by certain preferences in life-style, migration, or acculturation rates, may foster greater foreclosure."], ["Claim", "{Further}, foreclosure may be an adaptive identity status for these youths (in the short run)."], ["Example", "{For example}, American Indian adolescents reared on reservations, where the adherence to cultural norms is encouraged and exploration discouraged, might, quite adaptively, hold a foreclosed identity."], ["Conclusion", "The point is that exploration of identity may not be desirable for such youth when social and ideological roles are clearly defined by the community."]], "9": [["Finding", "Phinney and Tarver examined the processes of search and commitment in ethnic identity among 24 black and 24 white, middle-class eighth graders."], ["Finding", "{While} no significant differences were found between the two groups, there was evidence that ethnic identity begins to form as early as the eighth grade."], ["Finding", "{However}, a qualitative analysis of the transcribed interviews revealed that blacks had a better understanding of prejudice and had greater understanding of their own culture than did whites."], ["Reason", "The researchers argue that the experience of prejudice might foster the need for greater understanding of one’s culture."]], "10": [["Claim", "Ramirez and Castaneda identify the melting-pot philosophy as a major barrier against minority group members adopting an adaptive ethnic identity."], ["Explains", "The historical argument of this philosophy was that by the conglomeration of all races in the United States, a new, superior race would be formed."], ["Turn", "The melting pot has not come to be, yet the approach taken by many educators toward minority children is that such a reality exists."], ["Result", "{Thus}, Ramirez and Castaneda argue that for Mexican American children, the values presented at school are in direct conflict with those presented at home."], ["Main idea", "Ramirez and Castaneda state that, ideally, children should be allowed to develop a bicultural identity that consists of a dual identification."]], "11": [["Claim", "Another barrier to identity formation may come from within the family."], ["Explains", "Too often minority status parents may not discuss ethnic or racial issues with their children since the adults themselves remain uncomfortable with these issues having to do with either race or ethnicity."], ["Evidence", "Research studies suggest a general reluctance by African American parents to broach the issue of race unless the subject is raised first by their children since many parents assume that the 1960s took care of the significant issues."], ["Result", "It is argued that this reluctance may reflect a defensive strategy on the part of the parents that leaves their children exposed to the continuing problem of racial intolerance, albeit expressed in subtle forms."]], "12": [["Conclusion", "Several factors thus complicate the task of identity formation among minority youth."], ["List", "The value conflicts that exist between cultures, the lack of identity-achieved adult role models, and the lack of culture-focused specific guidance from the family represent ongoing issues."], ["Point", "The preponderance of negative stereotypes about minorities in general is also counterproductive to acquiring a solid sense of self."], ["Problem", "One difficulty is that most instruments are administered in English, which is a major problem for minorities for whom English is a second language."]]};GSENT["idp"]={"0": ["This paper sums up what research says about how minority kids in the U.S. build their sense of who they are.", "Every teen has a big job: figuring out who they are.", "Feeling like one whole person gives you meaning, direction and a reason to keep going."], "1": ["Building an identity is hard for everyone. It is even harder for {{minority|minority}} kids.", "Why? Skin color, different ways of acting, a different language, looks, and old stereotypes nobody talks about.", "For example, skin color may matter more for Black and Native American kids."], "2": ["{{Ethnicity|ethnicity}} means sharing a culture and traditions that are passed down for generations.", "It is not the same as race, but the two can overlap.", "For example, Hispanic people share Spanish, but they can be of different races.", "Being part of an ethnic group gives you a culture, a place to belong, pride, and rules for how to act."], "3": ["A common test: show a child dolls or pictures of their own group and of the main group.", "Then ask: which doll do you like? Which one looks like you?", "Most young children picked the white dolls more.", "That is upsetting, but there is more to the story."], "4": ["People thought it meant Black kids felt bad or mixed up about themselves.", "But studies found the same kids liked themselves just fine, while still picking white.", "The authors think the kids were showing what society taught them, its stereotypes, not something wrong inside them."], "5": ["Around age 10, Native American kids started to choose their own group more.", "Black kids aged 10 to 12 showed the same change.", "As kids think in more grown-up ways, they see themselves and their group more truly."], "6": ["The psychologist Erikson said building an identity is the 5th big stage of growing up.", "Another scientist, Marcia, named four ways teens can be on the path to finding who they are.", "Achievement: you explored, then chose. Moratorium: you’re still exploring. Foreclosure: you chose without exploring. Diffusion: you’re stuck and haven’t chosen."], "7": ["Studies found that minority teens “close the door” early more often than white teens.", "Exploring is a key part of finding who you are.", "But minority teens know that some people are prejudiced against them.", "So they may stay away from outside groups and explore less."], "8": ["Another reason: some groups simply expect their kids to follow the group’s way of life.", "And “closing the door” early may actually help these teens, at least for now.", "For example, Native teens on reservations, where keeping traditions is valued, may do well by sticking with them.", "So exploring isn’t always the best thing, when the community already gives clear roles."], "9": ["Two researchers interviewed 48 Black and white 8th graders about their ethnic identity.", "Both groups were similar, and ethnic identity was already forming by 8th grade.", "But Black students understood prejudice and their own culture better.", "Maybe facing prejudice makes you want to understand your culture more."], "10": ["Some researchers say the {{melting-pot|meltpot}} idea gets in the way of a healthy ethnic identity.", "The idea was that all groups would mix into one new, “better” people.", "That never happened, but many teachers act as if it did.", "So Mexican American kids hear one set of values at school and another at home.", "It would be better to let kids belong to both cultures at once."], "11": ["Another problem can come from home.", "Some parents don’t talk about race with their kids, because it makes the parents uncomfortable too.", "Many Black parents wait for their kids to bring it up, thinking the 1960s fixed the big problems.", "But staying quiet can leave kids unready for racism that still happens in quieter ways."], "12": ["So many things make building an identity harder for minority kids.", "Clashing values, too few grown-ups to look up to, and too little talk about culture at home.", "And so many negative stereotypes make a strong sense of self harder to build.", "Even the research has problems: most tests are in English, which is hard for kids who speak another language first."]};ROLE["idp"]={"0": ["big", "states why identity matters for every teen"], "1": ["claim", "the claim: it is harder for minority kids"], "2": ["definition", "defines ethnicity and how it differs from race"], "3": ["method", "describes the classic doll studies"], "4": ["claim", "reinterprets the results: knowledge, not self-hatred"], "5": ["finding", "shows the pattern changes as kids grow"], "6": ["term", "explains identity “statuses”"], "7": ["finding", "reports that minority teens show more foreclosure"], "8": ["counter", "gives the other side: foreclosure can help"], "9": ["finding", "ethnic identity grows by eighth grade"], "10": ["counter", "first barrier: the melting-pot idea"], "11": ["reason", "second barrier: silence at home"], "12": ["conclusion", "sums up the barriers, then a problem with the research itself"]};
SEC["idp"]=[
 {id:"ip1",t:"Why it can be harder",paras:[0, 1, 2],look:"Why is building an identity more complicated for minority kids?",logic:{"q": "Why do the authors separate “ethnicity” from “race”?", "o": ["Because they mean exactly the same thing", "Because ethnicity is about shared culture and heritage, which can overlap with race but isn’t the same", "Because only some people have a race"], "a": 1, "why": "They say ethnicity “is not identical to race”: Hispanics share a language but may differ by race. Clear definitions matter because the terms are “often erroneously treated as synonyms.”"},keys:[["All teens must build an identity; it gives meaning and direction",/all|every|teen|adolescen|meaning|direction|purpose/i],["It is harder for minority kids: color, language, stereotypes",/color|colour|language|stereotype|harder|complicated/i],["Ethnicity = shared culture and heritage; not the same as race",/ethnic|culture|heritage|tradition|not (the same as|identical)|race/i]],model:"Every teen has to work out who they are, which gives life meaning and direction. For minority kids it’s more complicated, because of skin color, language and stereotypes. The authors also explain that ethnicity means shared culture and heritage, and it is not the same thing as race."},
 {id:"ip2",t:"Young children and the doll tests",paras:[3, 4, 5],look:"What did young children choose in the doll studies, and what does it mean?",logic:{"q": "Young minority children often preferred white dolls. What do the authors conclude from this?", "o": ["That the children hated themselves", "That the children were showing what they had learned about society’s stereotypes, not low self-esteem", "That the tests were fair and needed no changes"], "a": 1, "why": "Many of the same children had high self-esteem. So the authors say the pro-white choices reflect “negative social stereotypes about blacks,” not something wrong inside the child."},keys:[["Doll/picture tests: young minority children showed a white bias",/doll|picture|white|bias|prefer/i],["This is not self-hatred; kids with this bias still had high self-esteem",/self-esteem|not self|hate|rejection/i],["It reflects society’s stereotypes (cultural-ecological), not psychology",/society|stereotype|culture|environment|learn/i],["Around age 10, kids prefer their own group more",/10|ten|own group|older/i]],model:"In doll and picture tests, young minority children often chose white dolls as “better.” The authors argue this doesn’t mean they disliked themselves: many had high self-esteem. The children were reporting what they had learned from society’s stereotypes, and around age 10 they began to prefer their own group more."},
 {id:"ip3",t:"Teens: exploring or closing the door",paras:[6, 7, 8, 9],look:"What is “foreclosure,” and why might minority teens show more of it?",logic:{"q": "The authors give an “alternative explanation” for why minority teens score higher on foreclosure. What is it?", "o": ["Minority teens are less smart", "In some communities, sticking with the community’s set roles may actually help a teen, so foreclosure can be an adaptive choice", "Foreclosure scores are always wrong"], "a": 1, "why": "They say foreclosure may be “an adaptive identity status” where roles are clearly defined, and it can bring recognition and well-being, so it isn’t automatically bad."},keys:[["Marcia’s four statuses: achievement, moratorium, foreclosure, diffusion",/achievement|moratorium|foreclos|diffus|status/i],["Minority teens score higher on foreclosure",/foreclos|higher|minority/i],["Possible reasons: stereotypes, prejudice, fewer chances to explore",/prejud|stereotyp|explor|opportunit|discourag/i],["Or foreclosure may be adaptive in some communities",/adaptive|communit|belong|reservation|help/i]],model:"Psychologist Marcia described four identity “statuses,” and foreclosure means deciding who you are without exploring. Studies found more foreclosure in minority teens. One reason may be prejudice and fewer chances to explore, but the authors add that in some close communities, foreclosure can actually help a teen belong."},
 {id:"ip4",t:"Barriers",paras:[10, 11, 12],look:"What makes it harder for minority kids to build a strong identity?",logic:{"q": "Why do the authors call the melting-pot idea a “barrier”?", "o": ["Because it makes everyone learn Spanish", "Because when school values clash with home values, children may feel they must give up one culture", "Because it is only about food"], "a": 1, "why": "School teaches one “superior” culture while home teaches another, so Mexican American children face a conflict instead of a bicultural identity."},keys:[["Melting-pot: school values clash with home values; bicultural identity is better",/melting|school|home|bicultural|conflict|clash/i],["Parents may avoid talking about race",/parent|talk|race|discuss/i],["Tests are often in English and normed on white middle-class kids",/english|test|instrument|bias|anglo|middle-class/i],["Many factors: value conflicts, few role models, too many negative stereotypes",/role model|value|negative|stereotype|several/i]],model:"The melting-pot idea makes kids choose between school culture and home culture, when a bicultural identity would be healthier. Some parents avoid talking about race, which leaves kids unprepared. Research tests are often in English and built for white middle-class kids. Together, value clashes, few role models and negative stereotypes make a strong identity harder."}];
CARDS["ecosys"]={word:"ecological systems theory",pos:"noun phrase",rar:"rare",def:"Bronfenbrenner’s idea that a child grows up inside many “worlds” (family, school, city, culture) that all shape them.",zh:"生态系统理论",ex:"Bronfenbrenner’s ecological systems theory (EST) is among the most widely adopted theoretical frameworks…",parts:"ecology (how living things fit their surroundings) + systems (parts that work together). It treats a child like a plant in its environment.",ladder:["your worlds", "the worlds around a child", "layers that shape a child", "ecological systems theory"]};
CARDS["nested"]={word:"nested",pos:"adjective",rar:"common",def:"Fitting one inside another, like a set of boxes or Russian dolls.",zh:"嵌套的",ex:"…different levels of ecological systems are viewed as nested within one another.",parts:"From “nest”: a bird’s nest holds eggs inside it. Nested things sit inside each other.",ladder:["in boxes", "one inside another", "layered inside", "nested"]};
CARDS["networked"]={word:"networked",pos:"adjective",rar:"rare",def:"Joined by links between people, like a web, instead of stacked inside each other.",zh:"网络化的、相互连接的",ex:"…ecological systems should be conceptualized as networked…",parts:"net (a web of knots and strings) + work. Each knot is a person, each string a relationship.",ladder:["linked", "joined like a web", "connected by people", "networked"]};
CARDS["microsys"]={word:"microsystem",pos:"noun",rar:"rare",def:"A small group of people the child talks with directly, like family or class.",zh:"微系统",ex:"…a microsystem is a setting—or set of people engaged in social interaction—that includes the focal individual.",parts:"micro (very small) + system. The smallest world, the one you are inside.",ladder:["my group", "a group I’m in", "a small world around me", "microsystem"]};
CARDS["mesosys"]={word:"mesosystem",pos:"noun",rar:"legendary",def:"A link between two of the child’s groups, like a parent talking with a teacher.",zh:"中间系统",ex:"…a mesosystem is a social interaction between participants in different settings that both include the focal individual.",parts:"meso (middle) + system. It sits in the middle, between two of your worlds.",ladder:["a bridge", "a link between my groups", "a connection between two of my worlds", "mesosystem"]};
CARDS["exosys"]={word:"exosystem",pos:"noun",rar:"legendary",def:"A group the child is not in, but that still affects the child, like the city council.",zh:"外系统",ex:"…an exosystem is a setting… that does not include, but whose participants interact directly or indirectly with, the focal individual.",parts:"exo (outside) + system. A world outside you that still reaches you.",ladder:["an outside group", "a group I’m not in", "a world that affects me from outside", "exosystem"]};
CARDS["setting"]={word:"setting",pos:"noun",rar:"common",def:"In this paper: a group of people who interact with each other (not just a place).",zh:"情境、场域（一群互动的人）",ex:"…a setting is a set of people engaged in social interaction…",parts:"Usually a setting means a place, like a story’s setting. The authors change it to mean people.",ladder:["a place", "where things happen", "a group that interacts", "setting"]};
CARDS["focal"]={word:"focal individual",pos:"noun phrase",rar:"rare",def:"The one person you are looking at, the person in the middle of the picture.",zh:"焦点个体",ex:"…with the focal individual represented by the shaded circle in the center.",parts:"focal (from “focus”) + individual (one person). The person your camera is focused on.",ladder:["main person", "the person we look at", "the person in focus", "focal individual"]};
TEXTS["nest"]={id:"nest",genre:"Psychology theory paper",short:"Networked",gcol:"--l2",src:"Social Development · 2013 · 16 pages",title:"[[Nested|Inside Each Other|Like Boxes in Boxes]] or [[Networked|Connected|Linked Up]]? Future Directions for [[Ecological Systems Theory|the Theory of a Child’s Worlds|the Worlds-Around-You Theory|ecosys]]",by:"Jennifer Watling Neal and Zachary P. Neal",note:"Selected sections in the authors’ own words, lightly trimmed (citations removed). Headings in [brackets] are ours.",paras:[
 {h:"[The big question]",x:"Although EST is widely recognized for underscoring the importance of interdependent and multilevel systems on individual development, the precise relationships of systems to one another remain [[elusive|hard to pin down|unclear]]. Bronfenbrenner originally described ecological systems at different levels as nested within one another, giving rise to EST’s classic graphic portrayal as a set of [[concentric circles|circles inside circles|circles in circles]]. However, in this article, we argue that conceptualizing ecological systems as nested [[obscures|hides|hides]] the relationships between them. Instead, we argue that ecological systems should be conceptualized as [[networked|connected like a web|linked|networked]], where each system is defined in terms of the social relationships surrounding a [[focal individual|the person in the middle|one child|focal]].",gs:"Everyone agrees that a child’s many worlds matter. But nobody is sure exactly how these worlds connect. Bronfenbrenner said the worlds sit {{inside each other|nested}}, so people draw them as circles inside circles. But these authors say the circle picture hides how the worlds really connect. They want a new picture: a {{web of people|networked}} around one child."},
 {h:"Ecological systems as nested: the traditional model",x:"Bronfenbrenner described the [[topology|shape|shape]] of the ecological environment as ‘a [[nested arrangement|set of layers|layers|nested]] of structures, each contained within the next’. This approach represented a sharp departure from more traditional approaches to developmental psychology of the day, which he [[derided|made fun of|mocked]] as ‘the science of the strange behavior of children in strange situations with strange adults for the briefest possible periods of time’. His initial [[articulation|explanation|first version]] of EST identified four such structures, or systems—the microsystem, mesosystem, exosystem, and macrosystem—that are nested around a focal individual like a set of concentric circles, or as Bronfenbrenner suggested, a set of Russian dolls.",gs:"Bronfenbrenner said a child’s world is made of parts, each one inside the next. This was new. He made fun of old studies that watched kids with strangers, in strange rooms, for a few minutes. He named four worlds. They fit around the child like Russian dolls, one inside another."},
 {x:"At the lowest level of his nested [[hierarchy|ladder of levels|ladder]], [[microsystems|small worlds|small groups|microsys]] are settings where the focal individual plays a direct role, has direct experiences, and has direct social interactions with others. Using the classic example of a developing child, the family is a microsystem where the child plays a direct role (e.g., daughter, sibling), has direct experiences (e.g., enjoying family meals), and has direct social interactions with others (e.g., reading with mom, teasing baby brother). [[Mesosystems|links between worlds|links|mesosys]], within which microsystems are nested, include social interactions between two of the focal individual’s settings. In our example, a mesosystem could include a meeting between a parent (from the child’s family setting) and teacher (from the child’s school setting) about a child’s classroom behavior.",gs:"The smallest circle is a {{microsystem|microsys}}: a group where the child is right there, talking and doing things. The family is one: the child is a daughter and sister, eats meals, reads with mom and teases her baby brother. The next circle is a {{mesosystem|mesosys}}: a link between two of the child’s groups. For example, a parent and a teacher meet to talk about the child."},
 {x:"[[Exosystems|outside worlds|outside groups|exosys]], within which mesosystems are nested, include settings that influence the focal individual but in which the focal individual does not directly participate. For example, a district decision to [[consolidate|join together|combine]] schools to save money may lead to larger classroom and school sizes, changing the microsystems in which children interact. Finally, macrosystems, within which exosystems are nested, include broad cultural influences or [[ideologies|big beliefs|beliefs]] that have [[long-ranging consequences|far-reaching effects|big effects]] for the focal individual. In addition to the four core systems of EST, Bronfenbrenner later introduced the chronosystem, a system reflecting change or [[continuity|staying the same|no change]] across time that influences each of the other systems.",gs:"Next is the {{exosystem|exosys}}: a group the child is not in, but that still affects the child. If the school district joins schools to save money, classes get bigger, and the child’s class changes. The biggest circle is culture: the big ideas a whole society believes. Later he added time: the changes in a child’s life, like moving to high school."},
 {x:"Although nesting is a [[hallmark|famous feature|trademark]] of EST, many of the systems in EST are simply not nested in nature. In our example of a developing child above, the family microsystem is nested inside the educational policy-making exosystem, but it makes little sense to view the former as a [[subset|smaller part|part]] of the latter. Instead these are two [[distinct|separate|separate]] systems, arising in distinct settings—one that contains the child and one that does not—that influence one another. Thus, we argue that viewing ecological systems as nested [[undermines|weakens|weakens]] the theoretical [[coherence|making sense as a whole|sense]] and conceptual utility of EST.",gs:"Nesting is the famous part of the theory. But many of the worlds are not really inside each other. In the circle picture, the family is inside the education policy world. But a family is not a part of the policy world! They are two separate worlds. One has the child in it, one does not, and they affect each other. So the circle picture makes the theory less clear and less useful."},
 {h:"Ecological systems as networked",x:"For Bronfenbrenner, ‘a setting is a place where people can readily engage in face-to-face interaction’, and thus it has a primary [[spatial dimension|place side|place part]] and a [[secondary|less important|second]] [[interactional|about how people interact|people]] dimension. However, when it comes to forces that influence individuals’ development, are interactional factors really secondary to spatial ones? Compare the developmental consequences of couple A interacting lovingly at home, and couple B interacting lovingly on vacation. A social network, or structuralist, perspective [[contends|argues|says]] that common forces are likely to shape the development of these two couples because they are engaged in common [[patterns of interaction|ways of acting together|ways of acting]], even if in different locations. Similarly, compare the developmental consequences of couple A interacting lovingly at home, and couple C fighting at home. Here, a network perspective contends that different forces are likely to shape the development of these two couple because they are engaged in different patterns of social interaction, even if in the same location.",gs:"Bronfenbrenner said a {{setting|setting}} is first a place, and second the people talking there. But is the place really more important than how people treat each other? Think of couple A being loving at home, and couple B being loving on vacation. They act the same way, so they are shaped in the same way, even in different places. Now think of couple A being loving at home, and couple C fighting at home. Same place, but they act differently, so they are shaped differently."},
 {x:"Thus, although we continue to view settings as the [[fundamental building block|basic piece|basic piece]] of EST, adopting a network perspective, we offer a definition that [[mirrors but inverts|copies but flips|flips]] Bronfenbrenner’s by focusing primary attention of patterns of social interaction: a setting is a set of people engaged in social interaction, which necessarily occurs in, and is likely affected by the features of, a place. Having defined settings as sets of interacting people, we begin our networked [[reformulation|new version|new version]] of EST by observing that the ecological environment is an [[overlapping arrangement|set of groups that overlap|overlapping groups]] of structures, each directly or indirectly connected to the others by the direct and indirect social interactions of their participants. This definition not only highlights that systems are not necessarily nested within one another but also clarifies that it is individuals’ patterns of social interactions with other another that determine how systems relate to one another.",gs:"So the authors flip the definition: a setting is first a group of people interacting. The place still matters, but second. Then a child’s whole world is not circles inside circles. It is groups that overlap, linked by the people in them. This shows two things: the worlds don’t have to be inside each other, and the people in them decide how they connect."},
 {x:"First, a microsystem is a setting—or set of people engaged in social interaction—that includes the [[focal individual|the person in the middle|the main person|focal]]. Second, a mesosystem is a social interaction between [[participants|members|people in it]] in different settings that both include the focal individual. Finally, an exosystem is a setting—or set of people engaged in social interaction—that does not include, but whose participants interact directly or indirectly with, the focal individual. This example contains one setting, composed of G–H–I, that is an exosystem.",gs:"A {{microsystem|microsys}} is a group of people talking together that includes the main person. A {{mesosystem|mesosys}} is when people from two of the main person’s groups talk to each other. An {{exosystem|exosys}} is a group the main person is not in, but someone in it talks to them, or to someone who does. In the drawing, the group G, H and I is an exosystem for person A."},
 {x:"However, by more [[robustly specifying|clearly spelling out|spelling out]] the relationships between systems at different ecological levels, the networked model of EST also expands the [[utility|usefulness|use]] of the theory by making it possible to consider the ecological environment from the [[perspective|point of view|view]] of different focal individuals. If person A is the focal individual, as the figure illustrates, this person’s development is influenced by three microsystems, one mesosystem, and one exosystem. In contrast to person A, person C’s development is influenced by one microsystem (A–B–C–D), no mesosystems, and three exosystems (A–D–E, A–E–G–F and G–H–I). Although A–E–G–F is a microsystem for person A, it is an exosystem for person C.",gs:"The new model can do something new: look at the same web from different people’s point of view. For person A, the web has three small groups, one link and one outside group. For person C, the same web looks different: one small group, no links and three outside groups. The same group is “inside” for A but “outside” for C."},
 {h:"A hypothetical example",x:"In Figure 3, the focal child in our example participates in two different settings. The setting on the left, composed of the daily [[familial|family|family]] interactions of the child, mother, father, and sibling can be identified as a microsystem because the focal individual (i.e., the child) is a participant. The setting on the right, composed of the social interactions between the child, teacher, coach, and principal can also be identified as a microsystem, again because the child is a participant. One social interaction, between the child’s mother and the teacher, [[bridges between|connects|links]] these two microsystems.",gs:"In the picture, the child is part of two groups. One is her family: mom, dad, brother and her. She is in it, so it is a {{microsystem|microsys}}. The other is school: teacher, coach, principal and her. She is in it too. Her mom talks with her teacher. That talk is a bridge between home and school: a {{mesosystem|mesosys}}."},
 {x:"Figure 3 also contains a setting—that is, a set of people engaged in social interaction—that does not include the child. This setting, located in the upper right corner, is composed of the social interactions among three actors in the educational policy area: the [[superintendent|head of the school district|district boss]], mayor, and principal. For example, the mayor may start a healthy eating [[campaign|big plan to change something|plan]] in the city and may work with the superintendent and principal to [[eliminate|get rid of|remove]] unhealthy foods in the school cafeteria. These cafeteria changes will impact on the focal child’s school microsystem, and it may lead her to choose healthier options like fruits or vegetables at lunchtime. However, the focal child is only [[indirectly|through other people|through others]] connected to the setting responsible for these changes.",gs:"The picture also has a group the child is not in. It is the superintendent, the mayor and the principal, who make school rules. Say the mayor wants kids to eat healthy, and works with them to take junk food out of the cafeteria. Then the child may start choosing fruit at lunch. She never met the mayor. She is only linked through other people: an {{exosystem|exosys}}."},
 {x:"For example, the traditional model of EST views microsystems as nested within mesosystems. However, it makes little sense to suggest that the family or school settings are nested within the mother–teacher relationship. To be sure, the family and school microsystems are affected by the mother–teacher relationship, but they are not inside of it. Instead, as the networked model highlights, mesosystemic interactions like those between a mother and teacher can [[more properly|more correctly|better]] be understood as existing between [[intersecting|crossing|crossing]] microsystems.",gs:"The old model says the small groups are inside the links. But the family is not inside mom’s talk with the teacher! That talk affects home and school, but home and school are not inside it. The talk sits between the two groups, where they touch."},
 {x:"Finally, Figure 3 clearly illustrates how the specific nature and [[configuration|arrangement|setup]] of ecological systems influencing the development of an individual must be considered from the perspective of that individual. However, considering the social world outlined in Figure 3 from her [[sibling’s|brother’s|brother’s]] perspective leads to a different configuration. Thus, from his perspective, the school and the educational policy settings are both exosystems, to which he is indirectly connected through his sister. He does not directly participate in either the school or educational policy settings, but may still be influenced by his sister to eat his fruits and vegetables due to healthy eating habits that she picked up from her school’s new cafeteria policy.",gs:"Who is in which world depends on whose eyes you look through. From her little brother’s eyes, the picture changes. He is a toddler and not in school. So for him, school is an outside world, linked through his sister. Still, he may start eating fruit too, because his sister learned it at school."},
 {x:"In this article, we have argued that the ecological systems outlined in EST are more usefully [[conceptualized|thought of|seen]] as networked rather than nested. Firstly, it shifts the focus of attention away from where individuals interact and toward how and with whom they interact, which is essential to the extent that human development is a social process. Secondly, it allows researchers to examine more complex relationships among ecological systems, including a [[multiplicity|large number|many]] of different microsystems that only partially overlap, and mesosystems and exosystems that bridge these microsystems. Finally, by more explicitly [[incorporating|including|adding]] social networks into EST, it offers a path for moving from theory to method.",gs:"The authors’ main point: a child’s worlds are a web, not boxes inside boxes. First, it looks at how and with whom kids interact, not just where. Growing up happens with people. Second, it can show messy, real links: groups that partly overlap, and bridges between them. Last, it lets researchers actually measure the worlds, by mapping who talks to whom."}]};

STRUCT["nest"]={"0": [["Common view", "Although EST is widely recognized for underscoring the importance of interdependent and multilevel systems on individual development, the precise relationships of systems to one another remain elusive."], ["Background", "Bronfenbrenner originally described ecological systems at different levels as nested within one another, giving rise to EST’s classic graphic portrayal as a set of concentric circles."], ["Writer’s claim", "{However}, in this article, we argue that conceptualizing ecological systems as nested obscures the relationships between them."], ["Main idea", "{Instead}, we argue that ecological systems should be conceptualized as networked, where each system is defined in terms of the social relationships surrounding a focal individual."]], "1": [["Definition", "Bronfenbrenner described the topology of the ecological environment as ‘a nested arrangement of structures, each contained within the next’."], ["Reason", "This approach represented a sharp departure from more traditional approaches to developmental psychology of the day, which he derided as ‘the science of the strange behavior of children in strange situations with strange adults for the briefest possible periods of time’."], ["List", "His initial articulation of EST identified four such structures, or systems—the microsystem, mesosystem, exosystem, and macrosystem—that are nested around a focal individual like a set of concentric circles, or as Bronfenbrenner suggested, a set of Russian dolls."]], "2": [["Term + example", "At the lowest level of his nested hierarchy, microsystems are settings where the focal individual plays a direct role, has direct experiences, and has direct social interactions with others."], ["Example", "Using the classic example of a developing child, the family is a microsystem where the child plays a direct role (e.g., daughter, sibling), has direct experiences (e.g., enjoying family meals), and has direct social interactions with others (e.g., reading with mom, teasing baby brother)."], ["Term + example", "Mesosystems, within which microsystems are nested, include social interactions between two of the focal individual’s settings."], ["Example", "In our example, a mesosystem could include a meeting between a parent (from the child’s family setting) and teacher (from the child’s school setting) about a child’s classroom behavior."]], "3": [["Term", "Exosystems, within which mesosystems are nested, include settings that influence the focal individual but in which the focal individual does not directly participate."], ["Example", "{For example}, a district decision to consolidate schools to save money may lead to larger classroom and school sizes, changing the microsystems in which children interact."], ["Term + example", "{Finally}, macrosystems, within which exosystems are nested, include broad cultural influences or ideologies that have long-ranging consequences for the focal individual."], ["Added term", "{In addition to} the four core systems of EST, Bronfenbrenner later introduced the chronosystem, a system reflecting change or continuity across time that influences each of the other systems."]], "4": [["Turn", "{Although} nesting is a hallmark of EST, many of the systems in EST are simply not nested in nature."], ["Example", "In our example of a developing child above, the family microsystem is nested inside the educational policy-making exosystem, {but} it makes little sense to view the former as a subset of the latter."], ["Writer’s claim", "{Instead} these are two distinct systems, arising in distinct settings—one that contains the child and one that does not—that influence one another."], ["Point", "{Thus}, we argue that viewing ecological systems as nested undermines the theoretical coherence and conceptual utility of EST."]], "5": [["Background", "For Bronfenbrenner, ‘a setting is a place where people can readily engage in face-to-face interaction’, and thus it has a primary spatial dimension and a secondary interactional dimension."], ["Question", "{However}, when it comes to forces that influence individuals’ development, are interactional factors really secondary to spatial ones?"], ["Example", "Compare the developmental consequences of couple A interacting lovingly at home, and couple B interacting lovingly on vacation."], ["Explains", "A social network, or structuralist, perspective contends that common forces are likely to shape the development of these two couples {because} they are engaged in common patterns of interaction, {even if} in different locations."], ["Example", "{Similarly}, compare the developmental consequences of couple A interacting lovingly at home, and couple C fighting at home."], ["Explains", "Here, a network perspective contends that different forces are likely to shape the development of these two couple {because} they are engaged in different patterns of social interaction, {even if} in the same location."]], "6": [["Definition", "{Thus}, although we continue to view settings as the fundamental building block of EST, adopting a network perspective, we offer a definition that mirrors but inverts Bronfenbrenner’s by focusing primary attention of patterns of social interaction: a setting is a set of people engaged in social interaction, which necessarily occurs in, and is likely affected by the features of, a place."], ["Main idea", "Having defined settings as sets of interacting people, we begin our networked reformulation of EST by observing that the ecological environment is an overlapping arrangement of structures, each directly or indirectly connected to the others by the direct and indirect social interactions of their participants."], ["Point", "This definition not only highlights that systems are not necessarily nested within one another {but also} clarifies that it is individuals’ patterns of social interactions with other another that determine how systems relate to one another."]], "7": [["Term", "{First}, a microsystem is a setting—or set of people engaged in social interaction—that includes the focal individual."], ["Term", "{Second}, a mesosystem is a social interaction between participants in different settings that both include the focal individual."], ["Term", "{Finally}, an exosystem is a setting—or set of people engaged in social interaction—that does not include, but whose participants interact directly or indirectly with, the focal individual."], ["Example", "This example contains one setting, composed of G–H–I, that is an exosystem."]], "8": [["Point", "{However}, by more robustly specifying the relationships between systems at different ecological levels, the networked model of EST also expands the utility of the theory by making it possible to consider the ecological environment from the perspective of different focal individuals."], ["Example", "If person A is the focal individual, as the figure illustrates, this person’s development is influenced by three microsystems, one mesosystem, and one exosystem."], ["Contrast", "{In contrast to} person A, person C’s development is influenced by one microsystem (A–B–C–D), no mesosystems, and three exosystems (A–D–E, A–E–G–F and G–H–I)."], ["Conclusion", "{Although} A–E–G–F is a microsystem for person A, it is an exosystem for person C."]], "9": [["Example", "In Figure 3, the focal child in our example participates in two different settings."], ["Example", "The setting on the left, composed of the daily familial interactions of the child, mother, father, and sibling can be identified as a microsystem {because} the focal individual (i.e., the child) is a participant."], ["Example", "The setting on the right, composed of the social interactions between the child, teacher, coach, and principal can also be identified as a microsystem, again {because} the child is a participant."], ["Example + term", "One social interaction, between the child’s mother and the teacher, bridges between these two microsystems."]], "10": [["Example + term", "Figure 3 also contains a setting—that is, a set of people engaged in social interaction—that does not include the child."], ["Example", "This setting, located in the upper right corner, is composed of the social interactions among three actors in the educational policy area: the superintendent, mayor, and principal."], ["Example", "{For example}, the mayor may start a healthy eating campaign in the city and may work with the superintendent and principal to eliminate unhealthy foods in the school cafeteria."], ["Result", "These cafeteria changes will impact on the focal child’s school microsystem, and it may lead her to choose healthier options like fruits or vegetables at lunchtime."], ["Point", "{However}, the focal child is only indirectly connected to the setting responsible for these changes."]], "11": [["Contrast", "{For example}, the traditional model of EST views microsystems as nested within mesosystems."], ["Reply", "{However}, it makes little sense to suggest that the family or school settings are nested within the mother–teacher relationship."], ["Explains", "{To be sure}, the family and school microsystems are affected by the mother–teacher relationship, {but} they are not inside of it."], ["Main idea", "{Instead}, as the networked model highlights, mesosystemic interactions like those between a mother and teacher can more properly be understood as existing between intersecting microsystems."]], "12": [["Point", "{Finally}, Figure 3 clearly illustrates how the specific nature and configuration of ecological systems influencing the development of an individual must be considered from the perspective of that individual."], ["Contrast", "{However}, considering the social world outlined in Figure 3 from her sibling’s perspective leads to a different configuration."], ["Explains", "{Thus}, from his perspective, the school and the educational policy settings are both exosystems, to which he is indirectly connected through his sister."], ["Example", "He does not directly participate in either the school or educational policy settings, {but} may still be influenced by his sister to eat his fruits and vegetables due to healthy eating habits that she picked up from her school’s new cafeteria policy."]], "13": [["Conclusion", "In this article, we have argued that the ecological systems outlined in EST are more usefully conceptualized as networked rather than nested."], ["Reason 1", "{Firstly}, it shifts the focus of attention away from where individuals interact and toward how and with whom they interact, which is essential to the extent that human development is a social process."], ["Reason 2", "{Secondly}, it allows researchers to examine more complex relationships among ecological systems, including a multiplicity of different microsystems that only partially overlap, and mesosystems and exosystems that bridge these microsystems."], ["Reason 3", "{Finally}, by more explicitly incorporating social networks into EST, it offers a path for moving from theory to method."]]};GSENT["nest"]={"0": ["Everyone agrees that a child’s many worlds matter. But nobody is sure exactly how these worlds connect.", "Bronfenbrenner said the worlds sit {{inside each other|nested}}, so people draw them as circles inside circles.", "But these authors say the circle picture hides how the worlds really connect.", "They want a new picture: a {{web of people|networked}} around one child."], "1": ["Bronfenbrenner said a child’s world is made of parts, each one inside the next.", "This was new. He made fun of old studies that watched kids with strangers, in strange rooms, for a few minutes.", "He named four worlds. They fit around the child like Russian dolls, one inside another."], "2": ["The smallest circle is a {{microsystem|microsys}}: a group where the child is right there, talking and doing things.", "The family is one: the child is a daughter and sister, eats meals, reads with mom and teases her baby brother.", "The next circle is a {{mesosystem|mesosys}}: a link between two of the child’s groups.", "For example, a parent and a teacher meet to talk about the child."], "3": ["Next is the {{exosystem|exosys}}: a group the child is not in, but that still affects the child.", "If the school district joins schools to save money, classes get bigger, and the child’s class changes.", "The biggest circle is culture: the big ideas a whole society believes.", "Later he added time: the changes in a child’s life, like moving to high school."], "4": ["Nesting is the famous part of the theory. But many of the worlds are not really inside each other.", "In the circle picture, the family is inside the education policy world. But a family is not a part of the policy world!", "They are two separate worlds. One has the child in it, one does not, and they affect each other.", "So the circle picture makes the theory less clear and less useful."], "5": ["Bronfenbrenner said a {{setting|setting}} is first a place, and second the people talking there.", "But is the place really more important than how people treat each other?", "Think of couple A being loving at home, and couple B being loving on vacation.", "They act the same way, so they are shaped in the same way, even in different places.", "Now think of couple A being loving at home, and couple C fighting at home.", "Same place, but they act differently, so they are shaped differently."], "6": ["So the authors flip the definition: a setting is first a group of people interacting. The place still matters, but second.", "Then a child’s whole world is not circles inside circles. It is groups that overlap, linked by the people in them.", "This shows two things: the worlds don’t have to be inside each other, and the people in them decide how they connect."], "7": ["A {{microsystem|microsys}} is a group of people talking together that includes the main person.", "A {{mesosystem|mesosys}} is when people from two of the main person’s groups talk to each other.", "An {{exosystem|exosys}} is a group the main person is not in, but someone in it talks to them, or to someone who does.", "In the drawing, the group G, H and I is an exosystem for person A."], "8": ["The new model can do something new: look at the same web from different people’s point of view.", "For person A, the web has three small groups, one link and one outside group.", "For person C, the same web looks different: one small group, no links and three outside groups.", "The same group is “inside” for A but “outside” for C."], "9": ["In the picture, the child is part of two groups.", "One is her family: mom, dad, brother and her. She is in it, so it is a {{microsystem|microsys}}.", "The other is school: teacher, coach, principal and her. She is in it too.", "Her mom talks with her teacher. That talk is a bridge between home and school: a {{mesosystem|mesosys}}."], "10": ["The picture also has a group the child is not in.", "It is the superintendent, the mayor and the principal, who make school rules.", "Say the mayor wants kids to eat healthy, and works with them to take junk food out of the cafeteria.", "Then the child may start choosing fruit at lunch.", "She never met the mayor. She is only linked through other people: an {{exosystem|exosys}}."], "11": ["The old model says the small groups are inside the links.", "But the family is not inside mom’s talk with the teacher!", "That talk affects home and school, but home and school are not inside it.", "The talk sits between the two groups, where they touch."], "12": ["Who is in which world depends on whose eyes you look through.", "From her little brother’s eyes, the picture changes.", "He is a toddler and not in school. So for him, school is an outside world, linked through his sister.", "Still, he may start eating fruit too, because his sister learned it at school."], "13": ["The authors’ main point: a child’s worlds are a web, not boxes inside boxes.", "First, it looks at how and with whom kids interact, not just where. Growing up happens with people.", "Second, it can show messy, real links: groups that partly overlap, and bridges between them.", "Last, it lets researchers actually measure the worlds, by mapping who talks to whom."]};ROLE["nest"]={"0": ["claim", "names the problem and the authors’ answer in one paragraph"], "1": ["background", "explains the old model the authors want to change"], "2": ["example", "walks through each circle with one child"], "3": ["example", "the outer circles: policy, culture and time"], "4": ["counter", "the turn: the circles don’t fit reality"], "5": ["term", "redefines the building block, a “setting”"], "6": ["definition", "gives the new definition and the big new picture"], "7": ["example", "tries the new definitions on a made-up network of nine people"], "8": ["claim", "the surprise: what counts as which system depends on who you are"], "9": ["example", "builds the new picture around one child: family and school"], "10": ["example", "adds the world the child is not in"], "11": ["contrast", "compares the two pictures and shows why “inside” is wrong"], "12": ["claim", "the same world looks different from the little brother’s eyes"], "13": ["conclusion", "sums up what the new model gives researchers"]};
SEC["nest"]=[
 {id:"ns1",t:"The circle picture",paras:[0, 1, 2, 3, 4],look:"What is the old picture of a child’s worlds, and what is wrong with it?",logic:{"q": "What is the authors’ main complaint about the “Russian doll” picture?", "o": ["It has too many circles for students to remember", "Some systems are not really inside each other, so the picture hides how they connect", "Bronfenbrenner never drew it himself"], "a": 1, "why": "The family is inside the policy world, but it makes “little sense” to call one a part of the other. They are separate worlds that affect each other, so nesting hides the real links."},keys:[["The old model puts systems inside each other like circles or Russian dolls",/nest|circle|doll|inside|layer/i],["Micro, meso, exo, macro, chrono systems (family, school, policy, culture, time)",/micro|meso|exo|macro|chrono|family|school|policy|culture/i],["But many systems are not really inside each other",/not (really )?(inside|nested)|separate|distinct|makes little sense|wrong/i]],model:"The old model draws a child’s worlds as circles inside circles, like Russian dolls: family, then links between family and school, then policy, then culture. The authors say this is misleading, because many of these worlds are separate and only affect each other."},
 {id:"ns2",t:"People, not places",paras:[5, 6, 7, 8],look:"What is a “setting” in the new model, and how do the systems change?",logic:{"q": "Why do the authors compare couple A at home, couple B on vacation, and couple C fighting at home?", "o": ["To show that vacations are good for couples", "To show that how people interact matters more than where they are", "To prove that homes cause fights"], "a": 1, "why": "A and B are in different places but act the same, so similar forces shape them. A and C are in the same place but act differently, so different forces shape them. So the authors define a setting by interaction, not place."},keys:[["A setting is a group of people who interact, not mainly a place",/people|interact|not (a|the) place|not where/i],["The couples example: same place, different interaction matters more",/couple|home|vacation|fight/i],["Systems are defined by who talks to whom; systems overlap like a network",/overlap|network|connect|web|link/i],["The same group can be a microsystem for one person and an exosystem for another",/perspective|depends|person c|different (person|people)|for one/i]],model:"The authors change what a setting is: it is a group of people interacting, not a place. How people interact matters more than where (the couples example). Then each system is defined by who interacts with whom, so systems overlap like a web, and what counts as a microsystem depends on whose point of view you take."},
 {id:"ns3",t:"One child, two pictures",paras:[9, 10, 11, 12, 13],look:"In the child example, what is inside what, and what is only linked?",logic:{"q": "Why do the authors say the family is not “inside” the mother–teacher relationship?", "o": ["Because the mother and teacher never meet", "Because the talk between mother and teacher links two worlds; it doesn’t contain them", "Because the family is bigger than the school"], "a": 1, "why": "The mother–teacher talk affects family and school, but the family is not inside it. It sits between the two worlds, like a bridge, not a box."},keys:[["Family and school are two microsystems with the child in them",/family|school|microsystem/i],["The mother–teacher talk is a mesosystem that bridges them",/mother|teacher|bridge|link|mesosystem/i],["The mayor, superintendent and principal form an exosystem (healthy food example)",/mayor|superintendent|principal|exosystem|food|cafeteria|fruit/i],["These are linked, not inside each other; a sibling sees a different picture",/not inside|not nested|between|sibling|brother|different (picture|view)/i]],model:"In the child example, family and school are two small worlds with the child in them, and the mother’s talks with the teacher are a bridge between them. The mayor, superintendent and principal are a world outside the child that still reaches her (the healthy cafeteria). None of these sit inside each other, and her little brother would see a different picture."}];
CARDS["resist"]={word:"resistance",pos:"noun",rar:"rare",def:"Pushing back against something, like refusing to believe or act out a label others put on you.",zh:"抵抗",ex:"…a growing literature emphasizes how youth resist stereotypes.",parts:"re (back) + sistere (to stand): to stand back against.",ladder:["push back", "say no to a label", "stand against", "resistance"]};
CARDS["accommodate"]={word:"accommodate",pos:"verb",rar:"legendary",def:"To go along with something and fit yourself to it, here: to start acting like the label says.",zh:"迎合、顺应",ex:"In other words, youth may accommodate to stereotypes, endorsing and reinforcing stereotypes in their own identities.",parts:"ac (to) + commodus (fitting): to make yourself fit.",ladder:["go along", "fit in with", "act the way the label says", "accommodate"]};
CARDS["identity"]={word:"identity",pos:"noun",rar:"common",def:"Who you think you are and who you want to become.",zh:"身份认同",ex:"Adolescence is a developmental period when youth are preoccupied with their identities…",parts:"From Latin idem, “the same”: what stays the same about you.",ladder:["who I am", "how I see myself", "who I am and want to be", "identity"]};
CARDS["stoic"]={word:"stoic",pos:"adjective",rar:"legendary",def:"Not showing feelings, even when something hurts.",zh:"坚忍的、不动声色的",ex:"…they endorsed the idea that as boys they were to be independent, emotionally stoic, and heterosexual.",parts:"The Stoics were Greek thinkers who taught people to stay calm whatever happened.",ladder:["no feelings shown", "keeping it inside", "not showing hurt", "stoic"]};
CARDS["intersect"]={word:"intersectionality",pos:"noun",rar:"legendary",def:"The idea that your groups (like race and gender) mix together, so a label about “Black boys” is different from labels about “Black people” or “boys” alone.",zh:"交叉性",ex:"Using an intersectionality lens, we found three paths of resistance…",parts:"intersection = where two roads cross. You stand where race and gender cross.",ladder:["mixed groups", "where my groups cross", "race and gender together", "intersectionality"]};
CARDS["perpetuate"]={word:"perpetuate",pos:"verb",rar:"legendary",def:"To keep something going for a long time.",zh:"使延续",ex:"Rather than challenge these negative stereotypes, the “accommodators” tended to perpetuate them.",parts:"Same root as “perpetual” (lasting forever).",ladder:["keep going", "keep alive", "make it last", "perpetuate"]};
TEXTS["goals"]={id:"goals",genre:"Psychology interview study",short:"Goals",gcol:"--bad",src:"Journal of Adolescent Research · 2016 · 36 pages",title:"“I Have Goals to Prove All Those People Wrong and Not Fit Into Any One of Those Boxes”: Paths of [[Resistance|Pushing Back|Pushing Back|resist]] to [[Stereotypes|Labels about Groups|Group Labels|stereotype]] Among Black [[Adolescent|Teenage|Teen]] Males",by:"Leoandra Onnie Rogers and Niobe Way",note:"Selected sections in the authors’ own words and the boys’ own words, lightly trimmed (citations removed). Headings in [brackets] are ours.",paras:[
 {h:"[Social mirrors]",x:"Adolescence is a developmental period when youth are [[preoccupied with|busy thinking about|thinking about]] their [[identities|sense of who they are|who they are|identity]]—who they are and who they will become. These identities are tied to social expectations and stereotypes, which function like “social mirrors” reflecting society’s image of who and what one should be. Black males, for example, are [[routinely depicted|often shown|often shown]] as aggressive, hypersexual, and violent; they are gang members, criminals, or professional athletes. While this cultural image does not represent the [[vast majority|almost all|most]] of Black males, its dominance as a stereotype [[tangibly|really|really]] impacts how young Black males come to view themselves and make sense of their own identities.",gs:"Teens think a lot about who they are and who they will become. Labels from society work like mirrors. They show teens what society thinks they should be. For example, Black boys and men are often shown as violent, as criminals, or as sports stars. This picture doesn’t fit most Black males. But because it is everywhere, it really affects how Black boys see themselves."},
 {x:"Decades ago, Erik Erikson [[articulated|put into words|explained]] the influence of social expectations on identity processes, arguing that “a young person may well put his energy into becoming exactly what the careless and fearful community expects him to be.” In other words, youth may [[accommodate|go along with|give in|accommodate]] to stereotypes, [[endorsing and reinforcing|agreeing with and strengthening|agreeing with]] stereotypes in their own identities. A Black male, for example, in response to being stereotyped as threatening and aggressive reacts with violent [[outbursts|sudden bursts|bursts]] of anger. Or, being viewed by his teachers as a troublemaker who does not value education, a Black boy drops out of school.",gs:"Long ago, the scientist Erik Erikson warned: a teen may work hard to become just what a careless, scared community expects. In other words, teens may {{accommodate|accommodate}}: they start to act out the label. For example, a boy who is treated as dangerous may explode in anger. Or a boy whose teachers think he doesn’t care about school drops out."},
 {x:"This process of accommodation has been the focus of much research about Black males. At the same time, there is growing evidence that youth desire not to be a stereotype and, in fact, often resist stereotypes in ways that are [[beneficial|good|good]] to their health and well-being. An example of such resistance is when Black males [[cultivate|grow|build]] “scholar identities” and [[resolve to excel|decide to do very well|decide to shine]] in school despite the low expectations they face.",gs:"Most research on Black boys has studied this “giving in.” But more and more studies show that teens don’t want to be a label, and they push back in ways that keep them healthy. For example, some Black boys decide to be scholars and do great in school, even when people expect little of them."},
 {h:"[The study]",x:"The current study examined identity development as a process of resistance and accommodation to racial and gender stereotypes among Black [[adolescent|teen|teen]] males. Data were collected at Black Male Charter School (BMCS), an all-Black, all-male high school located in a Midwest [[urban center|city|city]]. The leaders describe BMCS as a space designed to provide its students with “positive [[counter-images|opposite pictures|better pictures]] of successful Black men” and give them a “vision for college.” They refer to the students as “scholars” and college graduation (not merely acceptance or attendance) defines the school’s [[primary mission|main goal|main goal]].",gs:"This study looks at how Black teen boys accept or push back on labels about race and about being a boy. The boys went to an all-Black, all-boys high school in a Midwest city. The school wanted to show them pictures of successful Black men and help them aim for college. Students were called “scholars,” and the goal was finishing college."},
 {h:"Findings",x:"In our analysis, we found more evidence of resistance to [[racial stereotypes|labels about race|race labels]] and more accommodation to gender stereotypes. Across the interviews, the majority of the boys were able to name and reject negative racial stereotypes in some form. For example, Monte, describing what other people think about Black people, said, “Society says that we are [[illiterate|unable to read|unable to read]] and that’s not true.” In contrast, when talking about gender, two thirds of the boys either stated that there were no stereotypes about boys or [[reiterated|repeated|repeated]] the stereotypes as “natural.” Ronald said, “Not really, especially being a boy I guess you’re supposed to act in a certain way—Well, not supposed to, but it just comes naturally… just guys like to get into trouble… like to fight, make fun of each other.” Although boys readily challenged stereotypes about the [[intellectual inferiority|being less smart|being less smart]] and [[incompetence|not being able to do things well|being bad at things]] of Black people, they endorsed the idea that as boys they were to be independent, [[emotionally stoic|not showing feelings|feelings hidden|stoic]], and heterosexual.",gs:"The boys pushed back on race labels, but went along with boy labels. Most boys could name a race label and say it was wrong. Monte said: “Society says that we can’t read, and that’s not true.” But about boys, two out of three said there were no labels, or that the labels were just “natural.” Ronald said boys just naturally like to get into trouble and fight. They fought the idea that Black people are not smart. But they agreed that boys should be tough, alone and not show feelings."},
 {x:"The pattern of more resistance to racial stereotypes and more accommodation to gender stereotypes became more [[prevalent|common|common]] over time. Gender accommodation was expressed in the repetition of phrases “I don’t care,” which [[downplays|makes smaller|hides]] emotion in alignment with masculine stoicism, and “I just do me,” which [[extols autonomy over relatedness|praises being on your own over being close to others|praises going alone]]. Devin said in 10th grade, “I don’t want to say I really don’t care about stuff but I really don’t let stuff bother me… So that’s how I became me, you know, Mr. Don’t Care.”",gs:"This pattern got stronger as the boys got older. More boys kept saying “I don’t care” (hide your feelings) and “I just do me” (don’t need anyone). Devin said he stopped letting things bother him, and became “Mr. Don’t Care.”"},
 {x:"At the same time, boys’ awareness of and resistance to racial stereotypes have become more [[pronounced|strong|strong]] over time, as boys understood their potential to [[disrupt|break up|break]] negative stereotypes. Michael said, “Sometimes it hurts a little bit, but then I don’t even think about it because as long as I know I’m not adding on to those stereotypes or adding a number to the statistics it doesn’t bother me because I know I’m doin’ my part.” It was this sense of [[agency|power to act|power]] in the face of racial stereotypes that seemed to [[sustain|keep going|keep up]] resistance over time.",gs:"At the same time, the boys pushed back harder on race labels, because they saw they could break them. Michael said the label hurts a little, but he is doing his part by not becoming a number in the bad statistics. Feeling that they could make a difference kept them pushing back."},
 {h:"Three paths of resistance",x:"Our [[within-case analysis|study of each boy one at a time|one-by-one look]] examined each subject along the [[dimensions|sides|sides]] of resistance (and accommodation) to racial stereotypes and gender stereotypes. We found three groups: the “Accommodators” (n = 5; 24%), the “Resisters” (n = 4; 19%), and the “Exceptions” (n = 12; 57%) who were characterized by viewing themselves as exceptions to the stereotypes. While differences between the case studies are emphasized, it is important to note the rich [[nuance|small differences|details]] and diversity across all of the boys’ identities.",gs:"The authors looked at each boy: did he push back on race labels? On boy labels? They found three groups: 5 Accommodators, 4 Resisters, and 12 Exceptions, who saw themselves as different from the label. Each boy is still his own person, with his own story."},
 {x:"The “accommodators” were a group of boys who, on the whole, [[exhibited|showed|showed]] little resistance and reinforced racial and gender stereotypes. Rather than challenge these negative stereotypes, the “accommodators” tended to [[perpetuate|keep going|keep alive|perpetuate]] them. When asked what he doesn’t like about being Black, Omar said, “Everybody think[s] you’re like the other Black person they see… And I’m like, don’t judge me; let me at least show you what I’m about before you judge me.” The “accommodators,” like Omar, did not necessarily believe the stereotypes to be true, but instead of rejecting them, they tried to [[repurpose|use for a new purpose|reuse]] them in order to survive.",gs:"Accommodators mostly went along with both race and boy labels. Instead of fighting the labels, they kept them going. Omar, one of them, said: people think every Black person is the same. Don’t judge me before you know me. They didn’t believe the labels. But they used the tough image to stay safe."},
 {x:"The “resisters” were more likely to see stereotypes as a [[system of oppression|unfair system that holds people down|unfair system]] that [[undermines|weakens|hurts]] an entire social group (e.g., Black people) rather than individuals. Marcus explained, “Society has its boxes for everybody, and they don’t like it when you like jump outside of it… You’re not supposed to be a bookworm, be feminine.” Marcus said, “My plan in life is to be as unique and [[extraordinary|amazing|amazing]] as possible… I have goals to prove all those people wrong and not fit into any one of those boxes.” He said, “I actually get kind of mad but I try to keep that anger [[under wraps|hidden|inside]]… So I try to focus it in, do my schoolwork, so I can break the stereotype.”",gs:"Resisters saw labels as something unfair that hurts a whole group, not just one person. Marcus said: society has boxes for everyone, and doesn’t like it when you jump out. His plan is to be one of a kind and prove everyone wrong. He gets mad, but he turns the anger into schoolwork to break the label."},
 {x:"Marcus said, “Guys aren’t supposed to be sensitive or show their feelings, or cry. That’s a big one… of course you gonna cry cause that’s like human nature, you’re supposed to cry, that’s why you have tear ducts in your body.” In contrast to the “accommodators” who viewed gender stereotypes as natural and beneficial, the “resisters” questioned the [[assumed privilege|supposed advantage|so-called perks]] of this [[gender ideology|set of beliefs about boys and girls|boy-girl beliefs]]. The “resisters” were [[acutely aware|very aware|very aware]] of what society said they were supposed to be and challenged the expectations by questioning the truth of the “boxes.”",gs:"Marcus said people think boys can’t cry. But crying is human. That’s why we have tears! Accommodators thought boy labels were natural and good. Resisters asked if they really were. Resisters knew what society expected, and asked: are these boxes even true?"},
 {x:"The final pattern identified was the “exceptions” who [[comprised|made up|made up]] the majority of the sample. They are so named because they viewed themselves as exceptions to the stereotypes. Jaire said, “I have to hold myself to a [[higher standard|higher bar|higher bar]] because people don’t think that African American males can do this and do that, like go to college, accomplish things.” But, unlike the “resisters” who challenged the truth of the stereotype, the “exceptions” [[established|built|built]] their identities viewing themselves as an exception to it. In other words, Jaire’s self-description suggests that other Black boys might be dumb and uneducated, but I’m not.",gs:"Most boys were Exceptions: they saw themselves as not like the label. Jaire said he must do better than everyone, because people think Black boys can’t go to college. But unlike Marcus, Jaire didn’t say the label was false. He said he was different from it. His message: maybe other Black boys fit the label, but I don’t."},
 {x:"Jaire said, “Like men, there’s not supposed to be any emotion in your decisions… Because men make hard decisions without emotion.” Jaire [[reiterates|repeats|repeats]] the stereotype that women are emotional (and therefore weak), whereas men are stoic (and therefore strong). The “exceptions” were characterized by this [[duality|two sides at once|two sides]] in responding to oppression: Resisting the oppression of racial stereotypes (specifically for the self) while also accommodating to the male privilege of gender stereotypes.",gs:"Jaire also said men should make choices without feelings. He repeats the label that women are too emotional and men are strong. So the Exceptions did two things at once: they fought race labels for themselves, but kept the boy labels that give men an advantage."}]};
